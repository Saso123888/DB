<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Phone5 Gemini Base</title>

  <meta name="theme-color" content="#020916">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <style>
    :root {
      --background: #020916;
      --panel: #07182e;
      --panel-light: #0b2444;
      --blue: #079cff;
      --cyan: #38e4ff;
      --purple: #a84cff;
      --red: #ff405b;
      --yellow: #ffd65a;
      --green: #32d77d;
      --text: #ffffff;
      --muted: #8ba4c7;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
      background:
        radial-gradient(
          circle at 50% 15%,
          #09284b 0%,
          #031327 38%,
          #020916 73%
        );
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    }

    body {
      min-height: 100dvh;
    }

    button,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      cursor: default;
      opacity: 0.48;
    }

    .app {
      width: 100%;
      max-width: 480px;
      min-height: 100dvh;
      margin: 0 auto;
      padding:
        max(24px, env(safe-area-inset-top))
        20px
        max(24px, env(safe-area-inset-bottom));
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
      animation: screen-in 0.25s ease;
    }

    @keyframes screen-in {
      from {
        opacity: 0;
        transform: translateY(5px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* PRVI ZASLON */

    .setup-space {
      height: 20px;
    }

    .person-card {
      display: grid;
      grid-template-columns: 112px minmax(0, 1fr);
      gap: 16px;
      align-items: center;
      margin-bottom: 20px;
      padding: 20px 18px;
      border: 1px solid rgba(7, 156, 255, 0.75);
      border-radius: 23px;
      background:
        linear-gradient(
          145deg,
          rgba(9, 39, 75, 0.97),
          rgba(7, 23, 46, 0.94)
        );
      box-shadow:
        inset 0 0 25px rgba(0, 157, 255, 0.08),
        0 0 22px rgba(0, 157, 255, 0.13);
    }

    .person-card.person-two {
      border-color: rgba(168, 76, 255, 0.82);
      box-shadow:
        inset 0 0 25px rgba(168, 76, 255, 0.08),
        0 0 22px rgba(168, 76, 255, 0.16);
    }

    .avatar-wrap {
      display: flex;
      justify-content: center;
    }

    .avatar-button {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 105px;
      height: 105px;
      padding: 0;
      border: 1px solid var(--cyan);
      border-radius: 50%;
      background:
        radial-gradient(
          circle,
          rgba(25, 148, 255, 0.86),
          rgba(0, 69, 167, 0.3) 58%,
          transparent 74%
        );
      box-shadow:
        0 0 12px #008cff,
        0 0 34px rgba(0, 157, 255, 0.46);
    }

    .person-two .avatar-button {
      border-color: #b664ff;
      background:
        radial-gradient(
          circle,
          rgba(157, 75, 255, 0.85),
          rgba(75, 24, 145, 0.3) 58%,
          transparent 74%
        );
      box-shadow:
        0 0 12px #a84cff,
        0 0 34px rgba(168, 76, 255, 0.43);
    }

    .person-icon {
      font-size: 57px;
      line-height: 1;
    }

    .swap-icon {
      position: absolute;
      right: -4px;
      bottom: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      border: 1px solid var(--cyan);
      border-radius: 50%;
      background: #073874;
      color: #ffffff;
      font-size: 21px;
      box-shadow: 0 0 12px #008cff;
    }

    .person-two .swap-icon {
      border-color: #bd78ff;
      background: #41196f;
      box-shadow: 0 0 12px #a84cff;
    }

    .language-box {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 60px;
      padding: 4px 13px;
      border: 1px solid rgba(105, 160, 226, 0.34);
      border-radius: 14px;
      background: rgba(8, 28, 54, 0.86);
    }

    .flag {
      flex: 0 0 auto;
      font-size: 25px;
    }

    select {
      flex: 1;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: #ffffff;
      font-size: 16px;
    }

    select option {
      color: #111111;
    }

    .start-button {
      width: 100%;
      height: 70px;
      margin-top: 30px;
      border: 1px solid #45e3ff;
      border-radius: 21px;
      background: linear-gradient(135deg, #04b5ff, #0063ed);
      color: #ffffff;
      font-size: 26px;
      font-weight: 750;
      box-shadow:
        0 0 14px #009cff,
        0 0 33px rgba(0, 157, 255, 0.43),
        inset 0 0 18px rgba(255, 255, 255, 0.13);
    }

    .start-button:active {
      transform: scale(0.985);
    }

    /* DRUGI ZASLON */

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 23px;
    }

    .next-button,
    .stop-button {
      height: 64px;
      border-radius: 18px;
      color: #ffffff;
    }

    .next-button {
      border: 1px solid #39dbff;
      background: linear-gradient(135deg, #08b7ff, #0675ed);
      font-size: 35px;
      box-shadow: 0 0 17px rgba(0, 157, 255, 0.45);
    }

    .next-button.person-two-active {
      border-color: #c47bff;
      background: linear-gradient(135deg, #b14fff, #722de1);
      box-shadow: 0 0 17px rgba(168, 76, 255, 0.5);
    }

    .stop-button {
      border: 1px solid #ff6076;
      background: linear-gradient(135deg, #a71e36, #66152a);
      font-size: 19px;
      font-weight: 700;
      box-shadow: 0 0 15px rgba(255, 64, 91, 0.34);
    }

    .stop-square {
      display: inline-block;
      width: 17px;
      height: 17px;
      margin-right: 8px;
      border-radius: 3px;
      background: #ffffff;
      vertical-align: -2px;
    }

    .language-route {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      min-height: 34px;
      margin-bottom: 13px;
      font-size: 14px;
    }

    .route-item {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .route-arrow {
      color: #a0bbdc;
      font-size: 22px;
    }

    .active-person {
      display: flex;
      justify-content: center;
      margin-bottom: 2px;
    }

    .active-avatar {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 49px;
      height: 49px;
      border: 1px solid #168fff;
      border-radius: 50%;
      background: #0d376e;
      font-size: 28px;
      box-shadow: 0 0 14px rgba(0, 157, 255, 0.36);
    }

    .active-avatar.person-two-active {
      border-color: #ba68ff;
      background: #421a73;
      box-shadow: 0 0 14px rgba(168, 76, 255, 0.44);
    }

    /* GLAVNI KROG */

    .orb-area {
      display: flex;
      justify-content: center;
      margin: 8px 0 12px;
    }

    .orb-rings {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 260px;
      height: 260px;
      border: 1px solid rgba(0, 113, 255, 0.6);
      border-radius: 50%;
    }

    .orb-rings::before,
    .orb-rings::after {
      content: "";
      position: absolute;
      border: 1px solid rgba(0, 119, 255, 0.5);
      border-radius: 50%;
      pointer-events: none;
    }

    .orb-rings::before {
      inset: 18px;
    }

    .orb-rings::after {
      inset: 36px;
    }

    .main-orb {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 180px;
      height: 180px;
      border: 1px solid #60efff;
      border-radius: 50%;
      background:
        radial-gradient(
          circle,
          #1acbff,
          #087cff 45%,
          #004fc0 70%,
          #06234c
        );
      font-size: 72px;
      box-shadow:
        0 0 13px #20d8ff,
        0 0 42px rgba(0, 145, 255, 0.8);
      transition:
        background 0.3s ease,
        box-shadow 0.3s ease;
      user-select: none;
    }

    /* SNEMANJE */

    .orb-rings.recording {
      animation: ring-pulse 1.08s ease-in-out infinite;
    }

    .orb-rings.recording::before {
      animation: inner-ring-pulse 1.08s ease-in-out infinite;
    }

    .orb-rings.recording::after {
      animation: inner-ring-pulse 1.08s 0.17s ease-in-out infinite;
    }

    .orb-rings.recording .main-orb {
      animation: microphone-pulse 1.08s ease-in-out infinite;
    }

    .orb-rings.recording.person-two-active {
      border-color: rgba(168, 76, 255, 0.72);
    }

    .orb-rings.recording.person-two-active::before,
    .orb-rings.recording.person-two-active::after {
      border-color: rgba(168, 76, 255, 0.56);
    }

    .orb-rings.recording.person-two-active .main-orb {
      border-color: #d19bff;
      background:
        radial-gradient(
          circle,
          #d87bff,
          #a244f5 45%,
          #6a23bf 70%,
          #2a124d
        );
      box-shadow:
        0 0 13px #c870ff,
        0 0 42px rgba(168, 76, 255, 0.77);
    }

    @keyframes microphone-pulse {
      0%,
      100% {
        transform: scale(0.94);
      }

      50% {
        transform: scale(1.05);
      }
    }

    @keyframes ring-pulse {
      0%,
      100% {
        transform: scale(0.94);
        opacity: 0.67;
      }

      50% {
        transform: scale(1.04);
        opacity: 1;
      }
    }

    @keyframes inner-ring-pulse {
      0%,
      100% {
        opacity: 0.35;
      }

      50% {
        opacity: 1;
      }
    }

    /* OBDELAVA */

    .orb-rings.processing .main-orb {
      border-color: #ffe887;
      background:
        radial-gradient(
          circle,
          #fff29b,
          #f0b81a 48%,
          #8c6000
        );
      box-shadow:
        0 0 15px #ffd44b,
        0 0 46px rgba(255, 180, 0, 0.72);
      animation: processing-pulse 0.8s ease-in-out infinite;
    }

    @keyframes processing-pulse {
      0%,
      100% {
        transform: scale(0.96);
      }

      50% {
        transform: scale(1.035);
      }
    }

    /* PREDVAJANJE */

    .orb-rings.speaking .main-orb {
      border-color: #dc9cff;
      background:
        radial-gradient(
          circle,
          #e28cff,
          #a341f2 48%,
          #5816a5
        );
      box-shadow:
        0 0 15px #ca64ff,
        0 0 46px rgba(168, 76, 255, 0.76);
      animation: speaking-pulse 0.72s ease-in-out infinite;
    }

    @keyframes speaking-pulse {
      0%,
      100% {
        transform: scale(0.96);
      }

      50% {
        transform: scale(1.04);
      }
    }

    /* FAZE */

    .stages {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .stage {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 52px;
      border: 1px solid #4e759f;
      border-radius: 50%;
      background: #06162c;
      color: #7891b0;
      font-size: 23px;
      opacity: 0.42;
      transition: 0.25s ease;
    }

    .stage.active {
      color: #ffffff;
      opacity: 1;
    }

    .stage.listen.active {
      border-color: #35dfff;
      box-shadow: 0 0 15px #009cff;
    }

    .stage.process.active {
      border-color: #ffd748;
      box-shadow: 0 0 15px #e5aa00;
    }

    .stage.speak.active {
      border-color: #ca6cff;
      box-shadow: 0 0 15px #a84cff;
    }

    .stage-arrow {
      color: #7293ba;
      font-size: 22px;
    }

    .status {
      min-height: 27px;
      margin: 13px 0 17px;
      color: #2dccff;
      font-size: 19px;
      font-weight: 700;
      text-align: center;
    }

    .status.processing-status {
      color: var(--yellow);
    }

    .status.speaking-status {
      color: #d384ff;
    }

    .status.error-status {
      color: #ff7184;
    }

    /* REZULTAT */

    .translation {
      min-height: 128px;
      padding: 17px;
      border: 1px solid rgba(96, 138, 187, 0.36);
      border-radius: 18px;
      background: rgba(8, 29, 56, 0.85);
    }

    .translation-line {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      min-height: 34px;
      font-size: 17px;
      line-height: 1.42;
    }

    .translation-line + .translation-line {
      margin-top: 13px;
      padding-top: 13px;
      border-top: 1px solid rgba(129, 159, 195, 0.35);
    }

    .translation-text {
      flex: 1;
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .translated-text {
      color: var(--yellow);
      font-size: 20px;
      font-weight: 700;
    }

    .placeholder {
      color: #7387a5;
    }

    .error-box {
      display: none;
      margin-top: 14px;
      padding: 12px 14px;
      border: 1px solid rgba(255, 104, 126, 0.58);
      border-radius: 13px;
      background: rgba(116, 17, 39, 0.33);
      color: #ffc1ca;
      font-size: 14px;
      line-height: 1.42;
    }

    .error-box.visible {
      display: block;
    }

    @media (max-width: 370px) {
      .app {
        padding-left: 14px;
        padding-right: 14px;
      }

      .person-card {
        grid-template-columns: 90px minmax(0, 1fr);
        padding: 15px 11px;
      }

      .avatar-button {
        width: 85px;
        height: 85px;
      }

      .person-icon {
        font-size: 47px;
      }

      .orb-rings {
        width: 220px;
        height: 220px;
      }

      .main-orb {
        width: 155px;
        height: 155px;
        font-size: 62px;
      }

      .language-route {
        gap: 7px;
        font-size: 12px;
      }
    }
  </style>
</head>

<body>

  <main class="app">

    <!-- PRVI ZASLON -->

    <section id="setupScreen" class="screen active">

      <div class="setup-space"></div>

      <div class="person-card">

        <div class="avatar-wrap">
          <button
            id="person1Button"
            class="avatar-button"
            type="button"
            aria-label="Zamenjaj prvo osebo"
          >
            <span id="person1Icon" class="person-icon">👨</span>
            <span class="swap-icon" aria-hidden="true">↔</span>
          </button>
        </div>

        <div class="language-box">

          <span id="person1Flag" class="flag">
            🇸🇮
          </span>

          <select
            id="person1Language"
            aria-label="Jezik prve osebe"
          >
            <option value="sl" selected>
              Slovenščina
            </option>

            <option value="hu">
              Magyar
            </option>
          </select>

        </div>

      </div>

      <div class="person-card person-two">

        <div class="avatar-wrap">
          <button
            id="person2Button"
            class="avatar-button"
            type="button"
            aria-label="Zamenjaj drugo osebo"
          >
            <span id="person2Icon" class="person-icon">👩</span>
            <span class="swap-icon" aria-hidden="true">↔</span>
          </button>
        </div>

        <div class="language-box">

          <span id="person2Flag" class="flag">
            🇭🇺
          </span>

          <select
            id="person2Language"
            aria-label="Jezik druge osebe"
          >
            <option value="sl">
              Slovenščina
            </option>

            <option
