<style>
*{
  box-sizing:border-box;
}

:root{
  --bg:#061224;

  --text:#f7f9ff;
  --muted:#a8b4c8;

}

html,
body{

  min-height:100%;

  background:
    radial-gradient(
      circle at 50% 10%,
      #0c2e58 0,
      #061224 42%,

    );

  color:var(--text);
  font-family:Arial,sans-serif;
}

body{
  padding:

    max(18px,env(safe-area-inset-bottom));
}

.app{
  max-width:520px;
  margin:auto;
}

.hidden{
  display:none!important;
}

/* START */

.brand{
  text-align:center;
  margin:8px 0 26px;
}

.brand img{
  width:82px;
  height:82px;
  border-radius:23px;
}

.appName{
  margin-top:10px;
  text-align:center;
  color:#d7e1f1;
  font-size:18px;
  font-weight:900;
}

.card{

  padding:18px;

  border-radius:22px;

  background:
    linear-gradient(
      145deg,
      #102a4c,
      #0a1930

}

input,
select{
  width:100%;
  height:57px;

  padding:0 15px;

  border-radius:15px;
  outline:none;

  color:#fff;
  font-size:18px;
}

input{
  margin-bottom:12px;
}

select{
  border:1px solid #5276a5;
  background:#0b1c34;
}

.nameA{
  border:1px solid #168cff;
  background:#08244a;
  color:#72bdff;
  font-weight:900;
}

.nameB{
  border:1px solid #13d7b9;
  background:#073a35;
  color:#67efd9;
  font-weight:900;
}

.start{
  width:100%;
  height:68px;

  border:0;
  border-radius:18px;

  background:
    linear-gradient(
      90deg,
      #087df1,
      #079efe
    );

  color:#fff;
  font-size:19px;
  font-weight:900;

  box-shadow:
    0 12px 30px #087df155;
}

/* AI IZBIRA SPODAJ */

.aiBox{
  margin-top:18px;
  padding:12px;

  border:1px solid #213a5c;
  border-radius:18px;

  background:#08172b;
}

.aiChoices{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.aiButton{
  height:44px;

  border:1px solid #385984;
  border-radius:14px;

  background:#0b1c34;
  color:#b7c4d7;

  font-size:13px;
  font-weight:900;
}

.aiButton.selected.gemini{
  border-color:#9b63ff;

  background:
    linear-gradient(
      90deg,
      #6e45c9,
      #a34ee8
    );

  color:#fff;
}

.aiButton.selected.groq{
  border-color:#ff9f38;

  background:
    linear-gradient(
      90deg,
      #d66b15,
      #ef9835
    );

  color:#fff;
}

/* HEADER */

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:24px;
}

.top img{
  width:44px;
  height:44px;
  border-radius:13px;
}

.gear{
  border:0;
  background:transparent;
  color:#b7c6da;
  font-size:25px;
}

/* TOP BUTTONS */

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-bottom:17px;
}

.next,
.end{
  height:56px;
  border-radius:27px;
  font-size:15px;
  font-weight:900;
}

.next{
  border:0;
}

.next.a{
  background:
    linear-gradient(
      90deg,
      #078eff,
      #0a7bee
    );

  color:#fff;
}

.next.b{
  background:
    linear-gradient(
      90deg,
      #18dfbd,
      #10bda4
    );

  color:#042d28;
}

.next:disabled{
  opacity:.40;
}

.end{
  border:1px solid #a63b4b;

  background:
    linear-gradient(
      90deg,
      #d62943,
      #a71730
    );

  color:#fff;
}

/* DIRECTION */

.direction{
  text-align:center;
  color:#d4dbea;
  font-size:14px;
}

/* SPEAKER */

.speaker{
  margin:19px 0 0;
  text-align:center;
  font-size:34px;
  font-weight:900;
}

.speakLabel{
  margin-top:5px;
  text-align:center;
  color:#bfcae0;
  font-size:20px;
  font-weight:900;
}

.speakLabel.processing{
  color:#ffd54a;
}

.speakLabel.playing{
  color:#cdb2ff;
}

/* CENTER */

.pulse{
  position:relative;

  display:grid;
  place-items:center;

  width:205px;
  height:205px;

  margin:14px auto 16px;
}

.ring{
  position:absolute;

  border:2px solid #087fff66;
  border-radius:50%;

  animation:ringPulse 1.6s infinite;
}

.r1{
  inset:0;
}

.r2{
  inset:20px;
  animation-delay:.25s;
}

.r3{
  inset:39px;
  animation-delay:.5s;
}

.pulse.b .ring{
  border-color:#13dfc566;
}

.pulse.paused .ring{
  animation:none;
  opacity:.10;
}

@keyframes ringPulse{
  0%{
    transform:scale(.82);
    opacity:.95;
  }

  70%{
    transform:scale(1.05);
    opacity:.12;
  }

  100%{
    transform:scale(1.05);
    opacity:0;
  }
}

/* MICROPHONE */

.mic{
  position:relative;
  z-index:2;

  width:128px;
  height:128px;

  border:0;
  border-radius:50%;

  font-size:57px;

  animation:
    micBeat
    1.1s
    ease-in-out
    infinite;
}

.mic.a{
  color:#fff;

  background:
    radial-gradient(
      circle at 35% 25%,
      #43c8ff,
      #0784ff 50%,
      #0b58c4
    );

  box-shadow:
    0 0 22px #078cff,
    0 0 55px #078cff99;
}

.mic.b{
  color:#032d29;

  background:
    radial-gradient(
      circle at 35% 25%,
      #5cf3de,
      #13d7b9 50%,
      #078a78
    );

  box-shadow:
    0 0 22px #13dfc5,
    0 0 55px #13dfc599;
}

@keyframes micBeat{
  0%,100%{
    transform:scale(1);
  }

  50%{
    transform:scale(1.09);
  }
}

/* PROCESSING / PLAYING ICON */

.stateIcon{
  position:relative;
  z-index:2;

  width:128px;
  height:128px;

  display:grid;
  place-items:center;

  border:0;
  border-radius:50%;

}

.stateIcon.processing{
  background:
    radial-gradient(
      circle at 35% 25%,

      #f6c744 55%,
      #a76d00
    );

  box-shadow:
    0 0 24px #ffd54a,
    0 0 56px #ffd54a66;
}

.stateIcon.playing{
  background:
    radial-gradient(
      circle at 35% 25%,
      #d7c7ff,
      #8d62ea 55%,
      #503098
    );

  box-shadow:
    0 0 24px #9b63ff,
    0 0 56px #9b63ff66;
}

/* RESULT */

.resultTitle{

.translated{

  font-weight:900;
}

.instruction{
  margin:16px 0 8px;

  color:#aebbcf;
  font-size:12px;
}

.notice{
  min-height:22px;
  text-align:center;
  color:#ffd36b;
  font-size:13px;
}
</style>

<script>

/* SUPABASE */

const URL =
  "https://kdixpdxmdfdbxpbuljfe.supabase.co";

const KEY =
  "sb_publishable_khd42rEJpa3-1uyVb01Jjg_7rBp-FT8";

const HEADERS = {
  apikey:KEY,
  Authorization:"Bearer " + KEY
};


/* LANGUAGES */

const LANGUAGES = {

  sl:{
    name:"🇸🇮 Slovenščina",
    tts:"sl-SI"
  },

  hu:{
    name:"🇭🇺 Magyar",
    tts:"hu-HU"
  },

  en:{
    name:"🇬🇧 English",
    tts:"en-US"
  },

  tl:{
    name:"🇵🇭 Filipino",
    tts:"fil-PH"
  },

  it:{
    name:"🇮🇹 Italiano",
    tts:"it-IT"
  },

  hr:{
    name:"🇭🇷 Hrvatski",
    tts:"hr-HR"
  },

  sq:{
    name:"🇦🇱 Shqip",
    tts:"sq-AL"
  },

  de:{
    name:"🇩🇪 Deutsch",
    tts:"de-DE"
  },

  es:{
    name:"🇪🇸 Español",
    tts:"es-ES"
  },

  ru:{
    name:"🇷🇺 Русский",
    tts:"ru-RU"
  },

  uk:{
    name:"🇺🇦 Українська",
    tts:"uk-UA"
  },

  bg:{
    name:"🇧🇬 Български",
    tts:"bg-BG"
  },

  pl:{
    name:"🇵🇱 Polski",
    tts:"pl-PL"
  },

  cs:{
    name:"🇨🇿 Čeština",
    tts:"cs-CZ"
  },

  sk:{
    name:"🇸🇰 Slovenčina",
    tts:"sk-SK"
  }

};


const $ =
  id =>
    document.getElementById(
      id
    );


/* POPULATE LANGUAGES */

Object.entries(
  LANGUAGES
)
.forEach(
  ([code,language]) => {

    $("langA").add(
      new Option(
        language.name,
        code
      )
    );

    $("langB").add(
      new Option(
        language.name,
        code
      )
    );

  }
);


$("langA").value =
  "sl";

$("langB").value =
  "en";


/* STATE */

let turn =
  0;

let recorder =
  null;

let mediaStream =
  null;

let audioChunks =
  [];

let busy =
  false;

let recordingId =
  0;

let activeRecordingId =
  0;

let processingId =
  0;

let lastPlayedId =
  0;

let sessionId =
  0;

let inactivityTimer =
  null;


/*
Zadnja izbira AI.
Privzeto Whisper zaradi hitrosti.
*/

let selectedAI =
  localStorage.getItem(
    "phone5AI"
  )
  ||
  "groq";


/* PERSON */

function personName(
  person
){

  if(person === 0){

    return (
      $("nameA")
        .value
        .trim()
      ||
      "Oseba A"
    );

  }

  return (
    $("nameB")
      .value
      .trim()
    ||
    "Oseba B"
  );

}


function personLanguage(
  person
){

  return (
    person === 0
      ? $("langA").value
      : $("langB").value
  );

}


/* AI SELECTOR */

function chooseAI(
  ai
){

  selectedAI =
    ai;

  localStorage.setItem(
    "phone5AI",
    selectedAI
  );

  renderAI();

}


function renderAI(){

  $("aiGemini")
    .classList
    .toggle(
      "selected",
      selectedAI ===
        "gemini"
    );

  $("aiGroq")
    .classList
    .toggle(
      "selected",
      selectedAI ===
        "groq"
    );

}


/* ACTIVITY */

function markActivity(){

  if(
    inactivityTimer
  ){

    clearTimeout(
      inactivityTimer
    );

  }

  inactivityTimer =
    setTimeout(
      () => {

        if(
          !$("talk")
            .classList
            .contains(
              "hidden"
            )
        ){

          clearConversation();

        }

      },

      120000
    );

}


/* UI STATE MACHINE */

function setUIState(
  state
){

  const isA =
    turn === 0;


  /*
  LISTENING
  */

  if(
    state ===
    "listening"
  ){

    $("pulse")
      .classList
      .remove(
        "paused"
      );

    $("stateLabel").textContent =
      "GOVORI";

    $("stateLabel").className =
      "speakLabel";

    $("mic").textContent =
      "🎤";

    $("mic").className =
      "mic " +
      (
        isA
          ? "a"
          : "b"
      );

    $("pulse").className =
      "pulse " +
      (
        isA
          ? "a"
          : "b"
      );

    $("next").disabled =
      false;

    return;

  }


  /*
  PROCESSING
  */

  if(
    state ===
    "processing"
  ){

    $("pulse")
      .classList
      .add(
        "paused"
      );

    $("stateLabel").textContent =
      "BODI TIHO";

    $("stateLabel").className =
      "speakLabel processing";

    $("mic").textContent =
      "🤫";

    $("mic").className =
      "stateIcon processing";

    $("next").disabled =
      true;

    return;

  }


  /*
  PLAYING
  */

  $("pulse")
    .classList
    .add(
      "paused"
    );

  $("stateLabel").textContent =
    "POSLUŠAJ";

  $("stateLabel").className =
    "speakLabel playing";

  $("mic").textContent =
    "🔊";

  $("mic").className =
    "stateIcon playing";

  $("next").disabled =
    true;

}


/* RENDER SPEAKER */

function render(){

  const source =
    personLanguage(
      turn
    );

  const target =
    personLanguage(
      turn === 0
        ? 1
        : 0
    );

  const listener =
    personName(
      turn === 0
        ? 1
        : 0
    );


  $("speaker").textContent =
    personName(
      turn
    );


  $("direction").textContent =
    LANGUAGES[source].name +
    " → " +
    LANGUAGES[target].name;


  $("next").textContent =
    "NAPREJ → " +
    listener;


  $("next").className =
    "next " +
    (
      turn === 0
        ? "a"
        : "b"
    );


  setUIState(
    "listening"
  );


  startRecording();

}


/* TTS UNLOCK */

function unlockTTS(){

  try{

    speechSynthesis.cancel();

    const utterance =
      new SpeechSynthesisUtterance(
        " "
      );

    utterance.lang =
      LANGUAGES[
        personLanguage(0)
      ].tts;

    utterance.volume =
      0.01;

    speechSynthesis.speak(
      utterance
    );

    setTimeout(
      () =>
        speechSynthesis.resume(),
      80
    );

  }
  catch(error){

    console.log(
      "TTS unlock",
      error
    );

  }

}


/* START CONVERSATION */

function startConversation(){

  sessionId++;

  processingId =
    0;

  lastPlayedId =
    0;

  activeRecordingId =
    0;

  turn =
    0;


  $("setup")
    .classList
    .add(
      "hidden"
    );

  $("talk")
    .classList
    .remove(
      "hidden"
    );


  unlockTTS();

  markActivity();

  render();

}


/* START RECORDING */

async function startRecording(){

  if(
    busy
    ||
    recorder?.state ===
      "recording"
  ){

    return;

  }


  const mySession =
    sessionId;

  const myRecordingId =
    ++recordingId;


  activeRecordingId =
    myRecordingId;


  /*
  Kill old audio completely.
  */

  if(
    mediaStream
  ){

    mediaStream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );

  }


  mediaStream =
    null;

  recorder =
    null;

  audioChunks =
    [];


  try{

    const newStream =
      await navigator
        .mediaDevices
        .getUserMedia({
          audio:true
        });


    if(
      mySession !==
        sessionId
      ||
      myRecordingId !==
        activeRecordingId
    ){

      newStream
        .getTracks()
        .forEach(
          track =>
            track.stop()
        );

      return;

    }


    mediaStream =
      newStream;


    let options =
      {};


    if(
      MediaRecorder
        .isTypeSupported(
          "audio/mp4"
        )
    ){

      options = {
        mimeType:
          "audio/mp4"
      };

    }
    else if(
      MediaRecorder
        .isTypeSupported(
          "audio/webm"
        )
    ){

      options = {
        mimeType:
          "audio/webm"
      };

    }


    const newRecorder =
      new MediaRecorder(
        mediaStream,
        options
      );


    recorder =
      newRecorder;


    const localChunks =
      [];


    newRecorder.ondataavailable =
      event => {

        if(
          event.data.size
          &&
          mySession ===
            sessionId
          &&
          myRecordingId ===
            activeRecordingId
          &&
          recorder ===
            newRecorder
        ){

          localChunks.push(
            event.data
          );

        }

      };


    newRecorder.start();

    audioChunks =
      localChunks;

    $("notice").textContent =
      "";

  }
  catch(error){

    if(
      mySession ===
        sessionId
    ){

      $("notice").textContent =
        "Napaka mikrofona: " +
        error.message;

    }

  }

}


/* STOP RECORDING */

function stopRecording(

  expectedRecordingId =
    activeRecordingId,

  expectedSession =
    sessionId

){

  return new Promise(
    resolve => {

      const activeRecorder =
        recorder;

      const activeStream =
        mediaStream;


      if(
        !activeRecorder
        ||
        activeRecorder.state !==
          "recording"
        ||
        expectedSession !==
          sessionId
        ||
        expectedRecordingId !==
          activeRecordingId
      ){

        activeStream
          ?.getTracks()
          .forEach(
            track =>
              track.stop()
          );

        resolve();
        return;

      }


      activeRecorder.onstop =
        () =>
          resolve();


      activeRecorder.stop();


      activeStream
        ?.getTracks()
        .forEach(
          track =>
            track.stop()
        );

    }
  );

}


/* AI REQUEST */

async function translateAudio(

  frozenChunks,

  frozenRecorder,

  sourceLanguage,

  targetLanguage

){

  const mime =
    frozenRecorder
      ?.mimeType
    ||
    "audio/webm";


  const extension =
    mime.includes(
      "mp4"
    )
      ? "m4a"
      : "webm";


  const blob =
    new Blob(
      frozenChunks,
      {
        type:mime
      }
    );


  if(
    blob.size <
    500
  ){

    throw new Error(
      "Posnetek je prekratek."
    );

  }


  const file =
    new File(
      [blob],
      "voice." +
      extension,
      {
        type:mime
      }
    );


  const form =
    new FormData();


  form.append(
    "audio",
    file
  );


  form.append(
    "language",
    sourceLanguage
  );


  form.append(
    "target_language",
    targetLanguage
  );


  /*
  WHISPER -> existing Groq endpoint
  GEMINI -> Gemini endpoint
  */

  const endpoint =
    selectedAI ===
      "gemini"
      ? "voice-transcribe-gemini"
      : "voice-transcribe";


  const response =
    await fetch(

      URL +
      "/functions/v1/" +
      endpoint,

      {

        method:"POST",

        headers:
          HEADERS,

        body:
          form

      }

    );


  const raw =
    await response.text();


  let data;


  try{

    data =
      JSON.parse(
        raw
      );

  }
  catch{

    throw new Error(
      "Neveljaven odgovor AI."
    );

  }


  if(
    !response.ok
  ){

    throw new Error(
      data.detail ||
      data.error ||
      raw
    );

  }


  if(
    !data.text
    ||
    !data.translated
  ){

    throw new Error(
      "AI ni zaznal zanesljivega govora."
    );

  }


  return data;

}


/* FIND VOICE */

function findVoice(
  languageCode
){

  const target =
    LANGUAGES[
      languageCode
    ].tts
      .toLowerCase();


  const base =
    target
      .split("-")[0];


  const voices =
    speechSynthesis
      .getVoices();


  return (

    voices.find(
      voice =>
        voice.lang
          .toLowerCase() ===
        target
    )

    ||

    voices.find(
      voice =>
        voice.lang
          .toLowerCase()
          .startsWith(base)
    )

    ||

    null

  );

}


/* SPEAK ONCE */

function speakOnce(

  text,

  languageCode,

  playId,

  playSession

){

  return new Promise(
    resolve => {


      if(
        !text
        ||
        playSession !==
          sessionId
        ||
        playId !==
          processingId
        ||
        lastPlayedId ===
          playId
      ){

        resolve(false);
        return;

      }


      lastPlayedId =
        playId;


      speechSynthesis.cancel();


      const utterance =
        new SpeechSynthesisUtterance(
          text
        );


      utterance.lang =
        LANGUAGES[
          languageCode
        ].tts;


      const voice =
        findVoice(
          languageCode
        );


      if(voice){

        utterance.voice =
          voice;

      }


      utterance.rate =
        0.92;

      utterance.pitch =
        1;

      utterance.volume =
        1;


      let finished =
        false;


      const timeout =
        setTimeout(
          () =>
            finish(false),

          Math.max(
            7000,
            text.length * 170
          )
        );


      function finish(
        success
      ){

        if(finished){
          return;
        }


        finished =
          true;


        clearTimeout(
          timeout
        );


        if(
          playSession !==
            sessionId
          ||
          playId !==
            processingId
        ){

          resolve(false);
          return;

        }


        resolve(
          success
        );

      }


      utterance.onend =
        () =>
          finish(true);


      utterance.onerror =
        () =>
          finish(false);


      speechSynthesis.speak(
        utterance
      );


      setTimeout(
        () =>
          speechSynthesis.resume(),
        100
      );

    }
  );

}


/* NEXT */

async function nextTurn(){

  markActivity();


  if(busy){
    return;
  }


  const requestedRecordingId =
    activeRecordingId;


  const requestedSession =
    sessionId;


  if(
    !recorder
    ||
    recorder.state !==
      "recording"
  ){

    return;

  }


  busy =
    true;


  setUIState(
    "processing"
  );


  const spokenTurn =
    turn;


  const sourceLanguage =
    personLanguage(
      spokenTurn
    );


  const targetLanguage =
    personLanguage(
      spokenTurn === 0
        ? 1
        : 0
    );


  const myProcessingId =
    ++processingId;


  const frozenRecorder =
    recorder;


  try{

    /*
    STOP first.
    No recording during processing.
    */

    await stopRecording(
      requestedRecordingId,
      requestedSession
    );


    /*
    Wait for last MediaRecorder chunk.
    */

    await new Promise(
      resolve =>
        setTimeout(
          resolve,
          100
        )
    );


    const frozenChunks =
      audioChunks.slice();


    if(
      requestedSession !==
        sessionId
      ||
      myProcessingId !==
        processingId
    ){

      return;

    }


    $("notice").textContent =

      selectedAI ===
        "gemini"
        ? "Gemini prevaja ..."
        : "Whisper prevaja ...";


    const data =
      await translateAudio(

        frozenChunks,

        frozenRecorder,

        sourceLanguage,

        targetLanguage

      );


    if(
      requestedSession !==
        sessionId
      ||
      myProcessingId !==
        processingId
    ){

      return;

    }


    $("original").textContent =
      data.text;


    $("translated").textContent =
      data.translated;


    $("result")
      .classList
      .remove(
        "hidden"
      );


    /*
    Processing finished.
    User should listen.
    */

    setUIState(
      "playing"
    );


    $("notice").textContent =
      "Predvajam prevod ...";


    await speakOnce(

      data.translated,

      targetLanguage,

      myProcessingId,

      requestedSession

    );


    if(
      requestedSession !==
        sessionId
      ||
      myProcessingId !==
        processingId
    ){

      return;

    }


    /*
    TTS finished.
    Now switch speaker.
    */

    turn =
      spokenTurn === 0
        ? 1
        : 0;


    /*
    Completely destroy old audio.
    */

    audioChunks =
      [];

    recorder =
      null;

    mediaStream =
      null;


    busy =
      false;


    $("notice").textContent =
      "";


    /*
    Opens NEW microphone
    for the new speaker.
    */

    render();

  }
  catch(error){

    if(
      requestedSession ===
        sessionId
      &&
      myProcessingId ===
        processingId
    ){

      $("notice").textContent =
        "Napaka: " +
        error.message;


      audioChunks =
        [];

      recorder =
        null;

      mediaStream =
        null;

      busy =
        false;


      /*
      Same speaker tries again.
      */

      setUIState(
        "listening"
      );


      await startRecording();

    }

  }
  finally{

    if(
      requestedSession ===
        sessionId
    ){

      busy =
        false;

    }

  }

}


/* CLEAR SESSION */

async function clearConversation(){

  /*
  Invalidates old async calls.
  */

  sessionId++;

  processingId++;

  activeRecordingId =
    ++recordingId;

  lastPlayedId =
    0;


  if(
    inactivityTimer
  ){

    clearTimeout(
      inactivityTimer
    );

  }

  inactivityTimer =
    null;


  /*
  Stop speech immediately.
  */

  speechSynthesis.cancel();


  const oldRecorder =
    recorder;

  const oldStream =
    mediaStream;


  if(
    oldRecorder
    &&
    oldRecorder.state ===
      "recording"
  ){

    oldRecorder.onstop =
      null;


    try{

      oldRecorder.stop();

    }
    catch(error){

      console.log(
        error
      );

    }

  }


  oldStream
    ?.getTracks()
    .forEach(
      track =>
        track.stop()
    );


  /*
  Clear conversation data.
  */

  audioChunks =
    [];

  recorder =
    null;

  mediaStream =
    null;

  busy =
    false;

  turn =
    0;


  $("original").textContent =
    "";

  $("translated").textContent =
    "";

  $("result")
    .classList
    .add(
      "hidden"
    );

  $("notice").textContent =
    "";


  $("talk")
    .classList
    .add(
      "hidden"
    );


  $("setup")
    .classList
    .remove(
      "hidden"
    );

}

/* CLEANUP */

window.addEventListener(
  "beforeunload",
  () => {

    sessionId++;

    processingId++;

    activeRecordingId =
      ++recordingId;


    if(
      inactivityTimer
    ){

      clearTimeout(
        inactivityTimer
      );

    }


    speechSynthesis.cancel();


    mediaStream
      ?.getTracks()
      .forEach(
        track =>
          track.stop()
      );

  }
);
