<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Phone5 - 6 Languages</title>

<meta name="theme-color" content="#020916">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
:root{
  --bg:#020916;
  --panel:#07182e;
  --blue:#079cff;
  --cyan:#38e4ff;
  --purple:#a84cff;
  --red:#ff405b;
  --yellow:#ffd65a;
  --text:#fff;
  --muted:#8ba4c7;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  min-height:100%;
  background:
    radial-gradient(circle at 50% 15%,
      #09284b 0%,
      #031327 38%,
      #020916 73%);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}

body{
  min-height:100dvh;
}

button,select{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  width:100%;
  max-width:480px;
  min-height:100dvh;
  margin:auto;
  padding:
    max(24px,env(safe-area-inset-top))
    20px
    max(24px,env(safe-area-inset-bottom));
}

.screen{
  display:none;
}

.screen.active{
  display:block;
}

/* PERSON */

.person-card{
  display:grid;
  grid-template-columns:110px 1fr;
  gap:16px;
  align-items:center;

  padding:20px 18px;
  margin-bottom:20px;

  border:1px solid rgba(7,156,255,.75);
  border-radius:23px;

  background:
    linear-gradient(
      145deg,
      rgba(9,39,75,.97),
      rgba(7,23,46,.94)
    );

  box-shadow:
    0 0 22px rgba(0,157,255,.13);
}

.person-card.two{
  border-color:rgba(168,76,255,.82);

  box-shadow:
    0 0 22px rgba(168,76,255,.16);
}

.avatar{
  position:relative;

  width:100px;
  height:100px;

  display:flex;
  align-items:center;
  justify-content:center;

  border:1px solid var(--cyan);
  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(25,148,255,.86),
      rgba(0,69,167,.30) 58%,
      transparent 74%
    );

  color:white;
  font-size:55px;

  box-shadow:
    0 0 12px #008cff,
    0 0 32px rgba(0,157,255,.45);
}

.two .avatar{
  border-color:#b664ff;

  background:
    radial-gradient(
      circle,
      rgba(157,75,255,.85),
      rgba(75,24,145,.30) 58%,
      transparent 74%
    );

  box-shadow:
    0 0 12px #a84cff,
    0 0 32px rgba(168,76,255,.42);
}

.swap-person{
  position:absolute;
  right:-4px;
  bottom:2px;

  width:36px;
  height:36px;

  display:flex;
  align-items:center;
  justify-content:center;

  border:1px solid var(--cyan);
  border-radius:50%;

  background:#073874;

  font-size:20px;
}

.two .swap-person{
  border-color:#bd78ff;
  background:#41196f;
}

/* LANGUAGE */

.language-box{
  display:flex;
  align-items:center;
  gap:10px;

  min-height:60px;

  padding:4px 12px;

  border:1px solid rgba(105,160,226,.34);
  border-radius:14px;

  background:#0b2444;
}

.flag{
  font-size:25px;
}

select{
  width:100%;
  min-width:0;

  border:0;
  outline:0;

  background:transparent;
  color:white;

  font-size:16px;
}

select option{
  color:#111;
}

/* LANGUAGE SWAP */

.swap-languages{
  display:block;

  width:58px;
  height:48px;

  margin:-3px auto 15px;

  border:0;

  background:transparent;

  color:var(--cyan);

  font-size:32px;
}

/* START */

.start{
  width:100%;
  height:70px;

  margin-top:26px;

  border:1px solid var(--cyan);
  border-radius:21px;

  background:
    linear-gradient(135deg,#04b5ff,#0063ed);

  color:white;

  font-size:30px;
  font-weight:700;

  box-shadow:
    0 0 13px #009cff,
    0 0 32px rgba(0,157,255,.43);
}

/* LIVE */

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;

  margin-bottom:22px;
}

.next,
.stop{
  height:64px;

  border-radius:18px;

  color:white;

  font-size:31px;
  font-weight:700;
}

.next{
  border:1px solid var(--cyan);
  background:#087cff;
}

.next:disabled{
  opacity:.4;
}

.stop{
  border:1px solid #ff6076;
  background:#81192f;
}

.route{
  min-height:34px;

  text-align:center;

  font-size:16px;
}

.active-person{
  text-align:center;

  margin-top:12px;

  font-size:38px;
}

/* ORB */

.orb{
  width:200px;
  height:200px;

  margin:25px auto 20px;

  display:flex;
  align-items:center;
  justify-content:center;

  border:1px solid #60efff;
  border-radius:50%;

  background:
    radial-gradient(
      circle,
      #1acbff,
      #087cff 45%,
      #004fc0 70%,
      #06234c
    );

  font-size:72px;

  box-shadow:
    0 0 13px #20d8ff,
    0 0 42px rgba(0,145,255,.80);
}

.orb.recording{
  animation:pulse 1.05s ease-in-out infinite;
}

.orb.processing{
  border-color:#ffe887;

  background:
    radial-gradient(
      circle,
      #fff29b,
      #f0b81a 48%,
      #8c6000
    );

  box-shadow:
    0 0 46px rgba(255,180,0,.72);
}

.orb.speaking{
  border-color:#dc9cff;

  background:
    radial-gradient(
      circle,
      #e28cff,
      #a341f2 48%,
      #5816a5
    );

  box-shadow:
    0 0 46px rgba(168,76,255,.76);
}

@keyframes pulse{
  0%,100%{
    transform:scale(.94);
  }

  50%{
    transform:scale(1.05);

    box-shadow:
      0 0 20px #38e4ff,
      0 0 70px rgba(0,157,255,.95);
  }
}

/* STAGES */

.stages{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
}

.stage{
  width:50px;
  height:50px;

  display:flex;
  align-items:center;
  justify-content:center;

  border:1px solid #4e759f;
  border-radius:50%;

  background:#06162c;

  font-size:22px;

  opacity:.35;
}

.stage.active{
  opacity:1;
}

.stage.listen.active{
  border-color:#35dfff;
  box-shadow:0 0 15px #009cff;
}

.stage.process.active{
  border-color:#ffd748;
  box-shadow:0 0 15px #e5aa00;
}

.stage.speak.active{
  border-color:#ca6cff;
  box-shadow:0 0 15px #a84cff;
}

.arrow{
  color:#7293ba;
  font-size:21px;
}

.status{
  margin:12px 0 17px;

  text-align:center;

  color:#2dccff;

  font-size:19px;
  font-weight:700;
}

/* RESULT */

.result{
  min-height:125px;

  padding:17px;

  border:1px solid rgba(96,138,187,.36);
  border-radius:18px;

  background:rgba(8,29,56,.85);
}

.result-row{
  display:flex;
  align-items:flex-start;
  gap:12px;

  min-height:34px;

  line-height:1.4;
}

.result-row + .result-row{
  margin-top:13px;
  padding-top:13px;

  border-top:
    1px solid rgba(129,159,195,.35);
}

.text{
  flex:1;
}

.translated{
  color:var(--yellow);

  font-size:20px;
  font-weight:700;
}

.error{
  margin-top:14px;

  color:#ff7184;

  line-height:1.4;
}

/* SMALL PHONE */

@media(max-width:370px){

  .app{
    padding-left:14px;
    padding-right:14px;
  }

  .person-card{
    grid-template-columns:85px 1fr;

    padding:14px 11px;
  }

  .avatar{
    width:80px;
    height:80px;

    font-size:44px;
  }

  .orb{
    width:175px;
    height:175px;

    font-size:62px;
  }

}

</style>
</head>

<script>

(() => {

"use strict";


/* ==========================================
   CONFIG
========================================== */

const SUPABASE_URL =
  "https://kdixpdxmdfdbxpbuljfe.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_khd42rEJpa3-1uyVb01Jjg_7rBp-FT8";


const FUNCTION_URL =
  SUPABASE_URL +
  "/functions/v1/voice-transcribe-gemini";


/* ==========================================
   LANGUAGES
========================================== */

const LANGUAGES = {

  sl:{
    name:"Slovenščina",
    flag:"🇸🇮",
    locale:"sl-SI"
  },

  hu:{
    name:"Magyar",
    flag:"🇭🇺",
    locale:"hu-HU"
  },

  en:{
    name:"English",
    flag:"🇬🇧",
    locale:"en-GB"
  },

  pl:{
    name:"Polski",
    flag:"🇵🇱",
    locale:"pl-PL"
  },

  it:{
    name:"Italiano",
    flag:"🇮🇹",
    locale:"it-IT"
  },

  hr:{
    name:"Hrvatski",
    flag:"🇭🇷",
    locale:"hr-HR"
  }

};


/* ==========================================
   STATE
========================================== */

const state = {

  person1:{
    gender:"male",
    language:"sl"
  },

  person2:{
    gender:"female",
    language:"hu"
  },

  activePerson:1,

  running:false,

  recording:false,

  processing:false,

  stream:null,

  recorder:null,

  chunks:[]

};


/* ==========================================
   ELEMENTS
========================================== */

const $ =
  id =>
    document.getElementById(id);


const setupScreen =
  $("setupScreen");


const liveScreen =
  $("liveScreen");


const person1Avatar =
  $("person1Avatar");


const person2Avatar =
  $("person2Avatar");


const person1Icon =
  $("person1Icon");


const person2Icon =
  $("person2Icon");


const language1 =
  $("language1");


const language2 =
  $("language2");


const flag1 =
  $("flag1");


const flag2 =
  $("flag2");


const swapLanguages =
  $("swapLanguages");


const startButton =
  $("startButton");


const nextButton =
  $("nextButton");


const stopButton =
  $("stopButton");


const route =
  $("route");


const activePersonElement =
  $("activePerson");


const orb =
  $("orb");


const listenStage =
  $("listenStage");


const processStage =
  $("processStage");


const speakStage =
  $("speakStage");


const status =
  $("status");


const sourceFlag =
  $("sourceFlag");


const targetFlag =
  $("targetFlag");


const originalText =
  $("originalText");


const translatedText =
  $("translatedText");


const setupError =
  $("setupError");


const liveError =
  $("liveError");


/* ==========================================
   ACTIVE / TARGET
========================================== */

function getActivePerson(){

  return state.activePerson === 1
    ? state.person1
    : state.person2;

}


function getTargetPerson(){

  return state.activePerson === 1
    ? state.person2
    : state.person1;

}


/* ==========================================
   SETUP DISPLAY
========================================== */

function updateSetup(){

  person1Icon.textContent =
    state.person1.gender === "male"
      ? "👨"
      : "👩";


  person2Icon.textContent =
    state.person2.gender === "male"
      ? "👨"
      : "👩";


  flag1.textContent =
    LANGUAGES[
      state.person1.language
    ].flag;


  flag2.textContent =
    LANGUAGES[
      state.person2.language
    ].flag;

}


/* ==========================================
   PERSON TOGGLE
========================================== */

person1Avatar.addEventListener(
  "click",
  () => {

    state.person1.gender =
      state.person1.gender === "male"
        ? "female"
        : "male";


    updateSetup();

  }
);


person2Avatar.addEventListener(
  "click",
  () => {

    state.person2.gender =
      state.person2.gender === "male"
        ? "female"
        : "male";


    updateSetup();

  }
);


/* ==========================================
   LANGUAGE CHANGE
========================================== */

language1.addEventListener(
  "change",
  () => {

    state.person1.language =
      language1.value;


    updateSetup();

  }
);


language2.addEventListener(
  "change",
  () => {

    state.person2.language =
      language2.value;


    updateSetup();

  }
);


/* ==========================================
   SWAP LANGUAGES
========================================== */

swapLanguages.addEventListener(
  "click",
  () => {

    const first =
      language1.value;


    language1.value =
      language2.value;


    language2.value =
      first;


    state.person1.language =
      language1.value;


    state.person2.language =
      language2.value;


    updateSetup();

  }
);


/* ==========================================
   LIVE DISPLAY
========================================== */

function updateConversation(){

  const speaker =
    getActivePerson();


  const listener =
    getTargetPerson();


  const speakerLanguage =
    LANGUAGES[
      speaker.language
    ];


  const listenerLanguage =
    LANGUAGES[
      listener.language
    ];


  route.textContent =
    speakerLanguage.flag +
    " " +
    speakerLanguage.name +
    "  →  " +
    listenerLanguage.flag +
    " " +
    listenerLanguage.name;


  activePersonElement.textContent =
    speaker.gender === "male"
      ? "👨"
      : "👩";


  sourceFlag.textContent =
    speakerLanguage.flag;


  targetFlag.textContent =
    listenerLanguage.flag;

}


/* ==========================================
   UI STATES
========================================== */

function clearStages(){

  listenStage.classList.remove(
    "active"
  );


  processStage.classList.remove(
    "active"
  );


  speakStage.classList.remove(
    "active"
  );


  orb.className =
    "orb";

}


function showListening(){

  clearStages();


  orb.classList.add(
    "recording"
  );


  orb.textContent =
    "🎙️";


  listenStage.classList.add(
    "active"
  );


  status.textContent =
    "Poslušam ...";


  nextButton.disabled =
    false;

}


function showProcessing(){

  clearStages();


  orb.classList.add(
    "processing"
  );


  orb.textContent =
    "🤫";


  processStage.classList.add(
    "active"
  );


  status.textContent =
    "Prevajam ...";


  nextButton.disabled =
    true;

}


function showSpeaking(){

  clearStages();


  orb.classList.add(
    "speaking"
  );


  orb.textContent =
    "🔊";


  speakStage.classList.add(
    "active"
  );


  status.textContent =
    "Predvajam ...";


  nextButton.disabled =
    true;

}


/* ==========================================
   MICROPHONE
========================================== */

async function getMicrophone(){

  if(
    state.stream &&
    state.stream
      .getAudioTracks()
      .some(
        track =>
          track.readyState === "live"
      )
  ){

    return state.stream;

  }


  state.stream =
    await navigator.mediaDevices
      .getUserMedia({

        audio:{
          echoCancellation:true,
          noiseSuppression:true,
          autoGainControl:true
        }

      });


  return state.stream;

}


/* ==========================================
   MEDIARECORDER OPTIONS
========================================== */

function getRecorderOptions(){

  const types = [

    "audio/mp4",

    "audio/webm;codecs=opus",

    "audio/webm"

  ];


  for(
    const mimeType of types
  ){

    if(
      MediaRecorder.isTypeSupported &&
      MediaRecorder.isTypeSupported(
        mimeType
      )
    ){

      return {
        mimeType
      };

    }

  }


  return {};

}


/* ==========================================
   START RECORDING
========================================== */

async function startRecording(){

  if(
    !state.running ||
    state.recording ||
    state.processing
  ){

    return;

  }


  liveError.textContent =
    "";


  try{

    const stream =
      await getMicrophone();


    state.chunks =
      [];


    state.recorder =
      new MediaRecorder(

        stream,

        getRecorderOptions()

      );


    state.recorder.ondataavailable =
      event => {

        if(
          event.data &&
          event.data.size > 0
        ){

          state.chunks.push(
            event.data
          );

        }

      };


    state.recorder.start(
      250
    );


    state.recording =
      true;


    showListening();

  }
  catch(error){

    console.error(error);


    liveError.textContent =
      "Mikrofon ni dosegljiv ali nima dovoljenja.";

  }

}


/* ==========================================
   STOP RECORDING
========================================== */

function stopRecording(){

  return new Promise(

    resolve => {


      if(
        !state.recorder ||
        !state.recording
      ){

        resolve(null);

        return;

      }


      const recorder =
        state.recorder;


      recorder.onstop =
        () => {


          const mimeType =
            recorder.mimeType ||
            "audio/webm";


          const blob =
            new Blob(

              state.chunks,

              {
                type:mimeType
              }

            );


          state.recording =
            false;


          state.recorder =
            null;


          state.chunks =
            [];


          resolve(blob);

        };


      try{

        recorder.stop();

      }
      catch(error){

        state.recording =
          false;


        state.recorder =
          null;


        resolve(null);

      }

    }

  );

}


/* ==========================================
   SEND TO GEMINI
========================================== */

async function sendToGemini(
  audioBlob
){

  const speaker =
    getActivePerson();


  const listener =
    getTargetPerson();


  const mimeType =
    audioBlob.type ||
    "audio/webm";


  let extension =
    "webm";


  if(
    mimeType.includes(
      "mp4"
    )
  ){

    extension =
      "m4a";

  }


  const audioFile =
    new File(

      [audioBlob],

      "phone5." +
      extension,

      {
        type:mimeType
      }

    );


  const form =
    new FormData();


  form.append(
    "audio",
    audioFile
  );


  form.append(
    "language",
    speaker.language
  );


  form.append(
    "source_language",
    speaker.language
  );


  form.append(
    "target_language",
    listener.language
  );


  const response =
    await fetch(

      FUNCTION_URL,

      {

        method:"POST",

        headers:{

          apikey:
            SUPABASE_KEY,

          Authorization:
            "Bearer " +
            SUPABASE_KEY

        },

        body:form

      }

    );


  const raw =
    await response.text();


  let data;


  try{

    data =
      JSON.parse(
        raw
      );

  }
  catch(error){

    throw new Error(

      raw ||
      "Neveljaven odgovor strežnika."

    );

  }


  if(!response.ok){

    throw new Error(

      data.error ||
      data.detail ||
      data.message ||
      (
        "HTTP " +
        response.status
      )

    );

  }


  return normalizeResponse(
    data
  );

}


/* ==========================================
   NORMALIZE GEMINI RESPONSE
========================================== */

function firstText(
  values
){

  for(
    const value of values
  ){

    if(
      typeof value === "string" &&
      value.trim()
    ){

      return value.trim();

    }

  }


  return "";

}


function normalizeResponse(
  data
){

  const original =
    firstText([

      data.text,

      data.transcript,

      data.transcription,

      data.original,

      data.original_text,

      data.source_text,

      data.result?.text,

      data.result?.transcript,

      data.data?.text,

      data.data?.transcript

    ]);


  const translation =
    firstText([

      data.translated,

      data.translation,

      data.translated_text,

      data.target_text,

      data.result?.translated,

      data.result?.translation,

      data.data?.translated,

      data.data?.translation

    ]);


  if(
    !original &&
    !translation
  ){

    throw new Error(
      "Gemini ni vrnil besedila."
    );

  }


  return {

    original:
      original ||
      translation,

    translation:
      translation ||
      original

  };

}


/* ==========================================
   SPEECH SYNTHESIS
========================================== */

function speak(
  text
){

  return new Promise(

    resolve => {


      if(
        !text ||
        !(
          "speechSynthesis"
          in window
        )
      ){

        resolve();

        return;

      }


      const listener =
        getTargetPerson();


      const language =
        LANGUAGES[
          listener.language
        ];


      showSpeaking();


      window
        .speechSynthesis
        .cancel();


      const utterance =
        new SpeechSynthesisUtterance(
          text
        );


      utterance.lang =
        language.locale;


      utterance.rate =
        .94;


      utterance.pitch =
        listener.gender ===
        "female"
          ? 1.07
          : .94;


      let finished =
        false;


      function end(){

        if(finished){
          return;
        }


        finished =
          true;


        resolve();

      }


      utterance.onend =
        end;


      utterance.onerror =
        end;


      window
        .speechSynthesis
        .speak(
          utterance
        );


      setTimeout(

        end,

        Math.max(
          3500,
          text.length * 120
        )

      );

    }

  );

}


/* ==========================================
   START
========================================== */

startButton.addEventListener(
  "click",
  async () => {


    setupError.textContent =
      "";


    state.person1.language =
      language1.value;


    state.person2.language =
      language2.value;


    if(
      state.person1.language ===
      state.person2.language
    ){

      setupError.textContent =
        "Izberi dva različna jezika.";


      return;

    }


    if(
      !navigator.mediaDevices ||
      !navigator.mediaDevices
        .getUserMedia
    ){

      setupError.textContent =
        "Brskalnik ne podpira mikrofona.";


      return;

    }


    if(
      typeof MediaRecorder ===
      "undefined"
    ){

      setupError.textContent =
        "Brskalnik ne podpira snemanja zvoka.";


      return;

    }


    state.activePerson =
      1;


    state.running =
      true;


    state.processing =
      false;


    originalText.textContent =
      "...";


    translatedText.textContent =
      "...";


    setupScreen
      .classList
      .remove(
        "active"
      );


    liveScreen
      .classList
      .add(
        "active"
      );


    updateConversation();


    await startRecording();

  }

);


/* ==========================================
   ✓ NEXT
========================================== */

nextButton.addEventListener(
  "click",
  async () => {


    if(
      !state.running ||
      !state.recording ||
      state.processing
    ){

      return;

    }


    state.processing =
      true;


    liveError.textContent =
      "";


    try{

      const audioBlob =
        await stopRecording();


      if(
        !audioBlob ||
        audioBlob.size < 800
      ){

        throw new Error(
          "Posnetek je prekratek."
        );

      }


      showProcessing();


      const result =
        await sendToGemini(
          audioBlob
        );


      originalText.textContent =
        result.original;


      translatedText.textContent =
        result.translation;


      await speak(
        result.translation
      );


      if(
        !state.running
      ){

        return;

      }


      /*
       * Po prevodu avtomatsko
       * zamenjamo govorca.
       */

      state.activePerson =
        state.activePerson === 1
          ? 2
          : 1;


      state.processing =
        false;


      updateConversation();


      await startRecording();

    }
    catch(error){

      console.error(
        error
      );


      state.processing =
        false;


      liveError.textContent =
        error.message ||
        "Prepoznavanje ni uspelo.";


      status.textContent =
        "Poskusi ponovno.";


      nextButton.disabled =
        false;


      setTimeout(
        () => {

          if(
            state.running &&
            !state.recording
          ){

            startRecording();

          }

        },
        1200
      );

    }

  }

);


/* ==========================================
   STOP
========================================== */

stopButton.addEventListener(
  "click",
  async () => {


    state.running =
      false;


    state.processing =
      false;


    if(
      state.recording
    ){

      await stopRecording();

    }


    if(
      "speechSynthesis"
      in window
    ){

      window
        .speechSynthesis
        .cancel();

    }


    if(
      state.stream
    ){

      state.stream
        .getTracks()
        .forEach(
          track =>
            track.stop()
        );


      state.stream =
        null;

    }


    clearStages();


    liveScreen
      .classList
      .remove(
        "active"
      );


    setupScreen
      .classList
      .add(
        "active"
      );

  }

);


/* ==========================================
   INIT
========================================== */

updateSetup();

})();
</script>
