<style>

*{
  box-sizing:border-box;
}

:root{
  --bg:#061224;
  --line:#294a75;
  --text:#f7f9ff;
  --muted:#a8b4c8;
  --yellow:#ffd54a;
  --blue:#078cff;
  --green:#13dfc5;
  --red:#d62943;
  --purple:#9b63ff;
}

html,
body{
  margin:0;
  min-height:100%;

  background:
    radial-gradient(
      circle at 50% 10%,
      #0c2e58 0,
      #061224 42%,
      #030b17 100%
    );

  color:var(--text);

  font-family:
    Arial,
    sans-serif;
}

body{
  padding:
    max(18px,env(safe-area-inset-top))
    18px
    max(18px,env(safe-area-inset-bottom));
}

button{
  cursor:pointer;
  touch-action:manipulation;
}

.app{
  max-width:520px;
  margin:auto;
}

.hidden{
  display:none!important;
}


/* ==================================
   ZAČETNI ZASLON
================================== */

.brand{
  text-align:center;
  margin:8px 0 25px;
}

.brand img{
  width:82px;
  height:82px;

  border-radius:23px;
}

.appName{
  margin-top:10px;

  text-align:center;

  color:#d7e1f1;

  font-size:18px;
  font-weight:900;
}


.card{
  margin-bottom:15px;

  padding:18px;

  border:
    1px solid var(--line);

  border-radius:22px;

  background:
    linear-gradient(
      145deg,
      #102a4c,
      #0a1930
    );

  box-shadow:
    0 16px 38px #0006;
}


input,
select{
  width:100%;
  height:57px;

  padding:
    0 15px;

  border-radius:15px;

  outline:none;

  color:#fff;

  font-size:18px;
}


input{
  margin-bottom:12px;
}


select{
  border:
    1px solid #5276a5;

  background:#0b1c34;
}


/* OSEBA A */

.nameA{
  border:
    1px solid #168cff;

  background:#08244a;

  color:#72bdff;

  font-weight:900;
}


/* OSEBA B */

.nameB{
  border:
    1px solid #13d7b9;

  background:#073a35;

  color:#67efd9;

  font-weight:900;
}


/* ZAČNI */

.start{
  width:100%;
  height:68px;

  border:0;

  border-radius:18px;

  background:
    linear-gradient(
      90deg,
      #087df1,
      #079efe
    );

  color:#fff;

  font-size:19px;

  font-weight:900;

  box-shadow:
    0 12px 30px #087df155;
}


/* ==================================
   AI IZBIRA SPODAJ
================================== */

.aiBox{
  margin-top:17px;

  padding:11px;

  border:
    1px solid #213a5c;

  border-radius:18px;

  background:#08172b;
}


.aiChoices{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:10px;
}


.aiButton{
  height:44px;

  border:
    1px solid #385984;

  border-radius:14px;

  background:#0b1c34;

  color:#b7c4d7;

  font-size:13px;

  font-weight:900;
}


.aiButton.selected.groq{
  border-color:#ff9f38;

  background:
    linear-gradient(
      90deg,
      #d66b15,
      #ef9835
    );

  color:#fff;
}


.aiButton.selected.gemini{
  border-color:#9b63ff;

  background:
    linear-gradient(
      90deg,
      #6e45c9,
      #a34ee8
    );

  color:#fff;
}


/* ==================================
   POGOVOR HEADER
================================== */

.top{
  display:flex;

  justify-content:
    space-between;

  align-items:center;

  margin-bottom:24px;
}


.top img{
  width:44px;
  height:44px;

  border-radius:13px;
}


.gear{
  border:0;

  background:transparent;

  color:#b7c6da;

  font-size:25px;
}


/* ==================================
   ✓ IN ✕
================================== */

.actions{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:12px;

  margin-bottom:18px;
}


.next,
.end{
  height:62px;

  border-radius:24px;

  font-size:30px;

  font-weight:900;
}


.next{
  border:0;
}


.next.a{
  background:
    linear-gradient(
      90deg,
      #078eff,
      #0a7bee
    );

  color:#fff;

  box-shadow:
    0 8px 24px #078cff44;
}


.next.b{
  background:
    linear-gradient(
      90deg,
      #18dfbd,
      #10bda4
    );

  color:#042d28;

  box-shadow:
    0 8px 24px #13dfc544;
}


.next:disabled{
  opacity:.28;

  box-shadow:none;
}


.end{
  border:
    1px solid #a63b4b;

  background:
    linear-gradient(
      90deg,
      #d62943,
      #a71730
    );

  color:#fff;

  box-shadow:
    0 8px 24px #d6294333;
}


/* ==================================
   JEZIKA
================================== */

.direction{
  text-align:center;

  color:#d4dbea;

  font-size:14px;
}


/* ==================================
   AKTIVNA OSEBA
================================== */

.speaker{
  margin:
    19px 0 0;

  text-align:center;

  font-size:34px;

  font-weight:900;
}


/*
Tekstov GOVORI / POSLUŠAJ /
BODI TIHO namenoma ni.
*/

.speakLabel{
  display:none;
}


/* ==================================
   CENTER STATE
================================== */

.pulse{
  position:relative;

  display:grid;

  place-items:center;

  width:215px;
  height:215px;

  margin:
    18px auto 17px;
}


.ring{
  position:absolute;

  border:
    2px solid #087fff66;

  border-radius:50%;

  animation:
    ringPulse
    1.6s
    infinite;
}


.r1{
  inset:0;
}


.r2{
  inset:21px;

  animation-delay:
    .25s;
}


.r3{
  inset:42px;

  animation-delay:
    .5s;
}


/* B */

.pulse.b .ring{
  border-color:
    #13dfc566;
}


/* PREVOD / PREDVAJANJE */

.pulse.paused .ring{
  animation:none;

  opacity:.12;
}


@keyframes ringPulse{

  0%{
    transform:
      scale(.82);

    opacity:.95;
  }

  70%{
    transform:
      scale(1.05);

    opacity:.12;
  }

  100%{
    transform:
      scale(1.05);

    opacity:0;
  }

}


/* ==================================
   MIKROFON
================================== */

.mic{
  position:relative;

  z-index:2;

  width:132px;
  height:132px;

  border:0;

  border-radius:50%;

  font-size:58px;

  animation:
    micBeat
    1.1s
    ease-in-out
    infinite;
}


/* A GOVORI */

.mic.a{
  background:
    radial-gradient(
      circle at 35% 25%,
      #43c8ff,
      #0784ff 50%,
      #0b58c4
    );

  color:#fff;

  box-shadow:
    0 0 22px #078cff,
    0 0 58px #078cff99;
}


/* B GOVORI */

.mic.b{
  background:
    radial-gradient(
      circle at 35% 25%,
      #5cf3de,
      #13d7b9 50%,
      #078a78
    );

  color:#032d29;

  box-shadow:
    0 0 22px #13dfc5,
    0 0 58px #13dfc599;
}


@keyframes micBeat{

  0%,
  100%{
    transform:
      scale(1);
  }

  50%{
    transform:
      scale(1.09);
  }

}


/* ==================================
   🤫 / 🔊
================================== */

.stateIcon{
  position:relative;

  z-index:2;

  display:grid;

  place-items:center;

  width:132px;
  height:132px;

  border:0;

  border-radius:50%;

  font-size:58px;

  animation:none;
}


/* 🤫 */

.stateIcon.processing{
  background:
    radial-gradient(
      circle at 35% 25%,
      #fff3b0,
      #f6c744 55%,
      #a76d00
    );

  box-shadow:
    0 0 24px #ffd54a,
    0 0 56px #ffd54a55;
}


/* 🔊 */

.stateIcon.playing{
  background:
    radial-gradient(
      circle at 35% 25%,
      #d7c7ff,
      #8d62ea 55%,
      #503098
    );

  box-shadow:
    0 0 24px #9b63ff,
    0 0 56px #9b63ff66;
}


/* ==================================
   FAZE 🎤 → 🤫 → 🔊
================================== */

.phaseRail{
  display:flex;

  align-items:center;

  justify-content:center;

  gap:12px;

  margin:
    12px 0 6px;
}


.phaseDot{
  display:grid;

  place-items:center;

  width:44px;
  height:44px;

  border:
    1px solid #3c597e;

  border-radius:50%;

  background:#09192f;

  font-size:21px;

  opacity:.38;

  transition:.2s;
}


.phaseDot.active{
  opacity:1;

  transform:
    scale(1.08);
}


.phaseDot.listen.active{
  border-color:#43c8ff;

  box-shadow:
    0 0 18px #078cff;
}


.phaseDot.wait.active{
  border-color:#ffd54a;

  box-shadow:
    0 0 18px #ffd54a;
}


.phaseDot.play.active{
  border-color:#b895ff;

  box-shadow:
    0 0 18px #9b63ff;
}


.phaseArrow{
  color:#617895;

  font-size:18px;
}


/* ==================================
   PREVOD
================================== */

.result{
  margin:
    16px 0;

  padding:15px;

  border:
    1px solid var(--line);

  border-radius:18px;

  background:#09192f;
}


.resultTitle{
  display:none;
}


.original{
  color:#cad4e3;

  font-size:15px;

  line-height:1.4;
}


.translated{
  margin-top:9px;

  color:var(--yellow);

  font-size:20px;

  line-height:1.4;

  font-weight:900;
}


.notice{
  min-height:20px;

  margin-top:6px;

  text-align:center;

  color:#ff7788;

  font-size:12px;
}

</style>
</head>


<body>

<div class="app">


<!-- ==================================
     SETUP
================================== -->

<section id="setup">


  <div class="brand">

    <img

    >

<section

  <div class="top">

      src="apple-touch-icon.png"

    >


    <button

    </button>

  <div class="actions">

    </button>


    <button
      id="end"

      ✕
    </button>


  </div>


  <!-- JEZIKA -->

  <div
    id="direction"
    class="direction"
  ></div>


  <!-- AKTIVNA OSEBA -->

  <div
    id="speaker"

  ></div>


  <div
    id="stateLabel"

  ></div>


  <!-- GLAVNA IKONA -->

  <div
    id="pulse"
    class="pulse a"
  >

    <div class="ring r1"></div>

    <div class="ring r2"></div>

    <div class="ring r3"></div>


    <button
      id="mic"
      class="mic a"
      type="button"
    >
      🎤
    </button>


  </div>


  <!-- VIZUALNI POTEK -->

  <div class="phaseRail">


    <div
      id="phaseListen"
      class="phaseDot listen active"
    >
      🎤
    </div>


    <div class="phaseArrow">
      →
    </div>


    <div
      id="phaseWait"
      class="phaseDot wait"
    >
      🤫
    </div>


    <div class="phaseArrow">
      →
    </div>


    <div
      id="phasePlay"
      class="phaseDot play"
    >
      🔊
    </div>


  </div>


  <!-- PREVOD -->

  <div
    id="result"
    class="result hidden"
  >

    <div
      id="original"
      class="original"
    ></div>


    <div
      id="translated"
      class="translated"
    ></div>


  </div>


  <div
    id="notice"
    class="notice"
  ></div>


</section>

</div>


<script>

/* ==================================
   SUPABASE
================================== */

const URL =
  "https://kdixpdxmdfdbxpbuljfe.supabase.co";


const KEY =
  "sb_publishable_khd42rEJpa3-1uyVb01Jjg_7rBp-FT8";


const HEADERS = {

  apikey:
    KEY,

  Authorization:
    "Bearer " + KEY

};


/* ==================================
   JEZIKI
================================== */

const LANGUAGES = {

  sl:{
    name:"🇸🇮 Slovenščina",
    tts:"sl-SI"
  },

  hu:{
    name:"🇭🇺 Magyar",
    tts:"hu-HU"
  },

  en:{
    name:"🇬🇧 English",
    tts:"en-US"
  },

  tl:{
    name:"🇵🇭 Filipino",
    tts:"fil-PH"
  },

  it:{
    name:"🇮🇹 Italiano",
    tts:"it-IT"
  },

  hr:{
    name:"🇭🇷 Hrvatski",
    tts:"hr-HR"
  },

  sq:{
    name:"🇦🇱 Shqip",
    tts:"sq-AL"
  },

  de:{
    name:"🇩🇪 Deutsch",
    tts:"de-DE"
  },

  es:{
    name:"🇪🇸 Español",
    tts:"es-ES"
  },

  ru:{
    name:"🇷🇺 Русский",
    tts:"ru-RU"
  },

  uk:{
    name:"🇺🇦 Українська",
    tts:"uk-UA"
  },

  bg:{
    name:"🇧🇬 Български",
    tts:"bg-BG"
  },

  pl:{
    name:"🇵🇱 Polski",
    tts:"pl-PL"
  },

  cs:{
    name:"🇨🇿 Čeština",
    tts:"cs-CZ"
  },

  sk:{
    name:"🇸🇰 Slovenčina",
    tts:"sk-SK"
  }

};


const $ =
  id =>
    document.getElementById(
      id
    );


/* ==================================
   JEZIKOVNI DROPDOWNI
================================== */

Object.entries(
  LANGUAGES
)
.forEach(
  ([code,language]) => {


    $("langA").add(

      new Option(
        language.name,
        code
      )

    );


    $("langB").add(

      new Option(
        language.name,
        code
      )

    );


  }
);


$("langA").value =
  "sl";


$("langB").value =
  "en";


/* ==================================
   STATE
================================== */

let turn =
  0;


let recorder =
  null;


let mediaStream =
  null;


let audioChunks =
  [];


let busy =
  false;


let recordingId =
  0;


let activeRecordingId =
  0;


let processingId =
  0;


let lastPlayedId =
  0;


let sessionId =
  0;


let inactivityTimer =
  null;


/*
Whisper je privzet,
ker je trenutno hitrejši.
*/

let selectedAI =
  localStorage.getItem(
    "phone5AI"
  )
  ||
  "groq";


/* ==================================
   OSEBI
================================== */

function personName(
  person
){

  if(
    person === 0
  ){

    return (
      $("nameA")
        .value
        .trim()
      ||
      "Oseba A"
    );

  }


  return (
    $("nameB")
      .value
      .trim()
    ||
    "Oseba B"
  );

}


function personLanguage(
  person
){

  return (
    person === 0
      ? $("langA").value
      : $("langB").value
  );

}


/* ==================================
   AI IZBIRA
================================== */

function chooseAI(
  ai
){

  selectedAI =
    ai;


  localStorage.setItem(
    "phone5AI",
    ai
  );


  renderAI();

}


function renderAI(){

  $("aiGroq")
    .classList
    .toggle(
      "selected",
      selectedAI ===
        "groq"
    );


  $("aiGemini")
    .classList
    .toggle(
      "selected",
      selectedAI ===
        "gemini"
    );

}


/* ==================================
   2 MIN NEAKTIVNOST
================================== */

function markActivity(){

  if(
    inactivityTimer
  ){

    clearTimeout(
      inactivityTimer
    );

  }


  inactivityTimer =
    setTimeout(
      () => {

        if(
          !$("talk")
            .classList
            .contains(
              "hidden"
            )
        ){

          clearConversation();

        }

      },

      120000

    );

}


/* ==================================
   VIZUALNO STANJE
================================== */

function setUIState(
  state
){

  const isA =
    turn === 0;


  /*
  FAZE SPODAJ
  */

  $("phaseListen")
    .classList
    .toggle(
      "active",
      state ===
        "listening"
    );


  $("phaseWait")
    .classList
    .toggle(
      "active",
      state ===
        "processing"
    );


  $("phasePlay")
    .classList
    .toggle(
      "active",
      state ===
        "playing"
    );


  /*
  🎤 POSLUŠAM GOVOR
  */

  if(
    state ===
    "listening"
  ){

    $("pulse").className =
      "pulse " +
      (
        isA
          ? "a"
          : "b"
      );


    $("mic").className =
      "mic " +
      (
        isA
          ? "a"
          : "b"
      );


    $("mic").textContent =
      "🎤";


    $("next").disabled =
      false;


    return;

  }


  /*
  🤫 OBDELAVA
  */

  if(
    state ===
    "processing"
  ){

    $("pulse").className =
      "pulse paused";


    $("mic").className =
      "stateIcon processing";


    $("mic").textContent =
      "🤫";


    $("next").disabled =
      true;


    return;

  }


  /*
  🔊 PREDVAJANJE
  */

  $("pulse").className =
    "pulse paused";


  $("mic").className =
    "stateIcon playing";


  $("mic").textContent =
    "🔊";


  $("next").disabled =
    true;

}


/* ==================================
   RENDER GOVORCA
================================== */

function render(){

  const source =
    personLanguage(
      turn
    );


  const target =
    personLanguage(
      turn === 0
        ? 1
        : 0
    );


  $("speaker").textContent =
    personName(
      turn
    );


  $("direction").textContent =
    LANGUAGES[source].name +
    " → " +
    LANGUAGES[target].name;


  /*
  ✓ brez jezika
  */

  $("next").textContent =
    "✓";


  $("next").className =
    "next " +
    (
      turn === 0
        ? "a"
        : "b"
    );


  setUIState(
    "listening"
  );


  startRecording();

}


/* ==================================
   TTS UNLOCK IPHONE
================================== */

function unlockTTS(){

  try{

    speechSynthesis.cancel();


    const utterance =
      new SpeechSynthesisUtterance(
        " "
      );


    utterance.lang =
      LANGUAGES[
        personLanguage(0)
      ].tts;


    utterance.volume =
      0.01;


    speechSynthesis.speak(
      utterance
    );


    setTimeout(
      () =>
        speechSynthesis.resume(),
      80
    );

  }
  catch(error){

    console.log(
      error
    );

  }

}


/* ==================================
   ZAČNI POGOVOR
================================== */

function startConversation(){

  sessionId++;


  processingId =
    0;


  lastPlayedId =
    0;


  activeRecordingId =
    0;


  turn =
    0;


  $("setup")
    .classList
    .add(
      "hidden"
    );


  $("talk")
    .classList
    .remove(
      "hidden"
    );


  unlockTTS();


  markActivity();


  render();

}


/* ==================================
   START RECORDING
================================== */

async function startRecording(){

  if(
    busy
    ||
    recorder?.state ===
      "recording"
  ){

    return;

  }


  const mySession =
    sessionId;


  const myRecordingId =
    ++recordingId;


  activeRecordingId =
    myRecordingId;


  /*
  UNIČI STAR AUDIO
  */

  if(
    mediaStream
  ){

    mediaStream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );

  }


  mediaStream =
    null;


  recorder =
    null;


  audioChunks =
    [];


  try{

    const newStream =
      await navigator
        .mediaDevices
        .getUserMedia({
          audio:true
        });


    if(
      mySession !==
        sessionId
      ||
      myRecordingId !==
        activeRecordingId
    ){

      newStream
        .getTracks()
        .forEach(
          track =>
            track.stop()
        );


      return;

    }


    mediaStream =
      newStream;


    let options =
      {};


    if(
      MediaRecorder
        .isTypeSupported(
          "audio/mp4"
        )
    ){

      options = {
        mimeType:
          "audio/mp4"
      };

    }
    else if(
      MediaRecorder
        .isTypeSupported(
          "audio/webm"
        )
    ){

      options = {
        mimeType:
          "audio/webm"
      };

    }


    const newRecorder =
      new MediaRecorder(
        mediaStream,
        options
      );


    recorder =
      newRecorder;


    const localChunks =
      [];


    newRecorder.ondataavailable =
      event => {

        if(
          event.data.size
          &&
          mySession ===
            sessionId
          &&
          myRecordingId ===
            activeRecordingId
          &&
          recorder ===
            newRecorder
        ){

          localChunks.push(
            event.data
          );

        }

      };


    newRecorder.start();


    audioChunks =
      localChunks;


    $("notice").textContent =
      "";

  }
  catch(error){

    if(
      mySession ===
        sessionId
    ){

      $("notice").textContent =
        "Microphone error";

    }

  }

}


/* ==================================
   STOP RECORDING
================================== */

function stopRecording(

  expectedRecordingId =
    activeRecordingId,

  expectedSession =
    sessionId

){

  return new Promise(
    resolve => {


      const currentRecorder =
        recorder;


      const currentStream =
        mediaStream;


      if(
        !currentRecorder
        ||
        currentRecorder.state !==
          "recording"
        ||
        expectedSession !==
          sessionId
        ||
        expectedRecordingId !==
          activeRecordingId
      ){

        currentStream
          ?.getTracks()
          .forEach(
            track =>
              track.stop()
          );


        resolve();


        return;

      }


      currentRecorder.onstop =
        () =>
          resolve();


      currentRecorder.stop();


      currentStream
        ?.getTracks()
        .forEach(
          track =>
            track.stop()
        );


    }
  );

}


/* ==================================
   AI REQUEST
================================== */

async function translateAudio(

  frozenChunks,

  frozenRecorder,

  sourceLanguage,

  targetLanguage

){

  const mime =
    frozenRecorder
      ?.mimeType
    ||
    "audio/webm";


  const extension =
    mime.includes(
      "mp4"
    )
      ? "m4a"
      : "webm";


  const blob =
    new Blob(
      frozenChunks,
      {
        type:mime
      }
    );


  if(
    blob.size <
    500
  ){

    throw new Error(
      "Audio too short"
    );

  }


  const file =
    new File(
      [blob],
      "voice." +
      extension,
      {
        type:mime
      }
    );


  const form =
    new FormData();


  form.append(
    "audio",
    file
  );


  form.append(
    "language",
    sourceLanguage
  );


  form.append(
    "target_language",
    targetLanguage
  );


  const endpoint =
    selectedAI ===
      "gemini"
      ? "voice-transcribe-gemini"
      : "voice-transcribe";


  const response =
    await fetch(

      URL +
      "/functions/v1/" +
      endpoint,

      {

        method:"POST",

        headers:
          HEADERS,

        body:
          form

      }

    );


  const raw =
    await response.text();


  let data;


  try{

    data =
      JSON.parse(
        raw
      );

  }
  catch{

    throw new Error(
      "AI response error"
    );

  }


  if(
    !response.ok
  ){

    throw new Error(
      data.detail ||
      data.error ||
      raw
    );

  }


  if(
    !data.text
    ||
    !data.translated
  ){

    throw new Error(
      "Speech not recognized"
    );

  }


  return data;

}


/* ==================================
   TTS VOICE
================================== */

function findVoice(
  languageCode
){

  const target =
    LANGUAGES[
      languageCode
    ].tts
      .toLowerCase();


  const base =
    target
      .split("-")[0];


  const voices =
    speechSynthesis
      .getVoices();


  return (

    voices.find(
      voice =>
        voice.lang
          .toLowerCase() ===
        target
    )

    ||

    voices.find(
      voice =>
        voice.lang
          .toLowerCase()
          .startsWith(base)
    )

    ||

    null

  );

}


/* ==================================
   TTS SAMO ENKRAT
================================== */

function speakOnce(

  text,

  languageCode,

  playId,

  playSession

){

  return new Promise(
    resolve => {


      if(
        !text
        ||
        playSession !==
          sessionId
        ||
        playId !==
          processingId
        ||
        lastPlayedId ===
          playId
      ){

        resolve(
          false
        );


        return;

      }


      lastPlayedId =
        playId;


      speechSynthesis.cancel();


      const utterance =
        new SpeechSynthesisUtterance(
          text
        );


      utterance.lang =
        LANGUAGES[
          languageCode
        ].tts;


      const voice =
        findVoice(
          languageCode
        );


      if(
        voice
      ){

        utterance.voice =
          voice;

      }


      utterance.rate =
        0.92;


      utterance.pitch =
        1;


      utterance.volume =
        1;


      let finished =
        false;


      const timeout =
        setTimeout(
          () =>
            finish(false),

          Math.max(
            7000,
            text.length * 170
          )

        );


      function finish(
        success
      ){

        if(
          finished
        ){

          return;

        }


        finished =
          true;


        clearTimeout(
          timeout
        );


        if(
          playSession !==
            sessionId
          ||
          playId !==
            processingId
        ){

          resolve(
            false
          );


          return;

        }


        resolve(
          success
        );

      }


      utterance.onend =
        () =>
          finish(true);


      utterance.onerror =
        () =>
          finish(false);


      speechSynthesis.speak(
        utterance
      );


      setTimeout(
        () =>
          speechSynthesis.resume(),
        100
      );


    }
  );

}


/* ==================================
   ✓ KONČAJ POVED
================================== */

async function nextTurn(){

  markActivity();


  if(
    busy
  ){

    return;

  }


  if(
    !recorder
    ||
    recorder.state !==
      "recording"
  ){

    return;

  }


  const requestedRecordingId =
    activeRecordingId;


  const requestedSession =
    sessionId;


  busy =
    true;


  /*
  TAKOJ:
  🤫
  */

  setUIState(
    "processing"
  );


  const spokenTurn =
    turn;


  const sourceLanguage =
    personLanguage(
      spokenTurn
    );


  const targetLanguage =
    personLanguage(
      spokenTurn === 0
        ? 1
        : 0
    );


  const myProcessingId =
    ++processingId;


  const frozenRecorder =
    recorder;


  try{

    /*
    Mikrofon STOP.
    */

    await stopRecording(
      requestedRecordingId,
      requestedSession
    );


    /*
    Počakamo zadnji chunk.
    */

    await new Promise(
      resolve =>
        setTimeout(
          resolve,
          100
        )
    );


    const frozenChunks =
      audioChunks.slice();


    if(
      requestedSession !==
        sessionId
      ||
      myProcessingId !==
        processingId
    ){

      return;

    }


    /*
    TRANSCRIPTION + TRANSLATION
    */

    const data =
      await translateAudio(

        frozenChunks,

        frozenRecorder,

        sourceLanguage,

        targetLanguage

      );


    if(
      requestedSession !==
        sessionId
      ||
      myProcessingId !==
        processingId
    ){

      return;

    }


    $("original").textContent =
      data.text;


    $("translated").textContent =
      data.translated;


    $("result")
      .classList
      .remove(
        "hidden"
      );


    /*
    🔊
    */

    setUIState(
      "playing"
    );


    await speakOnce(

      data.translated,

      targetLanguage,

      myProcessingId,

      requestedSession

    );


    if(
      requestedSession !==
        sessionId
      ||
      myProcessingId !==
        processingId
    ){

      return;

    }


    /*
    Zamenjava osebe
    šele PO TTS.
    */

    turn =
      spokenTurn === 0
        ? 1
        : 0;


    /*
    Uniči star audio.
    */

    audioChunks =
      [];


    recorder =
      null;


    mediaStream =
      null;


    busy =
      false;


    /*
    Naslednja oseba:
    🎤
    */

    render();

  }
  catch(error){

    if(
      requestedSession ===
        sessionId
      &&
      myProcessingId ===
        processingId
    ){

      $("notice").textContent =
        "⚠ " +
        error.message;


      audioChunks =
        [];


      recorder =
        null;


      mediaStream =
        null;


      busy =
        false;


      /*
      Ista oseba lahko
      poskusi ponovno.
      */

      setUIState(
        "listening"
      );


      await startRecording();

    }

  }
  finally{

    if(
      requestedSession ===
        sessionId
    ){

      busy =
        false;

    }

  }

}


/* ==================================
   ✕ POPOLN RESET
================================== */

async function clearConversation(){

  sessionId++;


  processingId++;


  activeRecordingId =
    ++recordingId;


  lastPlayedId =
    0;


  if(
    inactivityTimer
  ){

    clearTimeout(
      inactivityTimer
    );

  }


  inactivityTimer =
    null;


  speechSynthesis.cancel();


  const oldRecorder =
    recorder;


  const oldStream =
    mediaStream;


  if(
    oldRecorder
    &&
    oldRecorder.state ===
      "recording"
  ){

    oldRecorder.onstop =
      null;


    try{

      oldRecorder.stop();

    }
    catch(error){

      console.log(
        error
      );

    }

  }


  oldStream
    ?.getTracks()
    .forEach(
      track =>
        track.stop()
    );


  /*
  Pobriši pogovor.
  */

  audioChunks =
    [];


  recorder =
    null;


  mediaStream =
    null;


  busy =
    false;


  turn =
    0;


  $("original").textContent =
    "";


  $("translated").textContent =
    "";


  $("result")
    .classList
    .add(
      "hidden"
    );


  $("notice").textContent =
    "";


  $("talk")
    .classList
    .add(
      "hidden"
    );


  $("setup")
    .classList
    .remove(
      "hidden"
    );

}
