<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0,
             maximum-scale=1.0, user-scalable=no"
  >

  <title>Voice TV</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #0f1115;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      padding: 18px;
    }

    .container {
      width: 100%;
      max-width: 620px;
      margin: 0 auto;
    }

    h1 {
      margin: 0;
      font-size: 30px;
      letter-spacing: 1px;
    }

    .subtitle {
      margin-top: 6px;
      margin-bottom: 22px;
      color: #9aa0aa;
      font-size: 16px;
    }

    .card {
      margin-bottom: 18px;
      padding: 18px;
      background: #191c22;
      border: 1px solid #2d323b;
      border-radius: 16px;
    }

    .connection {
      padding: 14px 16px;
      margin-bottom: 18px;
      background: #191c22;
      border: 1px solid #2d323b;
      border-radius: 12px;
      color: #aab0ba;
      font-weight: bold;
    }

    .section-title {
      margin-bottom: 13px;
      color: #c7cbd2;
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 0.6px;
    }

    .language-row {
      display: flex;
      gap: 10px;
    }

    .language-button {
      flex: 1;
      min-height: 58px;
      padding: 10px;
      border: 2px solid #3b414c;
      border-radius: 12px;
      background: #242830;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .language-button.active {
      border-color: #55a9ff;
      background: #1269bd;
    }

    .mode-row {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
    }

    .mode-button {
      flex: 1;
      min-height: 56px;
      border: 1px solid #3b414c;
      border-radius: 12px;
      background: #242830;
      color: #d5d9df;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .mode-button.active {
      background: #ffffff;
      color: #111111;
      border-color: #ffffff;
    }

    .mode-panel {
      display: none;
    }

    .mode-panel.active {
      display: block;
    }
