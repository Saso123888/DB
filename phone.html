<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voice TV - Mikrofon</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 20px;
  background: #101114;
  color: white;
  font-family: Arial, Helvetica, sans-serif;
}

.container {
  max-width: 600px;
  margin: 0 auto;
}

h1 {
  margin-bottom: 5px;
}

.subtitle {
  color: #888;
  margin-bottom: 25px;
}

.status {
  background: #1c1e22;
  padding: 14px;
  border-radius: 10px;
  margin-bottom: 20px;
  color: #00c853;
  font-weight: bold;
}

.languages {
  display: flex;
  gap: 10px;
  margin-bottom: 25px;
}

.lang {
  flex: 1;
  padding: 16px;
  border-radius: 10px;
  border: 2px solid #444;
  background: #222;
  color: white;
  font-size: 18px;
}

.lang.active {
  background: #1565c0;
  border-color: #42a5f5;
}

#recognized {
  min-height: 140px;
  background: #181a1f;
  border: 1px solid #444;
  border-radius: 12px;
  padding: 18px;
  font-size: 22px;
  line-height: 1.4;
  margin-bottom: 20px;
}

#start {
  width: 100%;
  min-height: 70px;
  border: 0;
  border-radius: 12px;
  background: #00a650;
  color: white;
  font-size: 22px;
  font-weight: bold;
}

#stop {
  width: 100%;
  min-height: 60px;
  border: 0;
  border-radius: 12px;
  background: #d32f2f;
  color: white;
  font-size: 20px;
  font-weight: bold;
  margin-top: 12px;
}

#micStatus {
  margin-top: 20px;
  text-align: center;
  color: #aaa;
  min-height: 25px;
}

.room {
  margin-top: 30px;
  text-align: center;
  color: #666;
}
</style>
</head>

<body>

<div class="container">

<h1>VOICE TV</h1>

<div class="subtitle">
  Govor → tekst → veliki zaslon
</div>

<div id="connection" class="status">
  ● PREVERJAM POVEZAVO...
</div>


<div class="languages">

  <button
    id="slButton"
    class="lang active"
    type="button">
    🇸🇮 SLOVENŠČINA
  </button>

  <button
    id="huButton"
    class="lang"
    type="button">
    🇭🇺 MAGYAR
  </button>

</div>


<div id="recognized">
  Tukaj se bo prikazal prepoznani govor...
</div>


<button id="start" type="button">
  🎤 ZAČNI GOVORITI
</button>

<button id="stop" type="button">
  ■ USTAVI
</button>


<div id="micStatus">
</div>


<div class="room">
  SOBA 123456
</div>

</div>


<script>

const SUPABASE_URL =
  "https://kdixpdxmdfdbxpbuljfe.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_khd42rEJpa3-1uyVb01Jjg_7rBp-FT8";

const ROOM_CODE = "123456";

const client =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


const connection =
  document.getElementById("connection");

const recognized =
  document.getElementById("recognized");

const micStatus =
  document.getElementById("micStatus");

const slButton =
  document.getElementById("slButton");

const huButton =
  document.getElementById("huButton");

const startButton =
  document.getElementById("start");

const stopButton =
  document.getElementById("stop");


let currentLanguage = "sl-SI";
let recognition = null;
let finalText = "";


/* POVEZAVA */

async function checkConnection() {

  const { error } =
    await client
      .from("translation_rooms")
      .select("room_code")
      .eq("room_code", ROOM_CODE)
      .single();

  if (error) {

    connection.innerText =
      "● NI POVEZAVE";

    connection.style.color =
      "#ff5252";

    return;
  }

  connection.innerText =
    "● POVEZANO";

  connection.style.color =
    "#00c853";
}


/* IZBIRA JEZIKA */

slButton.addEventListener(
  "click",
  function() {

    currentLanguage = "sl-SI";

    slButton.classList.add("active");
    huButton.classList.remove("active");

    micStatus.innerText =
      "Izbrana slovenščina";
  }
);


huButton.addEventListener(
  "click",
  function() {

    currentLanguage = "hu-HU";

    huButton.classList.add("active");
    slButton.classList.remove("active");

    micStatus.innerText =
      "Kiválasztott nyelv: magyar";
  }
);


/* POŠILJANJE V SUPABASE */

async function sendToScreen(text) {

  if (!text.trim()) {
    return;
  }

  await client
    .from("translation_rooms")
    .update({

      original_text: text,

      translated_text: text,

      source_language:
        currentLanguage === "sl-SI"
        ? "sl"
        : "hu",

      updated_at:
        new Date().toISOString()

    })

    .eq(
      "room_code",
      ROOM_CODE
    );
}


/* SPEECH RECOGNITION */

function createRecognition() {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if (!SpeechRecognition) {

    micStatus.innerText =
      "Ta brskalnik ne podpira prepoznave govora.";

    micStatus.style.color =
      "#ff5252";

    return null;
  }


  const r =
    new SpeechRecognition();


  r.lang =
    currentLanguage;

  r.continuous =
    true;

  r.interimResults =
    true;


  r.onstart =
    function() {

      micStatus.innerText =
        "🎤 POSLUŠAM...";

      micStatus.style.color =
        "#00c853";
    };


  r.onresult =
    function(event) {

      let interimText = "";


      for (
        let i = event.resultIndex;
        i < event.results.length;
        i++
      ) {

        const transcript =
          event.results[i][0].transcript;


        if (
          event.results[i].isFinal
        ) {

          finalText +=
            transcript + " ";

        } else {

          interimText +=
            transcript;

        }

      }


      const fullText =
        finalText +
        interimText;


      recognized.innerText =
        fullText;


      sendToScreen(
        fullText
      );
    };


  r.onerror =
    function(event) {

      console.log(
        "Speech error:",
        event.error
      );

      micStatus.innerText =
        "Napaka mikrofona: " +
        event.error;

      micStatus.style.color =
        "#ff5252";
    };


  r.onend =
    function() {

      micStatus.innerText =
        "Mikrofon ustavljen.";

      micStatus.style.color =
        "#aaa";
    };


  return r;
}


/* ZAČNI */

startButton.addEventListener(
  "click",
  function() {

    finalText = "";

    recognized.innerText =
      "Poslušam...";


    recognition =
      createRecognition();


    if (!recognition) {
      return;
    }


    recognition.lang =
      currentLanguage;


    try {

      recognition.start();

    } catch (error) {

      console.log(error);

    }

  }
);


/* USTAVI */

stopButton.addEventListener(
  "click",
  function() {

    if (recognition) {

      recognition.stop();

    }

  }
);


checkConnection();

</script>

</body>
</html>
