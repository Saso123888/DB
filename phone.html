<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>Voice TV</title>

<style>
*{box-sizing:border-box}
:root{
  --bg:#08101f;
  --card:#111b2e;
  --card2:#16233a;
  --line:#263754;
  --text:#f5f8ff;
  --muted:#8d9bb1;
  --blue:#3687ff;
  --green:#24c875;
  --red:#ff5364;
  --yellow:#ffd84d;
}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
body{padding:18px}
.app{max-width:620px;margin:auto}
.header{display:flex;justify-content:space-between;align-items:center;margin:8px 2px 22px}
.logo{font-weight:900;font-size:27px;letter-spacing:-1px}
.logo span{color:var(--blue)}
.badge{font-size:12px;padding:8px 11px;border-radius:20px;background:#12253a;color:var(--green)}
.card{background:linear-gradient(145deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:15px;box-shadow:0 12px 35px #0004}
.label{font-size:12px;color:var(--muted);font-weight:bold;letter-spacing:1px;margin-bottom:12px}
.langs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lang{border:1px solid var(--line);background:#111a29;color:white;padding:15px 8px;border-radius:14px;font-size:15px;font-weight:bold}
.lang.active{background:var(--blue);border-color:#65a5ff;box-shadow:0 5px 20px #3687ff44}
.arrow{text-align:center;color:var(--muted);font-size:22px;margin:-4px 0 10px}
.modes{display:grid;grid-template-columns:1fr 1fr;background:#0d1626;border:1px solid var(--line);padding:5px;border-radius:16px;margin-bottom:15px}
.mode{border:0;background:transparent;color:var(--muted);padding:14px;border-radius:12px;font-weight:bold;font-size:15px}
.mode.active{background:#263b5d;color:white}
textarea{width:100%;min-height:125px;background:#0b1423;border:1px solid var(--line);border-radius:14px;color:white;padding:15px;font:18px Arial;resize:none;outline:none}
textarea:focus{border-color:var(--blue)}
.primary{width:100%;border:0;border-radius:15px;padding:17px;margin-top:12px;background:var(--blue);color:white;font-size:17px;font-weight:800}
.record{width:100%;height:76px;border:0;border-radius:20px;background:linear-gradient(135deg,#1ebc6c,#0d9852);color:white;font-size:19px;font-weight:900;box-shadow:0 10px 30px #10a75b3d}
.stop{width:100%;border:0;border-radius:15px;padding:16px;margin-top:10px;background:#4b2029;color:#ffafb7;font-weight:bold;font-size:16px}
.stop:disabled{opacity:.35}
#voicePanel{display:none}
.status{text-align:center;margin:15px 0;color:var(--muted);font-size:14px}
.resultBox{background:#091221;border:1px solid var(--line);border-radius:15px;padding:15px;margin-top:12px}
.resultLabel{font-size:11px;color:var(--muted);letter-spacing:1px;font-weight:bold}
#recognized{font-size:18px;line-height:1.4;margin-top:8px;min-height:26px}
#translated{font-size:20px;line-height:1.4;margin-top:8px;color:var(--yellow);font-weight:bold;min-height:26px}
.message{text-align:center;min-height:24px;margin:15px;font-size:14px}
.room{text-align:center;color:#53627a;font-size:12px;margin:24px}
</style>
</head>

<body>
<div class="app">

<div class="header">
  <div class="logo">VOICE<span>TV</span></div>
  <div id="connection" class="badge">● POVEZUJEM</div>
</div>

<div class="card">
  <div class="label">GOVORIM</div>
  <div class="langs">
    <button id="srcSl" class="lang active">🇸🇮 SLOVENŠČINA</button>
    <button id="srcHu" class="lang">🇭🇺 MAGYAR</button>
  </div>
</div>

<div class="arrow">↓</div>

<div class="card">
  <div class="label">PRIKAŽI NA ZASLONU</div>
  <div class="langs">
    <button id="dstSl" class="lang">🇸🇮 SLOVENŠČINA</button>
    <button id="dstHu" class="lang active">🇭🇺 MAGYAR</button>
  </div>
</div>

<div class="modes">
  <button id="typeBtn" class="mode active">⌨️ NAPIŠI</button>
  <button id="voiceBtn" class="mode">🎤 GOVORI</button>
</div>

<div id="typePanel" class="card">
  <div class="label">BESEDILO</div>
  <textarea id="manual" placeholder="Vpiši besedilo ..."></textarea>
  <button id="send" class="primary">POŠLJI NA ZASLON</button>
</div>

<div id="voicePanel" class="card">
  <button id="start" class="record">🎤 ZAČNI SNEMANJE</button>
  <button id="stop" class="stop" disabled>■ USTAVI IN PREPOZNAJ</button>

  <div id="voiceStatus" class="status">Pripravljen na govor.</div>

  <div class="resultBox">
    <div class="resultLabel">PREPOZNANO</div>
    <div id="recognized">...</div>
  </div>

  <div class="resultBox">
    <div class="resultLabel">PREVOD</div>
    <div id="translated">Prevod dodava v naslednjem koraku.</div>
  </div>
</div>

<div id="message" class="message"></div>
<div class="room">SOBA 123456 • PROTOTIP</div>

</div>

<script>
const URL="https://kdixpdxmdfdbxpbuljfe.supabase.co";
const KEY="sb_publishable_khd42rEJpa3-1uyVb01Jjg_7rBp-FT8";
const ROOM="123456";
const H={"apikey":KEY,"Authorization":"Bearer "+KEY};

let source="sl", target="hu", recorder, stream, chunks=[];

const $=x=>document.getElementById(x);

function active(a,b){
  $(a).classList.add("active");
  $(b).classList.remove("active");
}

function sourceLang(l){
  source=l;
  if(l==="sl"){
    active("srcSl","srcHu");
    targetLang("hu");
  }else{
    active("srcHu","srcSl");
    targetLang("sl");
  }
}

function targetLang(l){
  target=l;
  l==="sl"?active("dstSl","dstHu"):active("dstHu","dstSl");
}

$("srcSl").onclick=()=>sourceLang("sl");
$("srcHu").onclick=()=>sourceLang("hu");
$("dstSl").onclick=()=>targetLang("sl");
$("dstHu").onclick=()=>targetLang("hu");

$("typeBtn").onclick=()=>{
  active("typeBtn","voiceBtn");
  $("typePanel").style.display="block";
  $("voicePanel").style.display="none";
};

$("voiceBtn").onclick=()=>{
  active("voiceBtn","typeBtn");
  $("typePanel").style.display="none";
  $("voicePanel").style.display="block";
};

async function check(){
  try{
    let r=await fetch(URL+"/rest/v1/translation_rooms?room_code=eq."+ROOM+"&select=room_code",{headers:H});
    if(!r.ok)throw 0;
    $("connection").innerText="● POVEZANO";
  }catch(e){
    $("connection").innerText="● NI POVEZAVE";
    $("connection").style.color="var(--red)";
  }
}

async function toScreen(original,translation){
  const shown=translation||original;
  let r=await fetch(URL+"/rest/v1/translation_rooms?room_code=eq."+ROOM,{
    method:"PATCH",
    headers:{...H,"Content-Type":"application/json","Prefer":"return=minimal"},
    body:JSON.stringify({
      original_text:original,
      translated_text:shown,
      source_language:source,
      target_language:target,
      updated_at:new Date().toISOString()
    })
  });
  if(!r.ok)throw new Error("Pošiljanje ni uspelo.");
  $("message").innerText="✓ POSLANO NA ZASLON";
  $("message").style.color="var(--green)";
}

$("send").onclick=async()=>{
  const t=$("manual").value.trim();
  if(!t)return;
  try{await toScreen(t,t)}
  catch(e){$("message").innerText=e.message}
};

$("start").onclick=async()=>{
  try{
    stream=await navigator.mediaDevices.getUserMedia({audio:true});
    chunks=[];
    let opt={};
    if(MediaRecorder.isTypeSupported("audio/mp4"))opt={mimeType:"audio/mp4"};
    else if(MediaRecorder.isTypeSupported("audio/webm"))opt={mimeType:"audio/webm"};

    recorder=new MediaRecorder(stream,opt);
    recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
    recorder.onstop=transcribe;
    recorder.start();

    $("start").disabled=true;
    $("stop").disabled=false;
    $("voiceStatus").innerText="🎤 SNEMAM ...";
    $("voiceStatus").style.color="var(--green)";
  }catch(e){
    $("voiceStatus").innerText="NAPAKA MIKROFONA: "+e.message;
    $("voiceStatus").style.color="var(--red)";
  }
};

$("stop").onclick=()=>{
  if(recorder&&recorder.state!=="inactive"){
    recorder.stop();
    stream.getTracks().forEach(t=>t.stop());
    $("stop").disabled=true;
    $("voiceStatus").innerText="⏳ PREPOZNAVAM GOVOR ...";
  }
};

async function transcribe(){
  try{
    let mime=recorder.mimeType||"audio/webm";
    let ext=mime.includes("mp4")?"m4a":"webm";
    let blob=new Blob(chunks,{type:mime});
    let file=new File([blob],"voice."+ext,{type:mime});
    let form=new FormData();

    form.append("audio",file);
    form.append("language",source);
    form.append("target_language",target);

    let r=await fetch(URL+"/functions/v1/voice-transcribe",{
      method:"POST",headers:H,body:form
    });

    let raw=await r.text();
    if(!r.ok)throw new Error("HTTP "+r.status+" "+raw);

    let data=JSON.parse(raw);
    let text=(data.text||"").trim();
    if(!text)throw new Error("Ni prepoznanega besedila.");

    $("recognized").innerText=text;

    /* Trenutna Edge Function še ne prevaja. */
    let translation=(data.translated||data.translation||"").trim();

    if(translation){
      $("translated").innerText=translation;
      await toScreen(text,translation);
    }else{
      $("translated").innerText="Prevod še ni aktiviran.";
      await toScreen(text,text);
    }

    $("voiceStatus").innerText="✓ GOVOR PREPOZNAN";
    $("voiceStatus").style.color="var(--green)";
  }catch(e){
    $("voiceStatus").innerText="NAPAKA: "+e.message;
    $("voiceStatus").style.color="var(--red)";
  }
  $("start").disabled=false;
}

check();
</script>
</body>
</html>
