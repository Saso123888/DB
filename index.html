<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voice TV</title>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  background:#000;
  color:#fff;
  font-family:Arial,sans-serif;
}

body{
  overflow:hidden;
}

#status{
  position:fixed;
  top:12px;
  left:16px;
  z-index:10;
  font-size:14px;
  color:#777;
}

#screen{
  position:absolute;
  top:5%;
  left:3%;
  width:94%;
  height:90%;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  text-align:center;
  overflow:hidden;
}

#text{
  width:100%;
  max-height:100%;

  color:#ffff00;

  font-size:100px;
  line-height:1.02;
  font-weight:900;

  text-transform:uppercase;

  overflow-wrap:normal;
  word-break:normal;

  text-align:center;
}

#original{
  display:none;
}
</style>
</head>

<body>

<div id="status">POVEZUJEM...</div>

<div id="screen">
  <div id="text">ČAKAM NA BESEDILO...</div>
  <div id="original"></div>
</div>

<script>
const URL="https://kdixpdxmdfdbxpbuljfe.supabase.co";
const KEY="sb_publishable_khd42rEJpa3-1uyVb01Jjg_7rBp-FT8";
const ROOM="123456";

const screen=
  document.getElementById("screen");

const textElement=
  document.getElementById("text");

const statusElement=
  document.getElementById("status");


function fitText(){

  let size=
    Math.min(
      window.innerWidth * 0.30,
      window.innerHeight * 0.45
    );

  const minSize=
    Math.max(
      30,
      window.innerWidth * 0.05
    );

  textElement.style.fontSize=
    size+"px";


  while(
    (
      textElement.scrollWidth >
        screen.clientWidth
      ||
      textElement.scrollHeight >
        screen.clientHeight
    )
    &&
    size > minSize
  ){

    size-=2;

    textElement.style.fontSize=
      size+"px";
  }
}


function showText(text){

  textElement.innerText=
    text||
    "ČAKAM NA BESEDILO...";

  requestAnimationFrame(
    fitText
  );
}


async function load(){

  try{

    const api=
      URL+
      "/rest/v1/translation_rooms"+
      "?room_code=eq."+ROOM+
      "&select=original_text,translated_text,updated_at";

    const response=
      await fetch(
        api,
        {
          headers:{
            "apikey":KEY,
            "Authorization":
              "Bearer "+KEY
          },

          cache:"no-store"
        }
      );


    if(!response.ok){
      throw new Error(
        "HTTP "+response.status
      );
    }


    const rows=
      await response.json();


    if(!rows.length){
      throw new Error(
        "SOBA NE OBSTAJA"
      );
    }


    const row=
      rows[0];


    const original=
      (row.original_text||"")
        .trim();


    const translated=
      (row.translated_text||"")
        .trim();


    statusElement.innerText=
      "● POVEZANO";

    statusElement.style.color=
      "#00c853";


    showText(
      translated||
      original||
      "ČAKAM NA BESEDILO..."
    );

  }

  catch(error){

    console.error(error);

    statusElement.innerText=
      "● NAPAKA: "+
      error.message;

    statusElement.style.color=
      "#ff5252";
  }
}


window.addEventListener(
  "resize",
  function(){
    requestAnimationFrame(
      fitText
    );
  }
);


load();

setInterval(
  load,
  500
);
</script>

</body>
</html>
