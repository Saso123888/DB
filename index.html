<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voice TV</title>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  background:#000;
  color:#fff;
  font-family:Arial,sans-serif;
}

body{
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

#status{
  position:fixed;
  top:15px;
  left:20px;
  font-size:15px;
  color:#777;
}

#screen{
  width:96%;
  text-align:center;
}

#text{
  font-size:21vw;
  line-height:0.95;
  font-weight:900;
  color:#ffff00;
  text-transform:uppercase;
  overflow-wrap:anywhere;
  word-break:normal;
}

#original{
  margin-top:35px;
  color:#aaa;
  font-size:2vw;
}
</style>
</head>

<body>

<div id="status">POVEZUJEM...</div>

<div id="screen">
  <div id="text">ČAKAM NA BESEDILO...</div>
  <div id="original"></div>
</div>

<script>
const URL="https://kdixpdxmdfdbxpbuljfe.supabase.co";
const KEY="sb_publishable_khd42rEJpa3-1uyVb01Jjg_7rBp-FT8";
const ROOM="123456";

async function load(){
  try{

    const api=
      URL+
      "/rest/v1/translation_rooms"+
      "?room_code=eq."+ROOM+
      "&select=original_text,translated_text,updated_at";

    const response=await fetch(api,{
      headers:{
        "apikey":KEY,
        "Authorization":"Bearer "+KEY
      },
      cache:"no-store"
    });

    if(!response.ok){
      throw new Error("HTTP "+response.status);
    }

    const rows=await response.json();

    if(!rows.length){
      throw new Error("SOBA NE OBSTAJA");
    }

    const row=rows[0];

    const original=
      (row.original_text||"").trim();

    const translated=
      (row.translated_text||"").trim();

    document.getElementById("status").innerText=
      "● POVEZANO";

    document.getElementById("status").style.color=
      "#00c853";

    document.getElementById("text").innerText=
      translated||
      original||
      "ČAKAM NA BESEDILO...";

    if(
      original &&
      translated &&
      original!==translated
    ){
      document.getElementById("original").innerText=
        original;
    }
    else{
      document.getElementById("original").innerText="";
    }

  }
  catch(error){

    console.error(error);

    document.getElementById("status").innerText=
      "● NAPAKA: "+error.message;

    document.getElementById("status").style.color=
      "#ff5252";
  }
}

load();

setInterval(load,500);
</script>

</body>
</html>
