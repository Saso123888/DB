<!DOCTYPE html><html lang="sl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Phone6 CORE V0.2</title><meta name="theme-color" content="#020916"><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:#020916;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100dvh}button,select{font:inherit}.app{max-width:480px;min-height:100dvh;margin:auto;padding:30px 20px}.screen{display:none}.screen.active{display:block}.person{display:grid;grid-template-columns:90px 1fr;align-items:center;gap:15px;margin-bottom:18px;padding:18px;border:1px solid #087cff;border-radius:20px;background:#07182e}.person.two{border-color:#a84cff}.avatar{width:80px;height:80px;border:1px solid #38e4ff;border-radius:50%;background:#0a3268;color:white;font-size:45px}.two .avatar{border-color:#c176ff;background:#41196f}.language{width:100%;height:58px;border:1px solid #31577f;border-radius:14px;padding:0 12px;background:#0b2444;color:white;font-size:17px}.swap{display:block;width:60px;height:50px;margin:8px auto 18px;border:0;background:transparent;color:#39dfff;font-size:34px}.start{width:100%;height:70px;margin-top:20px;border:1px solid #38e4ff;border-radius:20px;background:#087cff;color:white;font-size:30px;font-weight:bold}.actions{display:grid;grid-template-columns:1fr 1fr;gap:14px}.next,.stop{height:64px;border-radius:18px;color:white;font-size:30px;font-weight:bold}.next{border:1px solid #38e4ff;background:#087cff}.next:disabled{opacity:.35}.stop{border:1px solid #ff6076;background:#81192f}.route{margin-top:24px;text-align:center;font-size:18px}.orb{width:190px;height:190px;margin:45px auto 25px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:#087cff;font-size:70px;box-shadow:0 0 45px rgba(0,157,255,.8)}.orb.recording{animation:pulse 1s ease-in-out infinite}.orb.processing{background:#d79e0a;box-shadow:0 0 45px rgba(255,190,0,.75)}@keyframes pulse{0%,100%{transform:scale(.94)}50%{transform:scale(1.06);box-shadow:0 0 75px #38e4ff}}.status{margin-bottom:14px;color:#38e4ff;text-align:center;font-size:21px;font-weight:bold}.timing{min-height:22px;margin-bottom:18px;color:#91a9c8;text-align:center;font-size:13px}.result{padding:18px;border:1px solid #31577f;border-radius:18px;background:#07182e}.original{min-height:35px;font-size:18px}.translation{min-height:35px;margin-top:15px;padding-top:15px;border-top:1px solid #31577f;color:#ffd65a;font-size:20px;font-weight:bold}.error{margin-top:16px;color:#ff7184;line-height:1.4}</style></head><body><main class="app"><section id="setupScreen" class="screen active"><div class="person"><button id="person1Avatar" class="avatar">👨</button><select id="language1" class="language"><option value="sl" selected>🇸🇮 Slovenščina</option><option value="hu">🇭🇺 Magyar</option><option value="en">🇬🇧 English</option><option value="pl">🇵🇱 Polski</option><option value="it">🇮🇹 Italiano</option><option value="hr">🇭🇷 Hrvatski</option></select></div><button id="swapLanguages" class="swap">⇄</button><div class="person two"><button id="person2Avatar" class="avatar">👩</button><select id="language2" class="language"><option value="sl">🇸🇮 Slovenščina</option><option value="hu" selected>🇭🇺 Magyar</option><option value="en">🇬🇧 English</option><option value="pl">🇵🇱 Polski</option><option value="it">🇮🇹 Italiano</option><option value="hr">🇭🇷 Hrvatski</option></select></div><button id="startButton" class="start">▶</button><div id="setupError" class="error"></div></section><section id="liveScreen" class="screen"><div class="actions"><button id="nextButton" class="next">✓</button><button id="stopButton" class="stop">■</button></div><div id="route" class="route"></div><div id="orb" class="orb">🎙️</div><div id="status" class="status">...</div><div id="timing" class="timing"></div><div class="result"><div id="originalText" class="original">...</div><div id="translatedText" class="translation">...</div></div><div id="liveError" class="error"></div></section></main><script>(()=>{'use strict';const URL='https://kdixpdxmdfdbxpbuljfe.supabase.co';const KEY='sb_publishable_khd42rEJpa3-1uyVb01Jjg_7rBp-FT8';const GEMINI=URL+'/functions/v1/voice-transcribe-gemini';const L={sl:['Slovenščina','🇸🇮'],hu:['Magyar','🇭🇺'],en:['English','🇬🇧'],pl:['Polski','🇵🇱'],it:['Italiano','🇮🇹'],hr:['Hrvatski','🇭🇷']};const S={p1:{gender:'male',language:'sl'},p2:{gender:'female',language:'hu'},running:false,recording:false,processing:false,stream:null,recorder:null,chunks:[],recordStarted:0};const $=id=>document.getElementById(id);const setup=$('setupScreen'),live=$('liveScreen'),a1=$('person1Avatar'),a2=$('person2Avatar'),l1=$('language1'),l2=$('language2'),next=$('nextButton'),orb=$('orb'),status=$('status'),timing=$('timing'),orig=$('originalText'),tran=$('translatedText'),err=$('liveError');function render(){a1.textContent=S.p1.gender==='male'?'👨':'👩';a2.textContent=S.p2.gender==='male'?'👨':'👩'}a1.onclick=()=>{S.p1.gender=S.p1.gender==='male'?'female':'male';render()};a2.onclick=()=>{S.p2.gender=S.p2.gender==='male'?'female':'male';render()};l1.onchange=()=>S.p1.language=l1.value;l2.onchange=()=>S.p2.language=l2.value;$('swapLanguages').onclick=()=>{const x=l1.value;l1.value=l2.value;l2.value=x;S.p1.language=l1.value;S.p2.language=l2.value};function route(){const s=L[S.p1.language],t=L[S.p2.language];$('route').textContent=`${s[1]} ${s[0]} → ${t[1]} ${t[0]}`}function recording(){orb.className='orb recording';orb.textContent='🎙️';status.textContent='Poslušam ...';next.disabled=false}function processing(){orb.className='orb processing';orb.textContent='•••';status.textContent='Prevajam ...';next.disabled=true}async function mic(){if(S.stream&&S.stream.getAudioTracks().some(t=>t.readyState==='live'))return S.stream;S.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true,channelCount:1}});return S.stream}function opts(){for(const m of ['audio/mp4','audio/webm;codecs=opus','audio/webm'])if(MediaRecorder.isTypeSupported?.(m))return{mimeType:m,audioBitsPerSecond:24000};return{audioBitsPerSecond:24000}}async function startRec(){if(!S.running||S.recording||S.processing)return;err.textContent='';const st=await mic();S.chunks=[];S.recorder=new MediaRecorder(st,opts());S.recorder.ondataavailable=e=>{if(e.data?.size)S.chunks.push(e.data)};S.recorder.start();S.recordStarted=performance.now();S.recording=true;recording()}function stopRec(){return new Promise(resolve=>{if(!S.recorder||!S.recording)return resolve(null);const r=S.recorder;r.onstop=()=>{const b=new Blob(S.chunks,{type:r.mimeType||'audio/webm'});S.recording=false;S.recorder=null;S.chunks=[];resolve(b)};try{r.requestData()}catch{};r.stop()})}async function send(blob){const ext=blob.type.includes('mp4')?'m4a':'webm',form=new FormData();form.append('audio',new File([blob],'p6.'+ext,{type:blob.type||'audio/webm'}));form.append('language',S.p1.language);form.append('source_language',S.p1.language);form.append('target_language',S.p2.language);const t0=performance.now();const res=await fetch(GEMINI,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY},body:form});const networkMs=performance.now()-t0;const raw=await res.text();let d;try{d=JSON.parse(raw)}catch{throw Error(raw||'Neveljaven odgovor')}if(!res.ok)throw Error(d.error||d.detail||d.message||'HTTP '+res.status);const o=String(d.text||d.transcript||d.transcription||d.original||d.original_text||d.source_text||d.result?.text||d.data?.text||'').trim();const tr=String(d.translated||d.translation||d.translated_text||d.target_text||d.result?.translated||d.result?.translation||d.data?.translated||d.data?.translation||'').trim();if(!o&&!tr)throw Error('Gemini ni vrnil besedila.');return{original:o||tr,translated:tr||o,networkMs}};$('startButton').onclick=async()=>{const se=$('setupError');se.textContent='';S.p1.language=l1.value;S.p2.language=l2.value;if(S.p1.language===S.p2.language){se.textContent='Izberi dva različna jezika.';return}S.running=true;S.processing=false;orig.textContent=tran.textContent='...';timing.textContent='';setup.classList.remove('active');live.classList.add('active');route();try{await startRec()}catch(e){err.textContent=e.message}};next.onclick=async()=>{if(!S.running||!S.recording||S.processing)return;S.processing=true;err.textContent='';const clickAt=performance.now();try{processing();const blob=await stopRec();const captureStopMs=performance.now()-clickAt;if(!blob||blob.size<500)throw Error('Posnetek je prekratek.');const r=await send(blob);const totalMs=performance.now()-clickAt;orig.textContent=r.original;tran.textContent=r.translated;orb.className='orb';orb.textContent='✓';status.textContent='OK';timing.textContent=`audio ${(blob.size/1024).toFixed(0)} KB · priprava ${(captureStopMs/1000).toFixed(2)} s · Gemini ${(r.networkMs/1000).toFixed(2)} s · skupaj ${(totalMs/1000).toFixed(2)} s`;S.processing=false;next.disabled=true}catch(e){S.processing=false;err.textContent=e.message||'Napaka';status.textContent='Napaka';next.disabled=false;setTimeout(()=>S.running&&startRec(),1000)}};$('stopButton').onclick=async()=>{S.running=false;S.processing=false;if(S.recording)await stopRec();S.stream?.getTracks().forEach(t=>t.stop());S.stream=null;live.classList.remove('active');setup.classList.add('active')};render()})();</script></body></html>
