<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071120">
<title>Voice Translator</title>

<style>
*{box-sizing:border-box}
:root{
  --bg:#071120;
  --card:#111e32;
  --card2:#172842;
  --line:#2a3f60;
  --text:#f5f8ff;
  --muted:#91a0b8;
  --blue:#3285ff;
  --green:#22c875;
  --red:#ff5368;
  --yellow:#ffd84d;
}
html,body{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif
}
body{padding:18px}
.app{max-width:620px;margin:auto}
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:8px 2px 22px
}
.logo{
  font-size:26px;
  font-weight:900;
  letter-spacing:-1px
}
.logo span{color:var(--blue)}
.online{
  padding:8px 11px;
  border-radius:18px;
  background:#123224;
  color:var(--green);
  font-size:12px;
  font-weight:bold
}
.card{
  padding:17px;
  margin-bottom:15px;
  border:1px solid var(--line);
  border-radius:20px;
  background:linear-gradient(145deg,var(--card2),var(--card));
  box-shadow:0 12px 30px #0004
}
.label{
  margin-bottom:12px;
  color:var(--muted);
  font-size:12px;
  font-weight:bold;
  letter-spacing:1px
}
.languages{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px
}
.lang{
  min-height:55px;
  padding:8px;
  border:1px solid var(--line);
  border-radius:14px;
  background:#101a2a;
  color:white;
  font-size:14px;
  font-weight:bold
}
.lang.active{
  border-color:#67a7ff;
  background:var(--blue);
  box-shadow:0 5px 20px #3285ff44
}
.direction{
  margin:-5px 0 10px;
  text-align:center;
  color:var(--muted);
  font-size:25px
}
.modes{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:5px;
  padding:5px;
  margin-bottom:15px;
  border:1px solid var(--line);
  border-radius:16px;
  background:#0b1728
}
.mode{
  padding:14px;
  border:0;
  border-radius:12px;
  background:transparent;
  color:var(--muted);
  font-size:15px;
  font-weight:bold
}
.mode.active{
  background:#294368;
  color:white
}
textarea{
  width:100%;
  min-height:125px;
  padding:15px 42px 15px 15px;
  border:1px solid var(--line);
  border-radius:14px;
  outline:none;
  resize:none;
  background:#081321;
  color:white;
  font:18px Arial
}
textarea:focus{border-color:var(--blue)}
.field{position:relative}
.clear{
  position:absolute;
  top:8px;
  right:8px;
  width:32px;
  height:32px;
  padding:0;
  border:0;
  border-radius:50%;
  background:#26364c;
  color:#dbe6f7;
  font-size:18px;
  font-weight:bold
}
.primary{
  width:100%;
  min-height:58px;
  margin-top:12px;
  border:0;
  border-radius:15px;
  background:var(--blue);
  color:white;
  font-size:17px;
  font-weight:900
}
.record{
  width:100%;
  min-height:75px;
  border:0;
  border-radius:19px;
  background:linear-gradient(135deg,#22c875,#0e9853);
  color:white;
  font-size:19px;
  font-weight:900;
  box-shadow:0 10px 28px #12a75c44
}
.stop{
  width:100%;
  min-height:56px;
  margin-top:10px;
  border:0;
  border-radius:14px;
  background:#54212b;
  color:#ffb0ba;
  font-size:16px;
  font-weight:bold
}
.stop:disabled{opacity:.35}
.status{
  min-height:24px;
  margin:15px 0;
  text-align:center;
  color:var(--muted);
  font-size:14px;
  font-weight:bold
}
.result{
  position:relative;
  padding:15px 43px 15px 15px;
  margin-top:12px;
  border:1px solid var(--line);
  border-radius:15px;
  background:#081321
}
.resultTitle{
  color:var(--muted);
  font-size:11px;
  font-weight:bold;
  letter-spacing:1px
}
.resultText{
  min-height:25px;
  margin-top:8px;
  font-size:19px;
  line-height:1.45;
  overflow-wrap:anywhere
}
.translation{
  color:var(--yellow);
  font-size:21px;
  font-weight:bold
}
.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:12px
}
.speak{
  min-height:56px;
  border:0;
  border-radius:14px;
  background:#6d4d00;
  color:#ffe58a;
  font-size:15px;
  font-weight:bold
}
.copy{
  min-height:56px;
  border:0;
  border-radius:14px;
  background:#273b59;
  color:white;
  font-size:15px;
  font-weight:bold
}
.clearAll{
  width:100%;
  min-height:51px;
  margin-top:15px;
  border:1px solid #64323a;
  border-radius:14px;
  background:transparent;
  color:#ff8995;
  font-weight:bold
}
#voicePanel{display:none}
.message{
  min-height:24px;
  margin:14px 0;
  text-align:center;
  font-size:14px
}
.footer{
  margin:25px 0 10px;
  text-align:center;
  color:#52647e;
  font-size:12px
}
button{touch-action:manipulation}
button:disabled{opacity:.45}
</style>
</head>

<body>
<div class="app">

<div class="header">
  <div class="logo">VOICE<span>TRANSLATOR</span></div>
  <div class="online">● AI READY</div>
</div>

<div class="card">
  <div class="label">GOVORIM / PIŠEM V JEZIKU</div>
  <div class="languages">
    <button id="srcSl" class="lang active">🇸🇮 SLOVENŠČINA</button>
    <button id="srcHu" class="lang">🇭🇺 MAGYAR</button>
    <button id="srcEn" class="lang">🇬🇧 ENGLISH</button>
    <button id="srcTl" class="lang">🇵🇭 FILIPINO</button>
  </div>
</div>

<div class="direction">↓</div>

<div class="card">
  <div class="label">PREVEDI V</div>
  <div class="languages">
    <button id="dstSl" class="lang">🇸🇮 SLOVENŠČINA</button>
    <button id="dstHu" class="lang active">🇭🇺 MAGYAR</button>
    <button id="dstEn" class="lang">🇬🇧 ENGLISH</button>
    <button id="dstTl" class="lang">🇵🇭 FILIPINO</button>
  </div>
</div>

<div class="modes">
  <button id="typeBtn" class="mode active">⌨️ NAPIŠI</button>
  <button id="voiceBtn" class="mode">🎤 GOVORI</button>
</div>

<div id="typePanel" class="card">
  <div class="label">BESEDILO</div>

  <div class="field">
    <textarea id="manual"
      placeholder="Vnesi besedilo za prevod ..."></textarea>
    <button id="clearManual" class="clear">×</button>
  </div>

  <button id="translateText" class="primary">
    PREVEDI BESEDILO
  </button>
</div>

<div id="voicePanel" class="card">
  <button id="start" class="record">
    🎤 ZAČNI SNEMANJE
  </button>

  <button id="stop" class="stop" disabled>
    ■ USTAVI IN PREVEDI
  </button>

  <div id="voiceStatus" class="status">
    Pripravljen na govor.
  </div>
</div>

<div class="card">
  <div class="result">
    <button id="clearOriginal" class="clear">×</button>
    <div class="resultTitle">PREPOZNANO / ORIGINAL</div>
    <div id="original" class="resultText">...</div>
  </div>

  <div class="result">
    <button id="clearTranslation" class="clear">×</button>
    <div class="resultTitle">PREVOD</div>
    <div id="translation"
      class="resultText translation">...</div>
  </div>

  <div class="actions">
    <button id="speak" class="speak">
      🔊 PREBERI NA GLAS
    </button>

    <button id="copy" class="copy">
      📋 KOPIRAJ PREVOD
    </button>
  </div>

  <button id="clearAll" class="clearAll">
    POČISTI VSE
  </button>
</div>

<div id="message" class="message"></div>

<div class="footer">
  VOICE TRANSLATOR • TESTNA VERZIJA
</div>

</div>

<script>
const URL =
  "https://kdixpdxmdfdbxpbuljfe.supabase.co";

const KEY =
  "sb_publishable_khd42rEJpa3-1uyVb01Jjg_7rBp-FT8";

const H = {
  "apikey": KEY,
  "Authorization": "Bearer " + KEY
};

const TTS = {
  sl: "sl-SI",
  hu: "hu-HU",
  en: "en-US",
  tl: "fil-PH"
};

let source = "sl";
let target = "hu";
let recorder = null;
let stream = null;
let chunks = [];
let currentTranslation = "";

const $ = id =>
  document.getElementById(id);

const sourceButtons = {
  sl: "srcSl",
  hu: "srcHu",
  en: "srcEn",
  tl: "srcTl"
};

const targetButtons = {
  sl: "dstSl",
  hu: "dstHu",
  en: "dstEn",
  tl: "dstTl"
};

function selectButtons(map, selected) {
  Object.keys(map).forEach(code => {
    $(map[code]).classList.toggle(
      "active",
      code === selected
    );
  });
}

function preferredTarget(language) {
  const suggestions = {
    sl: "hu",
    hu: "sl",
    en: "sl",
    tl: "en"
  };

  return suggestions[language] || "en";
}

function setSource(language) {
  source = language;
  selectButtons(sourceButtons, source);

  if (source === target) {
    setTarget(preferredTarget(source));
  }
}

function setTarget(language) {
  target = language;
  selectButtons(targetButtons, target);
}

Object.keys(sourceButtons).forEach(code => {
  $(sourceButtons[code]).onclick =
    () => setSource(code);
});

Object.keys(targetButtons).forEach(code => {
  $(targetButtons[code]).onclick =
    () => setTarget(code);
});

function showMessage(text, color) {
  $("message").innerText = text;
  $("message").style.color =
    color || "#91a0b8";
}

function showResult(original, translated) {
  $("original").innerText =
    original || "...";

  $("translation").innerText =
    translated || "...";

  currentTranslation =
    translated || "";
}

$("typeBtn").onclick = () => {
  $("typeBtn").classList.add("active");
  $("voiceBtn").classList.remove("active");
  $("typePanel").style.display = "block";
  $("voicePanel").style.display = "none";
};

$("voiceBtn").onclick = () => {
  $("voiceBtn").classList.add("active");
  $("typeBtn").classList.remove("active");
  $("voicePanel").style.display = "block";
  $("typePanel").style.display = "none";
};

async function callTranslator(form) {
  const response = await fetch(
    URL + "/functions/v1/voice-transcribe",
    {
      method: "POST",
      headers: H,
      body: form
    }
  );

  const raw = await response.text();

  let data;

  try {
    data = JSON.parse(raw);
  } catch {
    throw new Error(
      "Funkcija ni vrnila pravilnega odgovora."
    );
  }

  if (!response.ok) {
    throw new Error(
      "HTTP " +
      response.status +
      " " +
      (data.detail || data.error || raw)
    );
  }

  return data;
}

$("translateText").onclick = async () => {
  const text =
    $("manual").value.trim();

  if (!text) {
    showMessage(
      "Najprej vnesi besedilo.",
      "#ffd84d"
    );
    return;
  }

  $("translateText").disabled = true;
  $("translateText").innerText =
    "PREVAJAM ...";

  try {
    const form = new FormData();

    form.append("text", text);
    form.append("language", source);
    form.append("target_language", target);

    const data =
      await callTranslator(form);

    showResult(
      data.text,
      data.translated
    );

    showMessage(
      "✓ PREVOD JE PRIPRAVLJEN",
      "#22c875"
    );

  } catch (error) {
    showMessage(
      "NAPAKA: " + error.message,
      "#ff5368"
    );
  }

  $("translateText").disabled = false;
  $("translateText").innerText =
    "PREVEDI BESEDILO";
};

$("start").onclick = async () => {
  try {
    stream =
      await navigator.mediaDevices
        .getUserMedia({ audio: true });

    chunks = [];

    let options = {};

    if (
      MediaRecorder.isTypeSupported(
        "audio/mp4"
      )
    ) {
      options = {
        mimeType: "audio/mp4"
      };

    } else if (
      MediaRecorder.isTypeSupported(
        "audio/webm"
      )
    ) {
      options = {
        mimeType: "audio/webm"
      };
    }

    recorder =
      new MediaRecorder(
        stream,
        options
      );

    recorder.ondataavailable = event => {
      if (event.data.size) {
        chunks.push(event.data);
      }
    };

    recorder.onstop =
      transcribeAndTranslate;

    recorder.start();

    $("start").disabled = true;
    $("stop").disabled = false;

    $("voiceStatus").innerText =
      "🎤 SNEMAM ...";

    $("voiceStatus").style.color =
      "#22c875";

    showMessage("", "");

  } catch (error) {
    $("voiceStatus").innerText =
      "NAPAKA MIKROFONA: " +
      error.message;

    $("voiceStatus").style.color =
      "#ff5368";
  }
};

$("stop").onclick = () => {
  if (
    recorder &&
    recorder.state !== "inactive"
  ) {
    recorder.stop();

    stream.getTracks()
      .forEach(track => track.stop());

    $("stop").disabled = true;

    $("voiceStatus").innerText =
      "⏳ PREPOZNAVAM IN PREVAJAM ...";

    $("voiceStatus").style.color =
      "#ffd84d";
  }
};

async function transcribeAndTranslate() {
  try {
    const mime =
      recorder.mimeType ||
      "audio/webm";

    const extension =
      mime.includes("mp4")
        ? "m4a"
        : "webm";

    const blob =
      new Blob(
        chunks,
        { type: mime }
      );

    const file =
      new File(
        [blob],
        "voice." + extension,
        { type: mime }
      );

    const form =
      new FormData();

    form.append("audio", file);
    form.append("language", source);
    form.append("target_language", target);

    const data =
      await callTranslator(form);

    showResult(
      data.text,
      data.translated
    );

    $("voiceStatus").innerText =
      "✓ PREPOZNANO IN PREVEDENO";

    $("voiceStatus").style.color =
      "#22c875";

    showMessage(
      "Prevajanje uspešno.",
      "#22c875"
    );

  } catch (error) {
    $("voiceStatus").innerText =
      "NAPAKA: " +
      error.message;

    $("voiceStatus").style.color =
      "#ff5368";
  }

  $("start").disabled = false;
};

$("speak").onclick = () => {
  const text =
    currentTranslation.trim();

  if (!text) {
    showMessage(
      "Ni prevoda za predvajanje.",
      "#ffd84d"
    );
    return;
  }

  speechSynthesis.cancel();

  const utterance =
    new SpeechSynthesisUtterance(text);

  utterance.lang =
    TTS[target] || "en-US";

  utterance.rate = 0.92;
  utterance.pitch = 1;
  utterance.volume = 1;

  utterance.onstart = () => {
    showMessage(
      "🔊 PREDVAJAM PREVOD ...",
      "#ffd84d"
    );
  };

  utterance.onend = () => {
    showMessage(
      "✓ PREDVAJANJE KONČANO",
      "#22c875"
    );
  };

  utterance.onerror = event => {
    showMessage(
      "Glas za izbrani jezik ni na voljo: " +
      event.error,
      "#ff5368"
    );
  };

  speechSynthesis.speak(utterance);
};

$("copy").onclick = async () => {
  if (!currentTranslation) {
    showMessage(
      "Ni prevoda za kopiranje.",
      "#ffd84d"
    );
    return;
  }

  try {
    await navigator.clipboard.writeText(
      currentTranslation
    );

    showMessage(
      "✓ PREVOD KOPIRAN",
      "#22c875"
    );

  } catch {
    showMessage(
      "Kopiranje ni uspelo.",
      "#ff5368"
    );
  }
};

$("clearManual").onclick = () => {
  $("manual").value = "";
};

$("clearOriginal").onclick = () => {
  $("original").innerText = "...";
};

$("clearTranslation").onclick = () => {
  $("translation").innerText = "...";
  currentTranslation = "";
  speechSynthesis.cancel();
};

$("clearAll").onclick = () => {
  $("manual").value = "";
  $("original").innerText = "...";
  $("translation").innerText = "...";
  currentTranslation = "";
  $("voiceStatus").innerText =
    "Pripravljen na govor.";
  $("voiceStatus").style.color =
    "#91a0b8";
  showMessage("", "");
  speechSynthesis.cancel();
};
</script>

</body>
</html>
