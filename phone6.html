const URL="https://kdixpdxmdfdbxpbuljfe.supabase.co";const KEY="sb_publishable_khd42rEJpa3-1uyVb01Jjg_7rBp-FT8";const HEADERS={apikey:KEY,Authorization:"Bearer "+KEY};

Object.entries(LANGUAGES).forEach(([code,language])=>{$("langA").add(new Option(language.name,code));$("langB").add(new Option(language.name,code));});$("langA").value="sl";$("langB").value="en";
let turn=0,recorder=null,mediaStream=null,audioChunks=[],busy=false,recordingId=0,activeRecordingId=0,processingId=0,lastPlayedId=0,sessionId=0,inactivityTimer=null;let selectedAI="gemini";
function personName(person){if(person===0)return $("nameA").value.trim()||"Oseba A";return $("nameB").value.trim()||"Oseba B"}function personLanguage(person){return person===0?$("langA").value:$("langB").value}

async function startRecording(){if(busy||recorder?.state==="recording")return;const mySession=sessionId,myRecordingId=++recordingId;activeRecordingId=myRecordingId;if(mediaStream)mediaStream.getTracks().forEach(track=>track.stop());mediaStream=null;recorder=null;audioChunks=[];try{const newStream=await navigator.mediaDevices.getUserMedia({audio:true});if(mySession!==sessionId||myRecordingId!==activeRecordingId){newStream.getTracks().forEach(track=>track.stop());return}mediaStream=newStream;let options={};if(MediaRecorder.isTypeSupported("audio/mp4"))options={mimeType:"audio/mp4"};else if(MediaRecorder.isTypeSupported("audio/webm"))options={mimeType:"audio/webm"};const newRecorder=new MediaRecorder(mediaStream,options);recorder=newRecorder;const localChunks=[];newRecorder.ondataavailable=event=>{if(event.data.size&&mySession===sessionId&&myRecordingId===activeRecordingId&&recorder===newRecorder)localChunks.push(event.data)};newRecorder.start();audioChunks=localChunks;$("notice").textContent=""}catch(error){if(mySession===sessionId)$("notice").textContent="Napaka mikrofona: "+error.message}}

async function translateAudio(frozenChunks,frozenRecorder,sourceLanguage,targetLanguage){const mime=frozenRecorder?.mimeType||"audio/webm",extension=mime.includes("mp4")?"m4a":"webm",blob=new Blob(frozenChunks,{type:mime});if(blob.size<500)throw new Error("Posnetek je prekratek.");const file=new File([blob],"voice."+extension,{type:mime}),form=new FormData();form.append("audio",file);form.append("language",sourceLanguage);form.append("target_language",targetLanguage);const endpoint=selectedAI==="gemini"?"voice-transcribe-gemini":"voice-transcribe";const response=await fetch(URL+"/functions/v1/"+endpoint,{method:"POST",headers:HEADERS,body:form}),raw=await response.text();let data;try{data=JSON.parse(raw)}catch{throw new Error("Neveljaven odgovor AI.")}if(!response.ok)throw new Error(data.detail||data.error||raw);if(!data.text||!data.translated)throw new Error("AI ni zaznal zanesljivega govora.");return data}

async function nextTurn(){markActivity();if(busy)return;const requestedRecordingId=activeRecordingId,requestedSession=sessionId;if(!recorder||recorder.state!=="recording")return;busy=true;setUIState("processing");const spokenTurn=turn,sourceLanguage=personLanguage(spokenTurn),targetLanguage=personLanguage(spokenTurn===0?1:0),myProcessingId=++processingId,frozenRecorder=recorder;try{await stopRecording(requestedRecordingId,requestedSession);await new Promise(resolve=>setTimeout(resolve,100));const frozenChunks=audioChunks.slice();if(requestedSession!==sessionId||myProcessingId!==processingId)return;$("notice").textContent=selectedAI==="gemini"?"Gemini prevaja ...":"Whisper prevaja ...";const data=await translateAudio(frozenChunks,frozenRecorder,sourceLanguage,targetLanguage);if(requestedSession!==sessionId||myProcessingId!==processingId)return;$("original").textContent=data.text;$("translated").textContent=data.translated;$("result").classList.remove("hidden");setUIState("playing");$("notice").textContent="Predvajam prevod ...";await speakOnce(data.translated,targetLanguage,myProcessingId,requestedSession);if(requestedSession!==sessionId||myProcessingId!==processingId)return;clearLastTranslation();turn=spokenTurn===0?1:0;audioChunks=[];recorder=null;mediaStream=null;busy=false;$("notice").textContent="";await waitMs(300);if(requestedSession!==sessionId)return;render()}catch(error){if(requestedSession===sessionId&&myProcessingId===processingId){$("notice").textContent="Napaka: "+error.message;audioChunks=[];recorder=null;mediaStream=null;busy=false;setUIState("listening");await startRecording()}}finally{if(requestedSession===sessionId)busy=false}}
