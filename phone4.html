/* ===========================
   MIKROFON
=========================== */

.pulse{
  position:relative;

  display:grid;

  place-items:center;

  width:205px;
  height:205px;

  margin:
    14px auto 16px;
}


.ring{
  position:absolute;

  border:
    2px solid #087fff66;

  border-radius:50%;

  animation:
    ringPulse 1.6s infinite;
}


.r1{
  inset:0;
}


.r2{
  inset:20px;

  animation-delay:
    .25s;
}


.r3{
  inset:39px;

  animation-delay:
    .5s;
}


@keyframes ringPulse{

  0%{
    transform:
      scale(.82);

    opacity:.95;
  }

  70%{
    transform:
      scale(1.05);

    opacity:.12;
  }

  100%{
    transform:
      scale(1.05);

    opacity:0;
  }

}


.mic{
  position:relative;

  z-index:2;

  width:128px;
  height:128px;

  border:0;

  border-radius:50%;

  font-size:57px;

  animation:

}


@keyframes micBeat{

  0%,

  }

<script>

/* ===========================
   SUPABASE
=========================== */

const URL =
  "https://kdixpdxmdfdbxpbuljfe.supabase.co";


const KEY =
  "sb_publishable_khd42rEJpa3-1uyVb01Jjg_7rBp-FT8";


const HEADERS = {

  apikey:
    KEY,

  Authorization:
    "Bearer " + KEY

};


/* ===========================
   JEZIKI
=========================== */

const LANGUAGES = {

  sl:{
    name:"🇸🇮 Slovenščina",
    tts:"sl-SI"
  },

  hu:{
    name:"🇭🇺 Magyar",
    tts:"hu-HU"
  },

  en:{
    name:"🇬🇧 English",
    tts:"en-US"
  },

  tl:{
    name:"🇵🇭 Filipino",
    tts:"fil-PH"
  },

  it:{
    name:"🇮🇹 Italiano",
    tts:"it-IT"
  },

  hr:{
    name:"🇭🇷 Hrvatski",
    tts:"hr-HR"
  },

  sq:{
    name:"🇦🇱 Shqip",
    tts:"sq-AL"
  },

  de:{
    name:"🇩🇪 Deutsch",
    tts:"de-DE"
  },

  es:{
    name:"🇪🇸 Español",
    tts:"es-ES"
  },

  ru:{
    name:"🇷🇺 Русский",
    tts:"ru-RU"
  },

  uk:{
    name:"🇺🇦 Українська",
    tts:"uk-UA"
  },

  bg:{
    name:"🇧🇬 Български",
    tts:"bg-BG"
  },

  pl:{
    name:"🇵🇱 Polski",
    tts:"pl-PL"
  },

  cs:{
    name:"🇨🇿 Čeština",
    tts:"cs-CZ"
  },

  sk:{
    name:"🇸🇰 Slovenčina",
    tts:"sk-SK"
  }

};


const $ =
  id =>
    document.getElementById(
      id
    );


/* ===========================
   NAPOLNI DROPDOWNE
=========================== */

Object.entries(
  LANGUAGES
)
.forEach(
  ([code,language]) => {


    $("langA").add(

      new Option(
        language.name,
        code
      )

    );


    $("langB").add(

      new Option(
        language.name,
        code
      )

    );


  }
);


$("langA").value =
  "sl";


$("langB").value =
  "en";


/* ===========================
   STATE
=========================== */

let turn =
  0;


let recorder =
  null;


let mediaStream =
  null;


let audioChunks =
  [];


let busy =
  false;


/* VAD */

let audioContext =
  null;


let analyser =
  null;


let monitorFrame =
  null;


let speechDetected =
  false;


let speechMilliseconds =
  0;


let lastVoiceTime =
  0;


let lastFrameTime =
  0;


let recordingStarted =
  0;


/* ===========================
   OSEBI
=========================== */

function personName(
  person
){

  if(
    person === 0
  ){

    return (
      $("nameA")
        .value
        .trim()
      ||
      "Oseba A"
    );

  }


  return (
    $("nameB")
      .value
      .trim()
    ||
    "Oseba B"
  );

}


function personLanguage(
  person
){

  return (
    person === 0
      ? $("langA").value
      : $("langB").value
  );

}


/* ===========================
   RENDER
=========================== */

function render(){

  const source =
    personLanguage(
      turn
    );


  const target =
    personLanguage(
      turn === 0
        ? 1
        : 0
    );


  const listener =
    personName(
      turn === 0
        ? 1
        : 0
    );


  $("speaker").textContent =
    personName(
      turn
    );


  $("direction").textContent =
    LANGUAGES[source].name +
    " → " +
    LANGUAGES[target].name;


  $("next").textContent =
    "NAPREJ → " +
    listener;


  /*
  BARVE
  */

  $("next").className =
    "next " +
    (
      turn === 0
        ? "a"
        : "b"
    );


  $("mic").className =
    "mic " +
    (
      turn === 0
        ? "a"
        : "b"
    );


  $("pulse").className =
    "pulse " +
    (
      turn === 0
        ? "a"
        : "b"
    );


  startRecording();

}


/* ===========================
   TTS UNLOCK
=========================== */

function unlockTTS(){

  try{

    speechSynthesis.cancel();


    const utterance =
      new SpeechSynthesisUtterance(
        " "
      );


    utterance.lang =
      LANGUAGES[
        personLanguage(0)
      ].tts;


    utterance.volume =
      0.01;


    speechSynthesis.speak(
      utterance
    );


    setTimeout(
      () =>
        speechSynthesis.resume(),
      80
    );

  }
  catch(error){

    console.log(
      "TTS unlock",
      error
    );

  }

}


/* ===========================
   ZAČNI
=========================== */

function startConversation(){

  $("setup")
    .classList
    .add(
      "hidden"
    );


  $("talk")
    .classList
    .remove(
      "hidden"
    );


  turn =
    0;


  /*
  Klik ZAČNI pomaga
  odkleniti TTS v iOS.
  */

  unlockTTS();


  render();

}


/* ===========================
   START RECORDING
=========================== */

async function startRecording(){

  if(
    busy
  ){

    return;

  }


  if(
    recorder &&
    recorder.state ===
      "recording"
  ){

    return;

  }


  try{

    mediaStream =
      await navigator
        .mediaDevices
        .getUserMedia({
          audio:true
        });


    /*
    Nova oseba =
    nov buffer.
    */

    audioChunks =
      [];


    let options =
      {};


    if(
      MediaRecorder
        .isTypeSupported(
          "audio/mp4"
        )
    ){

      options = {
        mimeType:
          "audio/mp4"
      };

    }
    else if(
      MediaRecorder
        .isTypeSupported(
          "audio/webm"
        )
    ){

      options = {
        mimeType:
          "audio/webm"
      };

    }


    recorder =
      new MediaRecorder(
        mediaStream,
        options
      );


    recorder.ondataavailable =
      event => {

        if(
          event.data &&
          event.data.size
        ){

          audioChunks.push(
            event.data
          );

        }

      };


    recorder.start();


    startVoiceDetection(
      mediaStream
    );


    $("notice").textContent =
      "";

  }
  catch(error){

    $("notice").textContent =
      "Napaka mikrofona: " +
      error.message;

  }

}


/* ===========================
   VOICE ACTIVITY DETECTION
=========================== */

function startVoiceDetection(
  stream
){

  stopVoiceDetection();


  const AudioCtx =
    window.AudioContext ||
    window.webkitAudioContext;


  if(
    !AudioCtx
  ){

    return;

  }


  audioContext =
    new AudioCtx();


  const source =
    audioContext
      .createMediaStreamSource(
        stream
      );


  analyser =
    audioContext
      .createAnalyser();


  analyser.fftSize =
    1024;


  analyser
    .smoothingTimeConstant =
      0.2;


  source.connect(
    analyser
  );


  const data =
    new Uint8Array(
      analyser.fftSize
    );


  /*
  Še ni bilo govora.
  */

  speechDetected =
    false;


  speechMilliseconds =
    0;


  lastVoiceTime =
    0;


  recordingStarted =
    Date.now();


  lastFrameTime =
    performance.now();


  /*
  RMS prag.
  */

  const speechThreshold =
    0.018;


  function monitor(){

    if(
      !recorder ||
      recorder.state !==
        "recording"
    ){

      return;

    }


    analyser
      .getByteTimeDomainData(
        data
      );


    let sum =
      0;


    for(
      const value
      of data
    ){

      const normalized =
        (value - 128) /
        128;


      sum +=
        normalized *
        normalized;

    }


    const rms =
      Math.sqrt(
        sum /
        data.length
      );


    const now =
      performance.now();


    const frameDuration =
      Math.min(
        100,
        now -
        lastFrameTime
      );


    lastFrameTime =
      now;


    /*
    DEJANSKI GOVOR
    */

    if(
      rms >=
      speechThreshold
    ){

      speechDetected =
        true;


      speechMilliseconds +=
        frameDuration;


      lastVoiceTime =
        Date.now();

    }


    /*
    Govor je bil zaznan
    in imamo vsaj
    450 ms dejanskega govora.

    Nato čakamo 1,8 s tišine.
    */

    if(
      speechDetected &&
      speechMilliseconds >=
        450 &&
      Date.now() -
        lastVoiceTime >=
        1800
    ){

      $("notice").textContent =
        "Prevajam ...";


      nextTurn();


      return;

    }


    /*
    Če 30 sekund nihče
    sploh ne začne govoriti,
    NE pošiljaj Whisperju.
    Samo obnovi snemanje.
    */

    if(
      !speechDetected &&
      Date.now() -
        recordingStarted >=
        30000
    ){

      restartIdleRecording();


      return;

    }


    /*
    Varnost:
    največ 90 sekund
    ene povedi.
    */

    if(
      speechDetected &&
      Date.now() -
        recordingStarted >=
        90000
    ){

      nextTurn();


      return;

    }


    monitorFrame =
      requestAnimationFrame(
        monitor
      );

  }


  monitor();

}


/* ===========================
   STOP VAD
=========================== */

function stopVoiceDetection(){

  if(
    monitorFrame
  ){

    cancelAnimationFrame(
      monitorFrame
    );

  }


  monitorFrame =
    null;


  if(
    audioContext
  ){

    audioContext
      .close()
      .catch(
        () => {}
      );

  }


  audioContext =
    null;


  analyser =
    null;

}


/* ===========================
   IDLE RESTART
=========================== */

async function restartIdleRecording(){

  if(
    busy
  ){

    return;

  }


  await stopRecording();


  audioChunks =
    [];


  recorder =
    null;


  mediaStream =
    null;


  $("notice").textContent =
    "Čakam na govor ...";


  await startRecording();

}


/* ===========================
   STOP RECORDING
=========================== */

function stopRecording(){

  return new Promise(
    resolve => {


      if(
        !recorder ||
        recorder.state !==
          "recording"
      ){

        resolve();

        return;

      }


      stopVoiceDetection();


      recorder.onstop =
        () => {

          resolve();

        };


      recorder.stop();


      if(
        mediaStream
      ){

        mediaStream
          .getTracks()
          .forEach(
            track =>
              track.stop()
          );

      }


    }
  );

}


/* ===========================
   TRANSLATE
=========================== */

async function translateAudio(){

  const source =
    personLanguage(
      turn
    );


  const target =
    personLanguage(
      turn === 0
        ? 1
        : 0
    );


  const mime =
    recorder?.mimeType ||
    "audio/webm";


  const extension =
    mime.includes(
      "mp4"
    )
      ? "m4a"
      : "webm";


  const blob =
    new Blob(
      audioChunks,
      {
        type:mime
      }
    );


  if(
    blob.size <
    500
  ){

    throw new Error(
      "Posnetek je prekratek."
    );

  }


  const file =
    new File(
      [blob],
      "voice." +
      extension,
      {
        type:mime
      }
    );


  const form =
    new FormData();


  form.append(
    "audio",
    file
  );


  form.append(
    "language",
    source
  );


  form.append(
    "target_language",
    target
  );


  const response =
    await fetch(

      URL +
      "/functions/v1/" +
      "voice-transcribe",

      {

        method:
          "POST",

        headers:
          HEADERS,

        body:
          form

      }

    );


  const raw =
    await response.text();


  let data;


  try{

    data =
      JSON.parse(
        raw
      );

  }
  catch{

    throw new Error(
      "Neveljaven odgovor prevajalnika."
    );

  }


  if(
    !response.ok
  ){

    throw new Error(
      data.detail ||
      data.error ||
      raw
    );

  }


  return data;

}


/* ===========================
   HALUCINATION FILTER
=========================== */

function isLikelyHallucination(
  text
){

  const normalized =
    String(
      text ||
      ""
    )
    .toLowerCase()
    .replace(
      /[.!?,;:\-–—"'()]/g,
      " "
    )
    .replace(
      /\s+/g,
      " "
    )
    .trim();


  const blocked = [

    "thanks for watching",

    "thank you for watching",

    "thank you for listening",

    "please subscribe",

    "subscribe to our channel",

    "subtitles by",

    "hvala za ogled",

    "hvala ker ste gledali",

    "hvala ker poslušate",

    "hvala ker poslušate naš kanal",

    "hvala za poslušanje",

    "vala što ste gledali",

    "danke fürs zuschauen",

    "gracias por ver"

  ];


  return blocked.some(
    phrase =>

      normalized ===
        phrase

      ||

      normalized
        .startsWith(
          phrase + " "
        )

  );

}


/* ===========================
   FIND VOICE
=========================== */

function findVoice(
  languageCode
){

  const target =
    LANGUAGES[
      languageCode
    ].tts
      .toLowerCase();


  const base =
    target
      .split("-")[0];


  const voices =
    speechSynthesis
      .getVoices();


  return (

    voices.find(
      voice =>
        voice.lang
          .toLowerCase() ===
        target
    )

    ||

    voices.find(
      voice =>
        voice.lang
          .toLowerCase()
          .startsWith(base)
    )

    ||

    null

  );

}


/* ===========================
   PREDVAJAJ PREVOD
=========================== */

function speak(
  text,
  languageCode
){

  return new Promise(
    resolve => {


      if(
        !text
      ){

        resolve(
          false
        );

        return;

      }


      speechSynthesis
        .cancel();


      const utterance =
        new SpeechSynthesisUtterance(
          text
        );


      utterance.lang =
        LANGUAGES[
          languageCode
        ].tts;


      const voice =
        findVoice(
          languageCode
        );


      if(
        voice
      ){

        utterance.voice =
          voice;

      }


      utterance.rate =
        0.92;


      utterance.pitch =
        1;


      utterance.volume =
        1;


      let finished =
        false;


      const timeout =
        setTimeout(
          () => {

            finish(
              false
            );

          },

          Math.max(
            7000,
            text.length *
            170
          )

        );


      function finish(
        success
      ){

        if(
          finished
        ){

          return;

        }


        finished =
          true;


        clearTimeout(
          timeout
        );


        resolve(
          success
        );

      }


      utterance.onend =
        () =>
          finish(
            true
          );


      utterance.onerror =
        () =>
          finish(
            false
          );


      speechSynthesis
        .speak(
          utterance
        );


      setTimeout(
        () =>
          speechSynthesis
            .resume(),
        100
      );


    }
  );

}


/* ===========================
   NAPREJ
=========================== */

async function nextTurn(){

  if(
    busy
  ){

    return;

  }


  busy =
    true;


  $("next").disabled =
    true;


  const spokenTurn =
    turn;


  try{


    /*
    Če dejanskega govora
    ni bilo dovolj,
    NI klica Whisper.
    */

    if(
      !speechDetected ||
      speechMilliseconds <
        450
    ){

      await stopRecording();


      audioChunks =
        [];


      recorder =
        null;


      mediaStream =
        null;


      $("notice").textContent =
        "Govor ni bil zaznan. Poskusi ponovno.";


      busy =
        false;


      await startRecording();


      return;

    }


    /*
    Konec snemanja.
    */

    await stopRecording();


    $("notice").textContent =
      "Prepoznavam in prevajam ...";


    /*
    Whisper + prevod.
    */

    const data =
      await translateAudio();


    /*
    Sekundarna zaščita
    pred tipičnimi
    Whisper halucinacijami.
    */

    if(
      isLikelyHallucination(
        data.text
      )
    ){

      throw new Error(
        "Nezanesljiv prepis. Poved ponovi bolj jasno."
      );

    }


    /*
    Prikaži rezultat.
    */

    $("original").textContent =
      data.text ||
      "";


    $("translated").textContent =
      data.translated ||
      "";


    $("result")
      .classList
      .remove(
        "hidden"
      );


    /*
    Jezik poslušalca.
    */

    const listenerLanguage =
      personLanguage(
        spokenTurn === 0
          ? 1
          : 0
      );


    $("notice").textContent =
      "Predvajam prevod ...";


    /*
    TTS
    */

    await speak(
      data.translated,
      listenerLanguage
    );


    /*
    Zamenjaj osebo.
    */

    turn =
      spokenTurn === 0
        ? 1
        : 0;


    /*
    Zelo pomembno:
    busy sprostimo PRED
    novim startRecording().
    */

    busy =
      false;


    $("notice").textContent =
      "";


    /*
    Za novo osebo
    naredi nov audio buffer.
    */

    render();


  }
  catch(error){


    $("notice").textContent =
      "Napaka: " +
      error.message;


    /*
    Starega zvoka ne uporabljaj.
    */

    audioChunks =
      [];


    recorder =
      null;


    mediaStream =
      null;


    busy =
      false;


    /*
    Ista oseba lahko
    ponovno pove stavek.
    */

    await startRecording();

  }
  finally{

    busy =
      false;


    $("next").disabled =
      false;

  }

}


/* ===========================
   POPOLN RESET
=========================== */

async function clearConversation(){

  /*
  VAD stop
  */

  stopVoiceDetection();


  /*
  Snemanje stop
  */

  await stopRecording();


  /*
  TTS stop
  */

  speechSynthesis
    .cancel();


  /*
  Mikrofon stop
  */

  if(
    mediaStream
  ){

    mediaStream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );

  }


  /*
  Audio izbriši
  */

  audioChunks =
    [];


  recorder =
    null;


  mediaStream =
    null;


  /*
  VAD reset
  */

  speechDetected =
    false;


  speechMilliseconds =
    0;


  lastVoiceTime =
    0;


  recordingStarted =
    0;


  /*
  Tekst izbriši
  */

  $("original").textContent =
    "";


  $("translated").textContent =
    "";


  $("result")
    .classList
    .add(
      "hidden"
    );


  $("notice").textContent =
    "";


  /*
  Stanje
  */

  busy =
    false;


  turn =
    0;


  /*
  Nazaj na začetni ekran
  */

  $("talk")
    .classList
    .add(
      "hidden"
    );


  $("setup")
    .classList
    .remove(
      "hidden"
    );

}


/* ===========================
   EVENTS
=========================== */

    /*

    */

    localStorage.setItem(

KONČAJ:
popoln reset pogovora.

$("end").onclick =

tudi konča trenutno

/* ===========================
   CLEANUP
=========================== */

window.addEventListener(
  "beforeunload",
  () => {


    stopVoiceDetection();


    speechSynthesis
      .cancel();


    if(
      mediaStream
    ){

      mediaStream
        .getTracks()
        .forEach(
          track =>
            track.stop()
        );

    }


  }
);
