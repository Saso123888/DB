<style>
*{

}

:root{
  --bg:#061224;
  --card:#0d213d;
  --line:#294a75;
  --text:#f7f9ff;
  --muted:#a8b4c8;
  --blue:#078cff;
  --cyan:#13dfc5;
  --red:#d62943;
  --yellow:#ffd54a
}

html,body{
  margin:0;
  min-height:100%;
  background:
    radial-gradient(
      circle at 50% 10%,
      #0c2e58 0,
      #061224 42%,
      #030b17 100%
    );
  color:var(--text);
  font-family:Arial,sans-serif
}

body{
  padding:
    max(18px,env(safe-area-inset-top))
    18px
    max(18px,env(safe-area-inset-bottom))
}

.app{
  max-width:520px;
  margin:auto
}

.hidden{
  display:none!important
}


/* =========================
   ZAČETNI ZASLON
========================= */

.brand{
  text-align:center;
  margin:8px 0 28px
}

.brand img{
  width:82px;
  height:82px;
  display:block;
  margin:auto;
  border-radius:23px
}

.card{
  margin-bottom:15px;
  padding:18px;
  border:1px solid var(--line);
  border-radius:22px;
  background:
    linear-gradient(
      145deg,
      #102a4c,
      #0a1930
    );
  box-shadow:0 16px 38px #0006
}

input,
select{
  width:100%;
  height:57px;
  padding:0 15px;
  border-radius:15px;
  outline:none;
  color:#fff;
  font-size:18px
}

input{
  margin-bottom:12px
}

select{
  border:1px solid #5276a5;
  background:#0b1c34
}


/* OSEBA A */

.nameAInput{
  border:1px solid #168cff;
  background:#08244a;
  color:#72bdff;
  font-weight:900
}


/* OSEBA B */

.nameBInput{
  border:1px solid #13d7b9;
  background:#073a35;
  color:#67efd9;
  font-weight:900
}


.start{
  width:100%;
  height:68px;
  margin-top:7px;
  border:0;
  border-radius:18px;
  background:
    linear-gradient(
      90deg,
      #087df1,
      #079efe
    );
  color:#fff;
  font-size:19px;
  font-weight:900;
  box-shadow:0 12px 30px #087df155
}


/* =========================
   POGOVOR HEADER
========================= */

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:24px
}

.miniBrand img{
  width:44px;
  height:44px;
  border-radius:13px
}

.gear{
  border:0;
  background:transparent;
  color:#b7c6da;
  font-size:25px
}


/* =========================
   ZGORNJA GUMBA
========================= */

.people{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-bottom:17px
}

.topNext,
.topEnd{
  height:56px;
  border-radius:27px;
  font-size:15px;
  font-weight:900
}

.topNext{
  border:0
}


/* Govori A */

.topNext.speakerA{
  background:
    linear-gradient(
      90deg,
      #078eff,
      #0a7bee
    );
  color:#fff
}


/* Govori B */

.topNext.speakerB{
  background:
    linear-gradient(
      90deg,
      #18dfbd,
      #10bda4
    );
  color:#042d28
}


/* Končaj */

.topEnd{
  border:1px solid #a63b4b;
  background:
    linear-gradient(
      90deg,
      #d62943,
      #a71730
    );
  color:#fff
}


/* =========================
   SMER
========================= */

.direction{
  text-align:center;
  color:#d4dbea;
  font-size:14px
}


/* =========================
   GOVOREC
========================= */

.speaker{
  margin:19px 0 0;
  text-align:center;
  font-size:36px;
  font-weight:900;
  letter-spacing:1px
}

.speakLabel{
  margin-top:5px;
  text-align:center;
  color:#bfcae0;
  font-size:20px;
  font-weight:900
}


/* =========================
   MIKROFON
========================= */

.pulse{
  position:relative;
  display:grid;
  place-items:center;
  width:205px;
  height:205px;
  margin:14px auto 16px
}

.ring{
  position:absolute;
  border:2px solid #087fff55;
  border-radius:50%;
  animation:ringPulse 1.6s infinite
}

.r1{
  inset:0
}

.r2{
  inset:20px;
  animation-delay:.25s
}

.r3{
  inset:39px;
  animation-delay:.5s
}


@keyframes ringPulse{

  0%{
    transform:scale(.82);
    opacity:.95
  }

  70%{
    transform:scale(1.05);
    opacity:.12
  }

  100%{
    transform:scale(1.05);
    opacity:0
  }

}


.mic{
  position:relative;
  z-index:2;
  width:128px;
  height:128px;
  border:0;
  border-radius:50%;
  color:#fff;
  font-size:57px
}


/* A govori = MODRO */

.mic.speakerA{
  background:
    radial-gradient(
      circle at 35% 25%,
      #43c8ff,
      #0784ff 50%,
      #0b58c4
    );

  box-shadow:
    0 0 22px #078cff,
    0 0 55px #078cff99
}


/* B govori = ZELENO */

.mic.speakerB{
  background:
    radial-gradient(
      circle at 35% 25%,
      #5cf3de,
      #13d7b9 50%,
      #078a78
    );

  color:#032d29;

  box-shadow:
    0 0 22px #13dfc5,
    0 0 55px #13dfc599
}


/* Mikrofon utripa samo med snemanjem */

.mic.recording{
  animation:micBeat 1.1s ease-in-out infinite
}


@keyframes micBeat{

  0%,100%{
    transform:scale(1)
  }

  50%{
    transform:scale(1.09)
  }

}


/* Barva krogov A */

.pulse.speakerA .ring{
  border-color:#078fff66
}


/* Barva krogov B */

.pulse.speakerB .ring{
  border-color:#13dfc566
}


/*
Napisa SNEMANJE POTEKA
ne prikazujemo.
*/

.recordState{
  display:none
}


/* =========================
   PREVOD
========================= */

.result{
  margin:15px 0;
  padding:15px;
  border:1px solid var(--line);

}

.resultTitle{

}

.original{

.translated{

  font-size:12px
}

.notice{

  color:#ffd36b

<script>

/* =========================
   SUPABASE
========================= */

const URL =
  "https://kdixpdxmdfdbxpbuljfe.supabase.co";

const KEY =
  "sb_publishable_khd42rEJpa3-1uyVb01Jjg_7rBp-FT8";

const HEADERS = {
  "apikey":KEY,
  "Authorization":"Bearer "+KEY
};


/* =========================
   JEZIKI
========================= */

const LANGUAGES = {

  sl:{
    name:"🇸🇮 Slovenščina",
    tts:"sl-SI"
  },

  hu:{
    name:"🇭🇺 Magyar",
    tts:"hu-HU"
  },

  en:{
    name:"🇬🇧 English",
    tts:"en-US"
  },

  tl:{
    name:"🇵🇭 Filipino",
    tts:"fil-PH"
  },

  it:{
    name:"🇮🇹 Italiano",
    tts:"it-IT"
  },

  hr:{
    name:"🇭🇷 Hrvatski",
    tts:"hr-HR"
  },

  sq:{
    name:"🇦🇱 Shqip",
    tts:"sq-AL"
  },

  de:{
    name:"🇩🇪 Deutsch",
    tts:"de-DE"
  },

  es:{
    name:"🇪🇸 Español",
    tts:"es-ES"
  },

  ru:{
    name:"🇷🇺 Русский",
    tts:"ru-RU"
  },

  uk:{
    name:"🇺🇦 Українська",
    tts:"uk-UA"
  },

  bg:{
    name:"🇧🇬 Български",
    tts:"bg-BG"
  },

  pl:{
    name:"🇵🇱 Polski",
    tts:"pl-PL"
  },

  cs:{
    name:"🇨🇿 Čeština",
    tts:"cs-CZ"
  },

  sk:{
    name:"🇸🇰 Slovenčina",
    tts:"sk-SK"
  }

};


const $ =
  id =>
    document.getElementById(id);


/* =========================
   DROPDOWN
========================= */

Object.entries(
  LANGUAGES
)
.forEach(
  ([code,language]) => {

    $("langA").add(
      new Option(
        language.name,
        code
      )
    );


    $("langB").add(
      new Option(
        language.name,
        code
      )
    );

  }
);


$("langA").value =
  "sl";


$("langB").value =
  "en";


/* =========================
   STATE
========================= */

let turn =
  0;

let recorder =
  null;

let stream =
  null;

let chunks =
  [];

let busy =
  false;


/* TIŠINA */

let audioContext =
  null;

let analyser =
  null;

let monitorFrame =
  null;

let lastSoundAt =
  0;


/* =========================
   OSEBA
========================= */

function personName(
  person
){

  if(
    person === 0
  ){

    return (
      $("nameA")
        .value
        .trim()
      ||
      "Oseba A"
    );

  }


  return (
    $("nameB")
      .value
      .trim()
    ||
    "Oseba B"
  );

}


function personLanguage(
  person
){

  return person === 0
    ? $("langA").value
    : $("langB").value;

}


/* =========================
   TTS TIHI ODKLEP
========================= */

function unlockVoice(){

  const code =
    personLanguage(
      turn
    );


  try{

    speechSynthesis
      .cancel();


    const utterance =
      new SpeechSynthesisUtterance(
        " "
      );


    utterance.lang =
      LANGUAGES[code].tts;


    utterance.volume =
      0.01;


    speechSynthesis
      .speak(
        utterance
      );


    setTimeout(
      () =>
        speechSynthesis
          .resume(),
      80
    );

  }
  catch(error){

    console.log(
      "TTS unlock:",
      error
    );

  }

}


/* =========================
   START POGOVORA
========================= */

function showTalk(){

  $("setup")
    .classList
    .add("hidden");


  $("talk")
    .classList
    .remove("hidden");


  turn =
    0;


  unlockVoice();


  render();

}


/* =========================
   RENDER
========================= */

function render(){

  const nameA =
    personName(0);


  const nameB =
    personName(1);


  $("speaker").textContent =
    turn === 0
      ? nameA
      : nameB;


  const source =
    personLanguage(
      turn
    );


  const target =
    personLanguage(
      turn === 0
        ? 1
        : 0
    );


  $("direction").textContent =
    LANGUAGES[source].name +
    " → " +
    LANGUAGES[target].name;


  const nextPerson =
    turn === 0
      ? nameB
      : nameA;


  $("next").textContent =
    "NAPREJ → " +
    nextPerson;


  /*
  ZGORNJI GUMB
  */

  $("next")
    .classList
    .toggle(
      "speakerA",
      turn === 0
    );


  $("next")
    .classList
    .toggle(
      "speakerB",
      turn === 1
    );


  /*
  MIKROFON
  */

  $("mic")
    .classList
    .toggle(
      "speakerA",
      turn === 0
    );


  $("mic")
    .classList
    .toggle(
      "speakerB",
      turn === 1
    );


  /*
  KROGI
  */

  $("pulse")
    .classList
    .toggle(
      "speakerA",
      turn === 0
    );


  $("pulse")
    .classList
    .toggle(
      "speakerB",
      turn === 1
    );


  startRecording();

}


/* =========================
   START RECORDING
========================= */

async function startRecording(){

  if(busy){
    return;
  }


  if(
    recorder &&
    recorder.state ===
      "recording"
  ){

    return;
  }


  try{

    stream =
      await navigator
        .mediaDevices
        .getUserMedia({
          audio:true
        });


    /*
    NOV GOVOREC =
    NOV PRAZEN AUDIO BUFFER
    */

    chunks =
      [];


    let options =
      {};


    if(
      MediaRecorder
        .isTypeSupported(
          "audio/mp4"
        )
    ){

      options = {
        mimeType:
          "audio/mp4"
      };

    }
    else if(
      MediaRecorder
        .isTypeSupported(
          "audio/webm"
        )
    ){

      options = {
        mimeType:
          "audio/webm"
      };

    }


    recorder =
      new MediaRecorder(
        stream,
        options
      );


    recorder.ondataavailable =
      event => {

        if(
          event.data &&
          event.data.size
        ){

          chunks.push(
            event.data
          );

        }

      };


    recorder.start();


    startSilenceMonitor(
      stream
    );


    $("mic")
      .classList
      .add(
        "recording"
      );


    $("notice").textContent =
      "";

  }
  catch(error){

    $("notice").textContent =
      "Napaka mikrofona: " +
      error.message;

  }

}


/* =========================
   TIŠINA
========================= */

function startSilenceMonitor(
  activeStream
){

  stopSilenceMonitor();


  const AudioCtx =
    window.AudioContext ||
    window.webkitAudioContext;


  if(
    !AudioCtx
  ){

    return;

  }


  try{

    audioContext =
      new AudioCtx();


    const source =
      audioContext
        .createMediaStreamSource(
          activeStream
        );


    analyser =
      audioContext
        .createAnalyser();


    analyser.fftSize =
      512;


    source.connect(
      analyser
    );


    const data =
      new Uint8Array(
        analyser.fftSize
      );


    lastSoundAt =
      Date.now();


    /*
    Prag za zaznavanje govora.
    */

    const threshold =
      8;


    function monitor(){

      if(
        !recorder ||
        recorder.state !==
          "recording"
      ){

        return;

      }


      analyser
        .getByteTimeDomainData(
          data
        );


      let sum =
        0;


      for(
        const value
        of data
      ){

        const sample =
          value - 128;


        sum +=
          sample *
          sample;

      }


      const rms =
        Math.sqrt(
          sum /
          data.length
        );


      if(
        rms >
        threshold
      ){

        lastSoundAt =
          Date.now();

      }


      /*
      10 SEKUND BREZ GOVORA
      */

      if(
        Date.now() -
        lastSoundAt >=
        10000
      ){

        $("notice").textContent =
          "Tišina zaznana. Nadaljujem ...";


        nextTurn();


        return;

      }


      monitorFrame =
        requestAnimationFrame(
          monitor
        );

    }


    monitor();

  }
  catch(error){

    console.log(
      "Silence monitor:",
      error
    );

  }

}


/* =========================
   STOP SILENCE
========================= */

function stopSilenceMonitor(){

  if(
    monitorFrame
  ){

    cancelAnimationFrame(
      monitorFrame
    );

  }


  monitorFrame =
    null;


  if(
    audioContext
  ){

    audioContext
      .close()
      .catch(
        () => {}
      );

  }


  audioContext =
    null;


  analyser =
    null;

}


/* =========================
   STOP RECORDING
========================= */

function stopRecording(){

  return new Promise(
    resolve => {

      if(
        !recorder ||
        recorder.state !==
          "recording"
      ){

        resolve();

        return;

      }


      stopSilenceMonitor();


      recorder.onstop =
        () => {

          resolve();

        };


      recorder.stop();


      if(stream){

        stream
          .getTracks()
          .forEach(
            track =>
              track.stop()
          );

      }


      $("mic")
        .classList
        .remove(
          "recording"
        );

    }
  );

}


/* =========================
   PREVOD
========================= */

async function translate(){

  const source =
    personLanguage(
      turn
    );


  const target =
    personLanguage(
      turn === 0
        ? 1
        : 0
    );


  const mime =
    recorder?.mimeType ||
    "audio/webm";


  const extension =
    mime.includes("mp4")
      ? "m4a"
      : "webm";


  const blob =
    new Blob(
      chunks,
      {
        type:mime
      }
    );


  if(
    blob.size < 500
  ){

    throw new Error(
      "Posnetek je prekratek."
    );

  }


  const file =
    new File(
      [blob],
      "voice." +
      extension,
      {
        type:mime
      }
    );


  const form =
    new FormData();


  form.append(
    "audio",
    file
  );


  form.append(
    "language",
    source
  );


  form.append(
    "target_language",
    target
  );


  const response =
    await fetch(

      URL +
      "/functions/v1/" +
      "voice-transcribe",

      {

        method:"POST",

        headers:
          HEADERS,

        body:
          form

      }

    );


  const raw =
    await response.text();


  let data;


  try{

    data =
      JSON.parse(
        raw
      );

  }
  catch{

    throw new Error(
      "Neveljaven odgovor prevajalnika."
    );

  }


  if(
    !response.ok
  ){

    throw new Error(
      data.detail ||
      data.error ||
      raw
    );

  }


  return data;

}


/* =========================
   TTS VOICE
========================= */

function findVoice(
  languageCode
){

  const voices =
    speechSynthesis
      .getVoices();


  const target =
    LANGUAGES[
      languageCode
    ].tts
      .toLowerCase();


  const base =
    target
      .split("-")[0];


  return (

    voices.find(
      voice =>
        voice.lang
          .toLowerCase() ===
        target
    )

    ||

    voices.find(
      voice =>
        voice.lang
          .toLowerCase()
          .startsWith(base)
    )

    ||

    null

  );

}


/* =========================
   PREDVAJANJE
========================= */

function speak(
  text,
  languageCode
){

  return new Promise(
    resolve => {

      if(
        !text
      ){

        resolve(
          false
        );

        return;

      }


      speechSynthesis
        .cancel();


      const utterance =
        new SpeechSynthesisUtterance(
          text
        );


      utterance.lang =
        LANGUAGES[
          languageCode
        ].tts;


      const voice =
        findVoice(
          languageCode
        );


      if(
        voice
      ){

        utterance.voice =
          voice;

      }


      utterance.rate =
        0.92;


      utterance.pitch =
        1;


      utterance.volume =
        1;


      let finished =
        false;


      const timeout =
        setTimeout(
          () => {

            finish(
              false
            );

          },

          Math.max(
            7000,
            text.length *
            170
          )

        );


      function finish(
        success
      ){

        if(
          finished
        ){

          return;

        }


        finished =
          true;


        clearTimeout(
          timeout
        );


        resolve(
          success
        );

      }


      utterance.onend =
        () =>
          finish(
            true
          );


      utterance.onerror =
        () =>
          finish(
            false
          );


      speechSynthesis
        .speak(
          utterance
        );


      setTimeout(
        () =>
          speechSynthesis
            .resume(),
        100
      );

    }
  );

}


/* =========================
   NAPREJ
========================= */

async function nextTurn(){

  if(
    busy
  ){

    return;

  }


  busy =
    true;


  $("next").disabled =
    true;


  $("notice").textContent =
    "Prepoznavam in prevajam ...";


  try{

    /*
    KDO JE GOVORIL?
    */

    const spokenTurn =
      turn;


    await stopRecording();


    const data =
      await translate();


    /*
    PRIKAŽI REZULTAT
    */

    $("original").textContent =
      data.text ||
      "";


    $("translated").textContent =
      data.translated ||
      "";


    $("result")
      .classList
      .remove(
        "hidden"
      );


    /*
    JEZIK POSLUŠALCA
    */

    const targetLanguage =
      spokenTurn === 0
        ? $("langB").value
        : $("langA").value;


    $("notice").textContent =
      "Predvajam prevod ...";


    /*
    PREDVAJAJ PREVOD
    */

    await speak(
      data.translated,
      targetLanguage
    );


    /*
    MENJAVA
    */

    turn =
      spokenTurn === 0
        ? 1
        : 0;


    /*
    SPROSTI BUSY,
    DA SE NOV GOVOREC
    LAHKO TAKOJ SNEMA.
    */

    busy =
      false;


    $("notice").textContent =
      "";


    render();

  }
  catch(error){

    $("notice").textContent =
      "Napaka: " +
      error.message;


    busy =
      false;


    await startRecording();

  }
  finally{

    busy =
      false;


    $("next").disabled =
      false;

  }

}


/* =========================
   NASTAVITVE
========================= */

async function openSettings(){

  stopSilenceMonitor();


  await stopRecording();


  speechSynthesis.cancel();


  $("talk")
    .classList
    .add("hidden");


  $("setup")
    .classList
    .remove("hidden");

}


/* =========================
   KONČAJ POGOVOR
========================= */

async function endConversation(){

  /*
  1.
  USTAVI TIŠINO
  */

  stopSilenceMonitor();


  /*
  2.
  USTAVI SNEMANJE
  */

  await stopRecording();


  /*
  3.
  USTAVI VSE GLASOVE
  */

  speechSynthesis.cancel();


  /*
  4.
  USTAVI MIKROFON
  */

  if(stream){

    stream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );

  }


  /*
  5.
  POBRIŠI AUDIO
  */

  chunks =
    [];


  recorder =
    null;


  stream =
    null;


  /*
  6.
  POBRIŠI TEKST
  */

  $("original").textContent =
    "";


  $("translated").textContent =
    "";


  $("result")
    .classList
    .add(
      "hidden"
    );


  $("notice").textContent =
    "";


  /*
  7.
  PONASTAVI
  */

  busy =
    false;


  turn =
    0;


  $("mic")
    .classList
    .remove(
      "recording"
    );


  /*
  8.
  NAZAJ NA ZAČETEK
  */

  $("talk")
    .classList
    .add(
      "hidden"
    );


  $("setup")
    .classList
    .remove(
      "hidden"
    );


  /*
  Imena in izbrana jezika
  namenoma ostaneta.
  To sta nastavitvi,
  ne zgodovina pogovora.
  */

}


/* =========================
   EVENTS
========================= */

$("start").onclick =
  showTalk;


$("next").onclick =
  nextTurn;


$("settings").onclick =
  openSettings;


$("end").onclick =
  endConversation;


/*
Klik mikrofona lahko
ročno zaključi trenutni govor.
*/

$("mic").onclick =
  async () => {

    if(
      recorder &&
      recorder.state ===
        "recording"
    ){

      await nextTurn();

    }
    else{

      await startRecording();

    }

  };


/* =========================
   SAVE SETTINGS
========================= */

$("start")
  .addEventListener(
    "click",
    () => {

      localStorage.setItem(
        "phone4NameA",
        personName(0)
      );


      localStorage.setItem(
        "phone4NameB",
        personName(1)
      );


      localStorage.setItem(
        "phone4LangA",
        personLanguage(0)
      );


      localStorage.setItem(
        "phone4LangB",
        personLanguage(1)
      );

    }
  );


/* =========================
   RESTORE SETTINGS
========================= */

const savedA =
  localStorage.getItem(
    "phone4NameA"
  );


const savedB =
  localStorage.getItem(
    "phone4NameB"
  );


const savedLangA =
  localStorage.getItem(
    "phone4LangA"
  );


const savedLangB =
  localStorage.getItem(
    "phone4LangB"
  );


if(
  savedA
){

  $("nameA").value =
    savedA;

}


if(
  savedB
){

  $("nameB").value =
    savedB;

}


if(
  savedLangA &&
  LANGUAGES[
    savedLangA
  ]
){

  $("langA").value =
    savedLangA;

}


if(
  savedLangB &&
  LANGUAGES[
    savedLangB
  ]
){

  $("langB").value =
    savedLangB;

}


/* =========================
   CLEANUP
========================= */

window.addEventListener(
  "beforeunload",
  () => {

    stopSilenceMonitor();


    speechSynthesis.cancel();


    if(stream){

      stream
        .getTracks()
        .forEach(
          track =>
            track.stop()
        );

    }

  }
);
