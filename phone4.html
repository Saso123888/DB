<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

<title>Voice Pogovor</title>

<meta name="theme-color" content="#061224">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Voice Pogovor">

<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">

<style>
*{box-sizing:border-box}

:root{
  --bg:#061224;
  --card:#0d213d;
  --line:#294a75;
  --text:#f7f9ff;
  --muted:#a8b4c8;
  --blue:#078cff;
  --cyan:#13dfc5;
  --red:#ff485d;
  --yellow:#ffd54a;
  --green:#30df92
}

html,body{
  margin:0;
  min-height:100%;
  background:
    radial-gradient(
      circle at 50% 10%,
      #0c2e58 0,
      #061224 42%,
      #030b17 100%
    );
  color:var(--text);
  font-family:Arial,sans-serif
}

body{
  padding:
    max(18px,env(safe-area-inset-top))
    18px
    max(18px,env(safe-area-inset-bottom))
}

.app{
  max-width:520px;
  margin:auto;
  min-height:calc(100vh - 36px)
}

.hidden{
  display:none!important
}


/* IKONA */

.brand{
  text-align:center;
  margin:8px 0 25px
}

.brand img{
  width:82px;
  height:82px;
  border-radius:23px;
  display:block;
  margin:auto
}


/* NASTAVITVE */

.card{
  margin-bottom:15px;
  padding:18px;
  background:
    linear-gradient(
      145deg,
      #102a4c,
      #0a1930
    );
  border:1px solid var(--line);
  border-radius:22px;
  box-shadow:0 16px 38px #0006
}

input,
select{
  width:100%;
  height:57px;
  padding:0 15px;
  border-radius:15px;
  outline:none;
  color:#fff;
  font-size:18px
}

input{
  margin-bottom:12px
}

select{
  border:1px solid #5276a5;
  background:#0b1c34
}


/* OSEBA A */

.nameAInput{
  border:1px solid #168cff;
  background:#08244a;
  color:#72bdff;
  font-weight:900
}

.nameAInput:focus{
  border-color:#55b0ff;
  box-shadow:0 0 0 2px #168cff33
}


/* OSEBA B */

.nameBInput{
  border:1px solid #13d7b9;
  background:#073a35;
  color:#67efd9;
  font-weight:900
}

.nameBInput:focus{
  border-color:#55ead3;
  box-shadow:0 0 0 2px #13d7b933
}


/* ZAČNI */

.start{
  width:100%;
  height:68px;
  margin-top:7px;
  border:0;
  border-radius:18px;
  background:
    linear-gradient(
      90deg,
      #087df1,
      #079efe
    );
  color:#fff;
  font-size:19px;
  font-weight:900;
  box-shadow:0 12px 30px #087df155
}


/* POGOVOR HEADER */

.top{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  margin-bottom:24px
}

.miniBrand{
  margin-right:auto
}

.miniBrand img{
  width:44px;
  height:44px;
  border-radius:13px
}

.gear{
  border:0;
  background:transparent;
  color:#b7c6da;
  font-size:25px
}


/* OSEBI */

.people{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:12px;
  margin-bottom:17px
}

.pill{
  height:53px;
  border:1px solid #284b78;
  border-radius:25px;
  background:#0d203c;
  color:#b8c7db;
  font-size:17px;
  font-weight:900
}

.pill.active{
  border:0;
  background:
    linear-gradient(
      90deg,
      #078eff,
      #0a7bee
    );
  color:#fff
}

#pillB.active{
  background:
    linear-gradient(
      90deg,
      #14d9bc,
      #10bca7
    );
  color:#042d29
}

.arrow{
  color:#cbd6e6;
  font-size:28px
}

.direction{
  text-align:center;
  color:#d4dbea;
  font-size:14px
}


/* AKTIVNI GOVOREC */

.speaker{
  margin:20px 0 0;
  text-align:center;
  font-size:38px;
  font-weight:900;
  letter-spacing:1px
}

.speakLabel{
  margin-top:6px;
  text-align:center;
  color:#bfcae0;
  font-size:21px;
  font-weight:900
}


/* MIKROFON */

.pulse{
  position:relative;
  display:grid;
  place-items:center;
  width:205px;
  height:205px;
  margin:14px auto 16px
}

.ring{
  position:absolute;
  border:2px solid #087fff55;
  border-radius:50%;
  animation:pulse 1.6s infinite
}

.r1{inset:0}

.r2{
  inset:20px;
  animation-delay:.25s
}

.r3{
  inset:39px;
  animation-delay:.5s
}

@keyframes pulse{

  0%{
    transform:scale(.82);
    opacity:.9
  }

  70%{
    transform:scale(1.04);
    opacity:.15
  }

  100%{
    transform:scale(1.04);
    opacity:0
  }
}

.mic{
  position:relative;
  z-index:2;
  width:128px;
  height:128px;
  border:0;
  border-radius:50%;
  background:
    radial-gradient(
      circle at 35% 25%,
      #24d8ff,
      #0784ff 50%,
      #0b58c4
    );
  color:#fff;
  font-size:57px;
  box-shadow:0 0 42px #07a7ffcc
}

.mic.recording{
  background:
    radial-gradient(
      circle at 35% 25%,
      #ff7181,
      #e72943 55%,
      #9e1027
    )
}

.recordState{
  min-height:25px;
  text-align:center;
  color:#d9e0ec;
  font-size:14px
}

.dot{
  display:inline-block;
  width:11px;
  height:11px;
  margin-right:8px;
  border-radius:50%;
  background:var(--red);
  box-shadow:0 0 12px var(--red);
  animation:blink 1s infinite
}

@keyframes blink{
  50%{opacity:.25}
}


/* ZADNJI PREVOD */

.result{
  margin:15px 0;
  padding:15px;
  border:1px solid var(--line);
  border-radius:18px;
  background:#09192f
}

.resultTitle{
  color:#8697af;
  font-size:11px;
  font-weight:900
}

.original{
  margin-top:7px;
  color:#cad4e3;
  font-size:15px
}

.translated{
  margin-top:7px;
  color:var(--yellow);
  font-size:19px;
  font-weight:900
}


/* NAPREJ */

.instruction{
  margin:20px 0 11px;
  text-align:center;
  color:#c2ccda
}

.next{
  width:100%;
  height:70px;
  border:0;
  border-radius:21px;
  background:
    linear-gradient(
      90deg,
      #14e5c6,
      #18d6bb
    );
  color:#062d2a;
  font-size:20px;
  font-weight:900;
  box-shadow:0 12px 30px #10d7bd44
}

.next:disabled{
  opacity:.45
}

.small{
  margin:12px;
  text-align:center;
  color:#aeb9c9;
  font-size:12px
}

.notice{
  min-height:22px;
  margin-top:9px;
  text-align:center;
  color:#ffd36b
}


/* KONČAJ */

.bottom{
  margin-top:25px;
  padding-top:19px;
  border-top:1px solid #29405d;
  text-align:center
}

.endText{
  width:100%;
  min-height:58px;
  border:1px solid #a63b4b;
  border-radius:17px;
  background:
    linear-gradient(
      90deg,
      #d62943,
      #a71730
    );
  color:#fff;
  font-size:17px;
  font-weight:900;
  box-shadow:0 10px 28px #a7173044
}
</style>
</head>


<body>

<div class="app">


<!-- ZAČETNI ZASLON -->

<section id="setup">

    >

  </div>


  <!-- OSEBA A -->

    <input
      id="nameA"
      class="nameAInput"

    >

    <select id="langA"></select>

  </div>


  <!-- OSEBA B -->

  <div class="card">

    <input
      id="nameB"
      class="nameBInput"
      value="Oseba B"
    >

    <select id="langB"></select>

  </div>


  <button
    id="start"
    class="start"
  >
    ZAČNI POGOVOR
  </button>

</section>


<!-- POGOVOR -->

<section
  id="talk"
  class="hidden"
>


  <div class="top">

    <div class="miniBrand">

      <img
        src="apple-touch-icon.png"
        alt=""
      >

    </div>


    <button
      id="settings"
      class="gear"
      type="button"
    >
      ⚙
    </button>

  </div>


  <div class="people">

    <button
      id="pillA"
      type="button"

    ></button>


    <div class="arrow">

    </div>


    <button
      id="pillB"
      type="button"

    ></button>

  </div>


  <div
    id="direction"
    class="direction"
  ></div>


  <div
    id="speaker"
    class="speaker"
  ></div>


  <div class="speakLabel">
    GOVORI
  </div>


  <div class="pulse">

    <div class="ring r1"></div>
    <div class="ring r2"></div>
    <div class="ring r3"></div>

      id="mic"

  <div

  >

  </div>


  <button

  >

  </button>


  <div class="small">
    Prevedi, predvajaj in predaj besedo.
  </div>


  <div
    id="notice"
    class="notice"
  ></div>


  <div class="bottom">

    <button
      id="end"
      type="button"
      class="endText"
    >
      KONČAJ POGOVOR
    </button>

  </div>

</section>

</div>


<script>

/*
=========================================
SUPABASE
=========================================
*/

const URL =
  "https://kdixpdxmdfdbxpbuljfe.supabase.co";

const KEY =
  "sb_publishable_khd42rEJpa3-1uyVb01Jjg_7rBp-FT8";

const HEADERS = {
  "apikey":KEY,
  "Authorization":"Bearer "+KEY
};


/*
=========================================
JEZIKI
=========================================
*/

const LANGUAGES = {

  sl:{
    name:"🇸🇮 Slovenščina",
    tts:"sl-SI"
  },

  hu:{
    name:"🇭🇺 Magyar",
    tts:"hu-HU"
  },

  en:{
    name:"🇬🇧 English",
    tts:"en-US"
  },

  tl:{
    name:"🇵🇭 Filipino",
    tts:"fil-PH"
  },

  it:{
    name:"🇮🇹 Italiano",
    tts:"it-IT"
  },

  hr:{
    name:"🇭🇷 Hrvatski",
    tts:"hr-HR"
  },

  sq:{
    name:"🇦🇱 Shqip",
    tts:"sq-AL"
  },

  de:{
    name:"🇩🇪 Deutsch",
    tts:"de-DE"
  },

  es:{
    name:"🇪🇸 Español",
    tts:"es-ES"
  },

  ru:{
    name:"🇷🇺 Русский",
    tts:"ru-RU"
  },

  uk:{
    name:"🇺🇦 Українська",
    tts:"uk-UA"
  },

  bg:{
    name:"🇧🇬 Български",
    tts:"bg-BG"
  },

  pl:{
    name:"🇵🇱 Polski",
    tts:"pl-PL"
  },

  cs:{
    name:"🇨🇿 Čeština",
    tts:"cs-CZ"
  },

  sk:{
    name:"🇸🇰 Slovenčina",
    tts:"sk-SK"
  }

};


const $ =
  id =>
    document.getElementById(id);


/*
=========================================
DROPDOWN
=========================================
*/

Object.entries(
  LANGUAGES
)
.forEach(
  ([code,language]) => {

    $("langA").add(
      new Option(
        language.name,
        code
      )
    );


    $("langB").add(
      new Option(
        language.name,
        code
      )
    );

  }
);


$("langA").value =
  "sl";


$("langB").value =
  "en";


/*
=========================================
STATE
=========================================
*/

let turn =
  0;

let recorder =
  null;

let stream =
  null;

let chunks =
  [];

let busy =
  false;


/*
=========================================
PERSON
=========================================
*/

function personName(person){

  if(person === 0){

    return (
      $("nameA")
        .value
        .trim()
      ||
      "Oseba A"
    );

  }


  return (
    $("nameB")
      .value
      .trim()
    ||
    "Oseba B"
  );

}


function personLanguage(person){

  return person === 0
    ? $("langA").value
    : $("langB").value;

}


/*
=========================================
TTS - TIHI ODKLEP
=========================================
*/

function unlockVoiceInBackground(){

  const code =
    personLanguage(
      turn
    );


  speechSynthesis.cancel();


  const utterance =
    new SpeechSynthesisUtterance(
      " "
    );


  utterance.lang =
    LANGUAGES[
      code
    ].tts;


  utterance.volume =
    0.01;


  utterance.rate =
    1;


  speechSynthesis.speak(
    utterance
  );


  setTimeout(
    () =>
      speechSynthesis.resume(),
    80
  );

}


/*
=========================================
START
=========================================
*/

function showTalk(){

  $("setup")
    .classList
    .add("hidden");


  $("talk")
    .classList
    .remove("hidden");


  turn =
    0;


  /*
  ZAČNI POGOVOR je uporabniški tap.
  Poskusimo TTS odkleniti v ozadju.
  */

  unlockVoiceInBackground();


  render();

}


/*
=========================================
RENDER
=========================================
*/

function render(){

  const nameA =
    personName(0);


  const nameB =
    personName(1);


  $("pillA").textContent =
    nameA;


  $("pillB").textContent =
    nameB;


  $("speaker").textContent =
    turn === 0
      ? nameA
      : nameB;


  $("pillA")
    .classList
    .toggle(
      "active",
      turn === 0
    );


  $("pillB")
    .classList
    .toggle(
      "active",
      turn === 1
    );


  const source =
    personLanguage(
      turn
    );


  const target =
    personLanguage(
      turn === 0
        ? 1
        : 0
    );


  $("direction").textContent =
    LANGUAGES[source].name +
    " → " +
    LANGUAGES[target].name;


  const nextPerson =
    turn === 0
      ? nameB
      : nameA;


  $("next").textContent =
    "NAPREJ → " +
    nextPerson;


  $("recordState").innerHTML =
    '<span class="dot"></span>' +
    "Snemanje poteka";


  startRecording();

}


/*
=========================================
START RECORDING
=========================================
*/

async function startRecording(){

  if(busy){
    return;
  }


  if(
    recorder &&
    recorder.state ===
      "recording"
  ){

    return;
  }


  try{

    stream =
      await navigator
        .mediaDevices
        .getUserMedia({
          audio:true
        });


    chunks =
      [];


    let options =
      {};


    if(
      MediaRecorder
        .isTypeSupported(
          "audio/mp4"
        )
    ){

      options = {
        mimeType:
          "audio/mp4"
      };

    }
    else if(
      MediaRecorder
        .isTypeSupported(
          "audio/webm"
        )
    ){

      options = {
        mimeType:
          "audio/webm"
      };

    }


    recorder =
      new MediaRecorder(
        stream,
        options
      );


    recorder.ondataavailable =
      event => {

        if(
          event.data &&
          event.data.size
        ){

          chunks.push(
            event.data
          );

        }

      };


    recorder.start();


    $("mic")
      .classList
      .add(
        "recording"
      );


    $("mic").textContent =
      "■";


    $("recordState").innerHTML =
      '<span class="dot"></span>' +
      "Snemanje poteka";


    $("notice").textContent =
      "";

  }
  catch(error){

    $("notice").textContent =
      "Napaka mikrofona: " +
      error.message;

  }

}


/*
=========================================
STOP RECORDING
=========================================
*/

function stopRecording(){

  return new Promise(
    resolve => {

      if(
        !recorder ||
        recorder.state !==
          "recording"
      ){

        resolve();

        return;

      }


      recorder.onstop =
        () => {

          resolve();

        };


      recorder.stop();


      if(stream){

        stream
          .getTracks()
          .forEach(
            track =>
              track.stop()
          );

      }


      $("mic")
        .classList
        .remove(
          "recording"
        );


      $("mic").textContent =
        "🎤";


      $("recordState")
        .textContent =
          "Prepoznavam govor ...";

    }
  );

}


/*
=========================================
TRANSLATE
=========================================
*/

async function translate(){

  const source =
    personLanguage(
      turn
    );


  const target =
    personLanguage(
      turn === 0
        ? 1
        : 0
    );


  const mime =
    recorder?.mimeType ||
    "audio/webm";


  const extension =
    mime.includes("mp4")
      ? "m4a"
      : "webm";


  const blob =
    new Blob(
      chunks,
      {
        type:mime
      }
    );


  if(
    blob.size < 500
  ){

    throw new Error(
      "Posnetek je prekratek."
    );

  }


  const file =
    new File(
      [blob],
      "voice." +
      extension,
      {
        type:mime
      }
    );


  const form =
    new FormData();


  form.append(
    "audio",
    file
  );


  form.append(
    "language",
    source
  );


  form.append(
    "target_language",
    target
  );


  const response =
    await fetch(

      URL +
      "/functions/v1/" +
      "voice-transcribe",

      {

        method:"POST",

        headers:
          HEADERS,

        body:
          form

      }

    );


  const raw =
    await response.text();


  let data;


  try{

    data =
      JSON.parse(
        raw
      );

  }
  catch{

    throw new Error(
      "Neveljaven odgovor prevajalnika."
    );

  }


  if(
    !response.ok
  ){

    throw new Error(
      data.detail ||
      data.error ||
      raw
    );

  }


  return data;

}


/*
=========================================
TTS VOICE
=========================================
*/

function findVoice(languageCode){

  const voices =
    speechSynthesis
      .getVoices();


  const target =
    LANGUAGES[
      languageCode
    ].tts
      .toLowerCase();


  const base =
    target
      .split("-")[0];


  return (

    voices.find(
      voice =>
        voice.lang
          .toLowerCase() ===
        target
    )

    ||

    voices.find(
      voice =>
        voice.lang
          .toLowerCase()
          .startsWith(base)
    )

    ||

    null

  );

}


/*
=========================================
SPEAK
=========================================
*/

function speak(
  text,
  languageCode
){

  return new Promise(
    resolve => {

      if(!text){

        resolve(false);

        return;

      }


      speechSynthesis.cancel();


      const utterance =
        new SpeechSynthesisUtterance(
          text
        );


      utterance.lang =
        LANGUAGES[
          languageCode
        ].tts;


      const voice =
        findVoice(
          languageCode
        );


      if(voice){

        utterance.voice =
          voice;

      }


      utterance.rate =
        0.92;


      utterance.pitch =
        1;


      utterance.volume =
        1;


      let finished =
        false;


      const timeout =
        setTimeout(
          () => {

            finish(
              false
            );

          },

          Math.max(
            7000,
            text.length * 170
          )

        );


      function finish(
        success
      ){

        if(finished){
          return;
        }


        finished =
          true;


        clearTimeout(
          timeout
        );


        resolve(
          success
        );

      }


      utterance.onend =
        () =>
          finish(true);


      utterance.onerror =
        () =>
          finish(false);


      speechSynthesis
        .speak(
          utterance
        );


      setTimeout(
        () =>
          speechSynthesis
            .resume(),
        100
      );

    }
  );

}


/*
=========================================
NAPREJ
=========================================
*/

async function nextTurn(){

  if(busy){
    return;
  }


  busy =
    true;


  $("next").disabled =
    true;


  $("notice").textContent =
    "Prepoznavam in prevajam ...";


  try{

    /*
    ZAPOMNIMO si, kdo je govoril.
    */

    const spokenTurn =
      turn;


    await stopRecording();


    const data =
      await translate();


    $("original").textContent =
      data.text ||
      "";


    $("translated").textContent =
      data.translated ||
      "";


    $("result")
      .classList
      .remove(
        "hidden"
      );


    const targetLanguage =
      spokenTurn === 0
        ? $("langB").value
        : $("langA").value;


    $("notice").textContent =
      "Predvajam prevod ...";


    await speak(
      data.translated,
      targetLanguage
    );


    /*
    ZAMENJAJ GOVORCA
    */

    turn =
      spokenTurn === 0
        ? 1
        : 0;


    /*
    KLJUČNO:
    busy sprostimo PRED render(),
    da se za drugo osebo zažene
    POPOLNOMA NOV POSNETEK.
    */

    busy =
      false;


    $("notice").textContent =
      "";


    render();

  }
  catch(error){

    $("notice").textContent =
      "Napaka: " +
      error.message;


    busy =
      false;


    await startRecording();

  }
  finally{

    busy =
      false;


    $("next").disabled =
      false;

  }

}


/*
=========================================
SETTINGS
=========================================
*/

async function openSettings(){

  await stopRecording();


  speechSynthesis.cancel();


  $("talk")
    .classList
    .add(
      "hidden"
    );


  $("setup")
    .classList
    .remove(
      "hidden"
    );

}


/*
=========================================
END
=========================================
*/

async function endConversation(){

  await stopRecording();


  speechSynthesis.cancel();


  $("talk")
    .classList
    .add(
      "hidden"
    );


  $("setup")
    .classList
    .remove(
      "hidden"
    );


  $("result")
    .classList
    .add(
      "hidden"
    );


  turn =
    0;

}


/*
=========================================
EVENTS
=========================================
*/

$("start").onclick =
  showTalk;


$("next").onclick =
  nextTurn;


$("settings").onclick =
  openSettings;


$("end").onclick =
  endConversation;


/*
Ročni klik na mikrofon:
STOP / START.
*/

$("mic").onclick =
  async () => {

    if(
      recorder &&
      recorder.state ===
        "recording"
    ){

      await stopRecording();

    }
    else{

      await startRecording();

    }

  };


/*
=========================================
SAVE SETTINGS
=========================================
*/

$("start").addEventListener(
  "click",
  () => {

    localStorage.setItem(
      "phone4NameA",
      personName(0)
    );


    localStorage.setItem(
      "phone4NameB",
      personName(1)
    );


    localStorage.setItem(
      "phone4LangA",
      personLanguage(0)
    );


    localStorage.setItem(
      "phone4LangB",
      personLanguage(1)
    );

  }
);


/*
=========================================
RESTORE SETTINGS
=========================================
*/

const savedA =
  localStorage.getItem(
    "phone4NameA"
  );


const savedB =
  localStorage.getItem(
    "phone4NameB"
  );


const savedLangA =
  localStorage.getItem(
    "phone4LangA"
  );


const savedLangB =
  localStorage.getItem(
    "phone4LangB"
  );


if(savedA){

  $("nameA").value =
    savedA;

}


if(savedB){

  $("nameB").value =
    savedB;

}


if(
  savedLangA &&
  LANGUAGES[
    savedLangA
  ]
){

  $("langA").value =
    savedLangA;

}


if(
  savedLangB &&
  LANGUAGES[
    savedLangB
  ]
){

  $("langB").value =
    savedLangB;

}


/*
=========================================
CLEANUP
=========================================
*/

window.addEventListener(
  "beforeunload",
  () => {

    speechSynthesis.cancel();


    if(stream){

      stream
        .getTracks()
        .forEach(
          track =>
            track.stop()
        );

    }

  }
);

</script>
