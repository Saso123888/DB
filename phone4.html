   IZBIRA AI
========================= */

.aiBox{
  padding:15px;
}

.aiTitle{
  margin-bottom:11px;

  text-align:center;

  color:#aebbd0;

  font-size:12px;
  font-weight:900;
}

.aiChoices{
  display:grid;
  grid-template-columns:1fr 1fr;

}

.aiButton{

  border-radius:15px;

  background:#0b1c34;
  color:#b7c4d7;

  font-size:15px;

}

.aiButton.selected.gemini{
  border-color:#9b63ff;

  background:
    linear-gradient(
      90deg,
      #6e45c9,
      #a34ee8

  color:#fff;

  box-shadow:0 8px 24px #874bd044;
}

.aiButton.selected.groq{
  border-color:#ff9f38;

  background:
    linear-gradient(
      90deg,
      #d66b15,
      #ef9835
    );

  color:#fff;

  box-shadow:0 8px 24px #e7812444;
}


/* =========================
   ZAČNI
========================= */

.start{
  width:100%;
  height:68px;

  border:0;
  border-radius:18px;

  background:
    linear-gradient(
      90deg,
      #087df1,
      #079efe
    );

  color:#fff;
  font-size:19px;
  font-weight:900;

  box-shadow:0 12px 30px #087df155;
}


/* =========================
   HEADER
========================= */

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;

  margin-bottom:24px;
}

.top img{
  width:44px;
  height:44px;
  border-radius:13px;
}

.gear{
  border:0;
  background:transparent;

  color:#b7c6da;

  font-size:25px;
}


/* =========================
   GUMBA
========================= */

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;

  gap:12px;

  margin-bottom:17px;
}

.next,
.end{
  height:56px;

  border-radius:27px;

  font-size:15px;
  font-weight:900;
}

.next{
  border:0;
}

.next.a{
  background:
    linear-gradient(
      90deg,
      #078eff,
      #0a7bee
    );

  color:#fff;
}

.next.b{
  background:
    linear-gradient(
      90deg,
      #18dfbd,

}

.next:disabled{
  opacity:.45;
}

.end{
  border:1px solid #a63b4b;

  background:
    linear-gradient(
      90deg,
      #d62943,
      #a71730
    );

  color:#fff;
}


/* =========================
   AI STATUS
========================= */

.engineStatus{
  width:max-content;

  max-width:100%;

  margin:0 auto 13px;
  padding:7px 12px;

  border:1px solid #36557d;
  border-radius:16px;

  background:#0b1c34;
  color:#afbdd1;

  font-size:11px;
  font-weight:900;
}

.engineStatus.gemini{
  border-color:#8651d1;
  color:#d6b6ff;
}

.engineStatus.groq{
  border-color:#c96f28;
  color:#ffc282;
}


/* =========================
   SMER
========================= */

.direction{
  text-align:center;

  color:#d4dbea;

  font-size:14px;
}


/* =========================
   GOVOREC
========================= */

.speaker{
  margin:19px 0 0;

  text-align:center;

  font-size:36px;

  font-weight:900;
}

.speakLabel{
  text-align:center;

  color:#bfcae0;

  font-size:20px;

  font-weight:900;
}


/* =========================
   MIKROFON
========================= */

.pulse{
  position:relative;

  display:grid;
  place-items:center;

  width:205px;
  height:205px;

  margin:14px auto 16px;
}

.ring{
  position:absolute;

  border:2px solid #087fff66;

  border-radius:50%;

  animation:ringPulse 1.6s infinite;
}

.r1{
  inset:0;
}

.r2{
  inset:20px;
  animation-delay:.25s;
}

.r3{
  inset:39px;
  animation-delay:.5s;
}

.pulse.b .ring{
  border-color:#13dfc566;
}

@keyframes ringPulse{

  0%{
    transform:scale(.82);
    opacity:.95;
  }

  70%{
    transform:scale(1.05);
    opacity:.12;
  }

  100%{
    transform:scale(1.05);
    opacity:0;
  }

}

.mic{
  position:relative;

  z-index:2;

  width:128px;
  height:128px;

  border:0;
  border-radius:50%;

  font-size:57px;

  animation:
    micBeat
    1.1s
    ease-in-out
    infinite;
}

.mic.a{
  color:#fff;

  background:
    radial-gradient(
      circle at 35% 25%,
      #43c8ff,
      #0784ff 50%,
      #0b58c4
    );

  box-shadow:
    0 0 22px #078cff,
    0 0 55px #078cff99;
}

.mic.b{
  color:#032d29;

  background:
    radial-gradient(
      circle at 35% 25%,
      #5cf3de,
      #13d7b9 50%,
      #078a78
    );

  box-shadow:
    0 0 22px #13dfc5,
    0 0 55px #13dfc599;
}

@keyframes micBeat{

  0%,100%{
    transform:scale(1);
  }

  50%{
    transform:scale(1.09);
  }

}


/* =========================
   PREVOD
========================= */

.result{

  padding:15px;

.resultTitle{

  font-size:12px;
}

.notice{
  min-height:22px;

  text-align:center;

  color:#ffd36b;

  font-size:13px;

<script>

/* =========================
   SUPABASE
========================= */

const URL =
  "https://kdixpdxmdfdbxpbuljfe.supabase.co";


const KEY =
  "sb_publishable_khd42rEJpa3-1uyVb01Jjg_7rBp-FT8";


const HEADERS = {

  apikey:
    KEY,

  Authorization:
    "Bearer " + KEY

};


/* =========================
   JEZIKI
========================= */

const LANGUAGES = {

  sl:{
    name:"🇸🇮 Slovenščina",
    tts:"sl-SI"
  },

  hu:{
    name:"🇭🇺 Magyar",
    tts:"hu-HU"
  },

  en:{
    name:"🇬🇧 English",
    tts:"en-US"
  },

  tl:{
    name:"🇵🇭 Filipino",
    tts:"fil-PH"
  },

  it:{
    name:"🇮🇹 Italiano",
    tts:"it-IT"
  },

  hr:{
    name:"🇭🇷 Hrvatski",
    tts:"hr-HR"
  },

  sq:{
    name:"🇦🇱 Shqip",
    tts:"sq-AL"
  },

  de:{
    name:"🇩🇪 Deutsch",
    tts:"de-DE"
  },

  es:{
    name:"🇪🇸 Español",
    tts:"es-ES"
  },

  ru:{
    name:"🇷🇺 Русский",
    tts:"ru-RU"
  },

  uk:{
    name:"🇺🇦 Українська",
    tts:"uk-UA"
  },

  bg:{
    name:"🇧🇬 Български",
    tts:"bg-BG"
  },

  pl:{
    name:"🇵🇱 Polski",
    tts:"pl-PL"
  },

  cs:{
    name:"🇨🇿 Čeština",
    tts:"cs-CZ"
  },

  sk:{
    name:"🇸🇰 Slovenčina",
    tts:"sk-SK"
  }

};


const $ =
  id =>
    document.getElementById(
      id
    );


/* =========================
   DROPDOWNI
========================= */

Object.entries(
  LANGUAGES
)
.forEach(
  ([code,language]) => {

    $("langA").add(
      new Option(
        language.name,
        code
      )
    );


    $("langB").add(
      new Option(
        language.name,
        code
      )
    );

  }
);


$("langA").value =
  "sl";


$("langB").value =
  "en";


/* =========================
   STATE
========================= */

let turn =
  0;


let recorder =
  null;


let mediaStream =
  null;


let audioChunks =
  [];


let busy =
  false;


let recordingId =
  0;


let activeRecordingId =
  0;


let processingId =
  0;


let lastPlayedId =
  0;


let sessionId =
  0;


let inactivityTimer =
  null;


/*
Privzeto je Gemini.
Telefon si zadnjo izbiro zapomni.
*/

let selectedAI =
  localStorage.getItem(
    "phone4AI"
  )
  ||
  "gemini";


/* =========================
   OSEBI
========================= */

function personName(
  person
){

  if(
    person === 0
  ){

    return (
      $("nameA")
        .value
        .trim()
      ||
      "Oseba A"
    );

  }


  return (
    $("nameB")
      .value
      .trim()
    ||
    "Oseba B"
  );

}


function personLanguage(
  person
){

  return (
    person === 0
      ? $("langA").value
      : $("langB").value
  );

}


/* =========================
   IZBIRA AI
========================= */

function chooseAI(
  ai
){

  selectedAI =
    ai;


  localStorage.setItem(
    "phone4AI",
    selectedAI
  );


  renderAISelection();

}


function renderAISelection(){

  $("aiGemini")
    .classList
    .toggle(
      "selected",
      selectedAI ===
        "gemini"
    );


  $("aiGroq")
    .classList
    .toggle(
      "selected",
      selectedAI ===
        "groq"
    );


  if(
    selectedAI ===
    "gemini"
  ){

    $("engineStatus").textContent =
      "✦ GEMINI AI";


    $("engineStatus").className =
      "engineStatus gemini";

  }
  else{

    $("engineStatus").textContent =
      "⚡ GROQ AI";


    $("engineStatus").className =
      "engineStatus groq";

  }

}


/* =========================
   NEAKTIVNOST
========================= */

function markActivity(){

  if(
    inactivityTimer
  ){

    clearTimeout(
      inactivityTimer
    );

  }


  inactivityTimer =
    setTimeout(
      () => {

        if(
          !$("talk")
            .classList
            .contains(
              "hidden"
            )
        ){

          clearConversation();

        }

      },

      120000

    );

}


/* =========================
   RENDER
========================= */

function render(){

  const source =
    personLanguage(
      turn
    );


  const target =
    personLanguage(
      turn === 0
        ? 1
        : 0
    );


  const listener =
    personName(
      turn === 0
        ? 1
        : 0
    );


  $("speaker").textContent =
    personName(
      turn
    );


  $("direction").textContent =
    LANGUAGES[source].name +
    " → " +
    LANGUAGES[target].name;


  $("next").textContent =
    "NAPREJ → " +
    listener;


  $("next").className =
    "next " +
    (
      turn === 0
        ? "a"
        : "b"
    );


  $("mic").className =
    "mic " +
    (
      turn === 0
        ? "a"
        : "b"
    );


  $("pulse").className =
    "pulse " +
    (
      turn === 0
        ? "a"
        : "b"
    );


  renderAISelection();


  startRecording();

}


/* =========================
   TTS ODKLEP
========================= */

function unlockTTS(){

  try{

    speechSynthesis.cancel();


    const utterance =
      new SpeechSynthesisUtterance(
        " "
      );


    utterance.lang =
      LANGUAGES[
        personLanguage(0)
      ].tts;


    utterance.volume =
      0.01;


    speechSynthesis.speak(
      utterance
    );


    setTimeout(
      () =>
        speechSynthesis
          .resume(),
      80
    );

  }
  catch(error){

    console.log(
      "TTS unlock:",
      error
    );

  }

}


/* =========================
   START
========================= */

function startConversation(){

  sessionId++;


  processingId =
    0;


  lastPlayedId =
    0;


  activeRecordingId =
    0;


  turn =
    0;


  $("setup")
    .classList
    .add(
      "hidden"
    );


  $("talk")
    .classList
    .remove(
      "hidden"
    );


  unlockTTS();


  markActivity();


  render();

}


/* =========================
   START RECORDING
========================= */

async function startRecording(){

  if(
    busy
  ){

    return;

  }


  if(
    recorder &&
    recorder.state ===
      "recording"
  ){

    return;

  }


  const mySession =
    sessionId;


  const myRecordingId =
    ++recordingId;


  activeRecordingId =
    myRecordingId;


  /*
  Popolno čiščenje
  prejšnjega recorderja.
  */

  if(
    mediaStream
  ){

    mediaStream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );

  }


  mediaStream =
    null;


  recorder =
    null;


  audioChunks =
    [];


  try{

    const newStream =
      await navigator
        .mediaDevices
        .getUserMedia({
          audio:true
        });


    if(
      mySession !==
        sessionId
      ||
      myRecordingId !==
        activeRecordingId
    ){

      newStream
        .getTracks()
        .forEach(
          track =>
            track.stop()
        );


      return;

    }


    mediaStream =
      newStream;


    let options =
      {};


    if(
      MediaRecorder
        .isTypeSupported(
          "audio/mp4"
        )
    ){

      options = {
        mimeType:
          "audio/mp4"
      };

    }
    else if(
      MediaRecorder
        .isTypeSupported(
          "audio/webm"
        )
    ){

      options = {
        mimeType:
          "audio/webm"
      };

    }


    const newRecorder =
      new MediaRecorder(
        mediaStream,
        options
      );


    recorder =
      newRecorder;


    const localChunks =
      [];


    newRecorder.ondataavailable =
      event => {

        if(
          event.data.size
          &&
          mySession ===
            sessionId
          &&
          myRecordingId ===
            activeRecordingId
          &&
          recorder ===
            newRecorder
        ){

          localChunks.push(
            event.data
          );

        }

      };


    newRecorder.start();


    audioChunks =
      localChunks;


    $("notice").textContent =
      "";

  }
  catch(error){

    if(
      mySession ===
        sessionId
    ){

      $("notice").textContent =
        "Napaka mikrofona: " +
        error.message;

    }

  }

}


/* =========================
   STOP RECORDING
========================= */

function stopRecording(

  expectedRecordingId =
    activeRecordingId,

  expectedSession =
    sessionId

){

  return new Promise(
    resolve => {


      const activeRecorder =
        recorder;


      const activeStream =
        mediaStream;


      if(
        !activeRecorder
        ||
        activeRecorder.state !==
          "recording"
        ||
        expectedSession !==
          sessionId
        ||
        expectedRecordingId !==
          activeRecordingId
      ){

        activeStream
          ?.getTracks()
          .forEach(
            track =>
              track.stop()
          );


        resolve();


        return;

      }


      activeRecorder.onstop =
        () => {

          resolve();

        };


      activeRecorder.stop();


      activeStream
        ?.getTracks()
        .forEach(
          track =>
            track.stop()
        );


    }
  );

}


/* =========================
   PREVOD
========================= */

async function translateAudio(

  frozenChunks,

  frozenRecorder,

  sourceLanguage,

  targetLanguage

){

  const mime =
    frozenRecorder
      ?.mimeType
    ||
    "audio/webm";


  const extension =
    mime.includes(
      "mp4"
    )
      ? "m4a"
      : "webm";


  const blob =
    new Blob(
      frozenChunks,
      {
        type:mime
      }
    );


  if(
    blob.size <
    500
  ){

    throw new Error(
      "Posnetek je prekratek."
    );

  }


  const file =
    new File(
      [blob],
      "voice." +
      extension,
      {
        type:mime
      }
    );


  const form =
    new FormData();


  form.append(
    "audio",
    file
  );


  form.append(
    "language",
    sourceLanguage
  );


  form.append(
    "target_language",
    targetLanguage
  );


  /*
  Glede na izbiro uporabimo
  pravo Supabase Edge Function.
  */

  const endpoint =
    selectedAI ===
      "gemini"
      ? "voice-transcribe-gemini"
      : "voice-transcribe";


  const response =
    await fetch(

      URL +
      "/functions/v1/" +
      endpoint,

      {

        method:
          "POST",

        headers:
          HEADERS,

        body:
          form

      }

    );


  const raw =
    await response.text();


  let data;


  try{

    data =
      JSON.parse(
        raw
      );

  }
  catch{

    throw new Error(
      "Neveljaven odgovor AI."
    );

  }


  if(
    !response.ok
  ){

    throw new Error(
      data.detail ||
      data.error ||
      raw
    );

  }


  if(
    !data.text
    ||
    !data.translated
  ){

    throw new Error(
      "AI ni zaznal zanesljivega govora."
    );

  }


  return data;

}


/* =========================
   HALUCINATION FILTER
========================= */

function isLikelyHallucination(
  text
){

  const normalized =
    String(
      text ||
      ""
    )
    .toLowerCase()
    .replace(
      /[.!?,;:\-–—"'()]/g,
      " "
    )
    .replace(
      /\s+/g,
      " "
    )
    .trim();


  const blocked = [

    "thanks for watching",

    "thank you for watching",

    "thank you for listening",

    "please subscribe",

    "subscribe to our channel",

    "subtitles by",

    "hvala za ogled",

    "hvala ker ste gledali",

    "hvala ker poslušate",

    "hvala ker poslušate naš kanal",

    "hvala za poslušanje",

    "vala što ste gledali",

    "danke fürs zuschauen",

    "gracias por ver"

  ];


  return blocked.some(
    phrase =>

      normalized ===
        phrase

      ||

      normalized.startsWith(
        phrase + " "
      )

  );

}


/* =========================
   TTS VOICE
========================= */

function findVoice(
  languageCode
){

  const target =
    LANGUAGES[
      languageCode
    ].tts
      .toLowerCase();


  const base =
    target
      .split("-")[0];


  const voices =
    speechSynthesis
      .getVoices();


  return (

    voices.find(
      voice =>
        voice.lang
          .toLowerCase() ===
        target
    )

    ||

    voices.find(
      voice =>
        voice.lang
          .toLowerCase()
          .startsWith(base)
    )

    ||

    null

  );

}


/* =========================
   TTS SAMO ENKRAT
========================= */

function speakOnce(

  text,

  languageCode,

  playId,

  playSession

){

  return new Promise(
    resolve => {


      if(
        !text
        ||
        playSession !==
          sessionId
        ||
        playId !==
          processingId
        ||
        lastPlayedId ===
          playId
      ){

        resolve(
          false
        );


        return;

      }


      /*
      Takoj označimo,
      da tega prevoda ne smemo
      ponovno predvajati.
      */

      lastPlayedId =
        playId;


      speechSynthesis.cancel();


      const utterance =
        new SpeechSynthesisUtterance(
          text
        );


      utterance.lang =
        LANGUAGES[
          languageCode
        ].tts;


      const voice =
        findVoice(
          languageCode
        );


      if(
        voice
      ){

        utterance.voice =
          voice;

      }


      utterance.rate =
        0.92;


      utterance.pitch =
        1;


      utterance.volume =
        1;


      let finished =
        false;


      const timeout =
        setTimeout(
          () => {

            finish(
              false
            );

          },

          Math.max(
            7000,
            text.length *
            170
          )

        );


      function finish(
        success
      ){

        if(
          finished
        ){

          return;

        }


        finished =
          true;


        clearTimeout(
          timeout
        );


        if(
          playSession !==
            sessionId
          ||
          playId !==
            processingId
        ){

          resolve(
            false
          );


          return;

        }


        resolve(
          success
        );

      }


      utterance.onend =
        () =>
          finish(
            true
          );


      utterance.onerror =
        () =>
          finish(
            false
          );


      speechSynthesis.speak(
        utterance
      );


      setTimeout(
        () =>
          speechSynthesis.resume(),
        100
      );


    }
  );

}


/* =========================
   NAPREJ
========================= */

async function nextTurn(

  requestedRecordingId =
    activeRecordingId,

  requestedSession =
    sessionId

){

  markActivity();


  if(
    busy
  ){

    return;

  }


  if(
    requestedSession !==
      sessionId
    ||
    requestedRecordingId !==
      activeRecordingId
  ){

    return;

  }


  busy =
    true;


  $("next").disabled =
    true;


  const spokenTurn =
    turn;


  const sourceLanguage =
    personLanguage(
      spokenTurn
    );


  const targetLanguage =
    personLanguage(
      spokenTurn === 0
        ? 1
        : 0
    );


  const myProcessingId =
    ++processingId;


  const frozenRecorder =
    recorder;


  try{

    await stopRecording(
      requestedRecordingId,
      requestedSession
    );


    /*
    Počakaj, da MediaRecorder
    doda zadnji audio chunk.
    */

    await new Promise(
      resolve =>
        setTimeout(
          resolve,
          100
        )
    );


    const frozenChunks =
      audioChunks.slice();


    if(
      requestedSession !==
        sessionId
      ||
      myProcessingId !==
        processingId
    ){

      return;

    }


    $("notice").textContent =

      selectedAI ===
        "gemini"

        ? "Gemini prepoznava in prevaja ..."

        : "Groq prepoznava in prevaja ...";


    const data =
      await translateAudio(

        frozenChunks,

        frozenRecorder,

        sourceLanguage,

        targetLanguage

      );


    if(
      requestedSession !==
        sessionId
      ||
      myProcessingId !==
        processingId
    ){

      return;

    }


    if(
      isLikelyHallucination(
        data.text
      )
    ){

      throw new Error(
        "Nezanesljiv prepis. Poved ponovi bolj jasno."
      );

    }


    $("original").textContent =
      data.text;


    $("translated").textContent =
      data.translated;


    $("result")
      .classList
      .remove(
        "hidden"
      );


    $("notice").textContent =
      "Predvajam prevod ...";


    await speakOnce(

      data.translated,

      targetLanguage,

      myProcessingId,

      requestedSession

    );


    if(
      requestedSession !==
        sessionId
      ||
      myProcessingId !==
        processingId
    ){

      return;

    }


    turn =
      spokenTurn === 0
        ? 1
        : 0;


    /*
    Stari posnetek
    dokončno odstranimo.
    */

    audioChunks =
      [];


    recorder =
      null;


    mediaStream =
      null;


    busy =
      false;


    $("notice").textContent =
      "";


    render();

  }
  catch(error){

    if(
      requestedSession ===
        sessionId
      &&
      myProcessingId ===
        processingId
    ){

      $("notice").textContent =
        "Napaka: " +
        error.message;


      audioChunks =
        [];


      recorder =
        null;


      mediaStream =
        null;


      busy =
        false;


      /*
      Ista oseba ponovno posname
      poved z novim recorderjem.
      */

      await startRecording();

    }

  }
  finally{

    if(
      requestedSession ===
        sessionId
    ){

      busy =
        false;


      $("next").disabled =
        false;

    }

  }

}


/* =========================
   POPOLN RESET
========================= */

async function clearConversation(){

  sessionId++;


  processingId++;


  activeRecordingId =
    ++recordingId;


  lastPlayedId =
    0;


  if(
    inactivityTimer
  ){

    clearTimeout(
      inactivityTimer
    );

  }


  inactivityTimer =
    null;


  speechSynthesis.cancel();


  const oldRecorder =
    recorder;


  const oldStream =
    mediaStream;


  if(
    oldRecorder &&
    oldRecorder.state ===
      "recording"
  ){

    oldRecorder.onstop =
      null;


    try{

      oldRecorder.stop();

    }
    catch(error){

      console.log(
        error
      );

    }

  }


  oldStream
    ?.getTracks()
    .forEach(
      track =>
        track.stop()
    );


  audioChunks =
    [];


  recorder =
    null;


  mediaStream =
    null;


  busy =
    false;


  turn =
    0;


  $("original").textContent =
    "";


  $("translated").textContent =
    "";


  $("result")
    .classList
    .add(
      "hidden"
    );


  $("notice").textContent =
    "";


  $("next").disabled =
    false;


  $("talk")
    .classList
    .add(
      "hidden"
    );


  $("setup")
    .classList
    .remove(
      "hidden"
    );

}
