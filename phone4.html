.pulse{

  display:grid;
  place-items:center;

  width:205px;
  height:205px;

  margin:14px auto 16px;
}

.ring{
  position:absolute;

  border:2px solid #087fff66;

  border-radius:50%;

  animation:ringPulse 1.6s infinite;
}

.r1{
  inset:0;
}

.r2{
  inset:20px;
  animation-delay:.25s;
}

.r3{
  inset:39px;
  animation-delay:.5s;
}

.pulse.b .ring{
  border-color:#13dfc566;
}

@keyframes ringPulse{

  0%{
    transform:scale(.82);
    opacity:.95;
  }

  70%{
    transform:scale(1.05);
    opacity:.12;
  }

  100%{
    transform:scale(1.05);

  }

}

  height:128px;

<script>

/* =========================

const LANGUAGES = {

const $ =

      id
    );


/* =========================
   DROPDOWNI
========================= */

Object.entries(
  LANGUAGES
)
.forEach(
  ([code,language]) => {

    $("langA").add(

      new Option(
        language.name,
        code
      )

    );


    $("langB").add(

      new Option(
        language.name,
        code
      )

    );

  }
);


$("langA").value =
  "sl";


$("langB").value =
  "en";


/* =========================
   STATE
========================= */

let turn =
  0;


let recorder =
  null;


let mediaStream =
  null;


let audioChunks =
  [];


let busy =
  false;


/*
Vsak posnetek dobi ID.
*/

let recordingId =
  0;


let activeRecordingId =
  0;


/*
Vsak prevod dobi ID.
*/

let processingId =
  0;


/*
Zadnji TTS, ki je že
bil predvajan.
*/

let lastPlayedId =
  0;


/*
Vsaka seja dobi ID.
Stari async rezultati

*/

let sessionId =
  0;


/*
2 minuti neaktivnosti.
*/

let inactivityTimer =
  null;


/* =========================
   OSEBI
========================= */

function personName(
  person
){

  if(
    person === 0
  ){

    return (
      $("nameA")
        .value
        .trim()
      ||
      "Oseba A"
    );

  }


  return (
    $("nameB")
      .value
      .trim()
    ||
    "Oseba B"
  );

}


function personLanguage(
  person
){

  return (
    person === 0
      ? $("langA").value
      : $("langB").value
  );

}


/* =========================
   NEAKTIVNOST
========================= */

function markActivity(){

  resetInactivityTimer();

}


function resetInactivityTimer(){

  if(
    inactivityTimer
  ){

    clearTimeout(
      inactivityTimer
    );

  }


  inactivityTimer =
    setTimeout(
      () => {

        if(
          !$("talk")
            .classList
            .contains(
              "hidden"
            )
        ){

          clearConversation();

        }

      },

      120000

    );

}


/* =========================
   RENDER
========================= */

function render(){

  const source =
    personLanguage(
      turn
    );


  const target =
    personLanguage(
      turn === 0
        ? 1
        : 0
    );


  const listener =
    personName(
      turn === 0
        ? 1
        : 0
    );


  $("speaker").textContent =
    personName(
      turn
    );


  $("direction").textContent =

  $("next").textContent =

  $("next").className =

    );


  $("mic").className =

/* =========================
   TTS ODKLEP
========================= */

function unlockTTS(){

  try{

    speechSynthesis.cancel();


    const utterance =
      new SpeechSynthesisUtterance(
        " "
      );


    utterance.lang =
      LANGUAGES[
        personLanguage(0)
      ].tts;


    utterance.volume =

    speechSynthesis.speak(

    );


    setTimeout(

        speechSynthesis
          .resume(),

    );

  }
  catch(error){

    console.log(
      "TTS unlock:",
      error
    );

  }

}


/* =========================
   START
========================= */

function startConversation(){

  sessionId++;


  processingId =
    0;


  lastPlayedId =
    0;


  activeRecordingId =
    0;


  turn =
    0;


  $("setup")
    .classList
    .add(
      "hidden"
    );


  $("talk")
    .classList
    .remove(
      "hidden"
    );


  /*
  Odklep TTS z uporabniškim
  pritiskom na ZAČNI POGOVOR.
  */

  unlockTTS();


  markActivity();


  render();

}


/* =========================
   START RECORDING
========================= */

async function startRecording(){

  if(
    busy
  ){

    return;

  }


  if(
    recorder &&
    recorder.state ===
      "recording"
  ){

    return;

  }


  const mySession =
    sessionId;


  const myRecordingId =
    ++recordingId;


  activeRecordingId =
    myRecordingId;


  /*
  Pred novim snemanjem
  vedno uničimo stari stream
  in stari buffer.
  */

  if(
    mediaStream
  ){

    mediaStream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );

  }


  mediaStream =
    null;


  recorder =
    null;


  audioChunks =
    [];


  try{

    const newStream =
      await navigator
        .mediaDevices
        .getUserMedia({
          audio:true
        });


    /*
    Med čakanjem se je morda
    seja že spremenila.
    */

    if(
      mySession !==
        sessionId
      ||
      myRecordingId !==
        activeRecordingId
    ){

      newStream
        .getTracks()
        .forEach(
          track =>
            track.stop()
        );


      return;

    }


    mediaStream =
      newStream;


    let options =
      {};


    if(
      MediaRecorder
        .isTypeSupported(
          "audio/mp4"
        )
    ){

      options = {
        mimeType:
          "audio/mp4"
      };

    }
    else if(
      MediaRecorder
        .isTypeSupported(
          "audio/webm"
        )
    ){

      options = {
        mimeType:
          "audio/webm"
      };

    }


    const newRecorder =
      new MediaRecorder(
        mediaStream,
        options
      );


    recorder =
      newRecorder;


    /*
    Lokalni buffer pripada samo
    temu posnetku.
    */

    const localChunks =
      [];


    newRecorder.ondataavailable =
      event => {

        if(
          event.data.size
          &&
          mySession ===
            sessionId
          &&
          myRecordingId ===
            activeRecordingId
          &&
          recorder ===
            newRecorder
        ){

          localChunks.push(
            event.data
          );

        }

      };


    newRecorder.start();


    audioChunks =
      localChunks;


    $("notice").textContent =
      "";


  }
  catch(error){

    if(
      mySession ===
        sessionId
    ){

      $("notice").textContent =
        "Napaka mikrofona: " +
        error.message;

    }

  }

}


/* =========================
   STOP RECORDING
========================= */

function stopRecording(

  expectedRecordingId =
    activeRecordingId,

  expectedSession =
    sessionId

){

  return new Promise(
    resolve => {


      const currentRecorder =
        recorder;


      const currentStream =
        mediaStream;


      if(
        !currentRecorder
        ||
        currentRecorder.state !==
          "recording"
        ||
        expectedSession !==
          sessionId
        ||
        expectedRecordingId !==
          activeRecordingId
      ){

        currentStream
          ?.getTracks()
          .forEach(
            track =>
              track.stop()
          );


        resolve();


        return;

      }


      currentRecorder.onstop =
        () => {

          resolve();

        };


      currentRecorder.stop();


      currentStream
        ?.getTracks()
        .forEach(
          track =>
            track.stop()
        );


    }
  );

}


/* =========================
   PREVOD
========================= */

async function translateAudio(

  frozenChunks,

  frozenRecorder,

  sourceLanguage,

  targetLanguage

){

  const mime =
    frozenRecorder
      ?.mimeType
    ||
    "audio/webm";


  const extension =
    mime.includes(
      "mp4"
    )
      ? "m4a"
      : "webm";


  const blob =
    new Blob(
      frozenChunks,
      {
        type:mime
      }
    );


  if(
    blob.size <
    500
  ){

    throw new Error(
      "Posnetek je prekratek."
    );

  }


  const file =
    new File(
      [blob],
      "voice." +
      extension,
      {
        type:mime
      }
    );


  const form =
    new FormData();


  form.append(
    "audio",
    file
  );


  form.append(
    "language",
    sourceLanguage
  );


  form.append(
    "target_language",
    targetLanguage
  );


  const response =
    await fetch(

      URL +
      "/functions/v1/" +
      "voice-transcribe",

      {

        method:
          "POST",

        headers:
          HEADERS,

        body:
          form

      }

    );


  const raw =
    await response.text();


  let data;


  try{

    data =
      JSON.parse(
        raw
      );

  }
  catch{

    throw new Error(
      "Neveljaven odgovor prevajalnika."
    );

  }


  if(
    !response.ok
  ){

    throw new Error(
      data.detail ||
      data.error ||
      raw
    );

  }


  return data;

}


/* =========================
   HALUCINATION FILTER
========================= */

function isLikelyHallucination(
  text
){

  const normalized =
    String(
      text ||
      ""
    )
    .toLowerCase()
    .replace(
      /[.!?,;:\-–—"'()]/g,
      " "
    )
    .replace(
      /\s+/g,
      " "
    )
    .trim();


  const blocked = [

    "thanks for watching",

    "thank you for watching",

    "thank you for listening",

    "please subscribe",

    "subscribe to our channel",

    "subtitles by",

    "hvala za ogled",

    "hvala ker ste gledali",

    "hvala ker poslušate",

    "hvala ker poslušate naš kanal",

    "hvala za poslušanje",

    "vala što ste gledali",

    "danke fürs zuschauen",

    "gracias por ver"

  ];


  return blocked.some(
    phrase =>

      normalized ===
        phrase

      ||

      normalized.startsWith(
        phrase + " "
      )

  );

}


/* =========================
   TTS VOICE
========================= */

function findVoice(
  languageCode
){

  const target =
    LANGUAGES[
      languageCode
    ].tts
      .toLowerCase();


  const base =
    target
      .split("-")[0];


  const voices =
    speechSynthesis
      .getVoices();


  return (

    voices.find(
      voice =>
        voice.lang
          .toLowerCase() ===
        target
    )

    ||

    voices.find(
      voice =>
        voice.lang
          .toLowerCase()
          .startsWith(base)
    )

    ||

    null

  );

}


/* =========================
   TTS SAMO ENKRAT
========================= */

function speakOnce(

  text,

  languageCode,

  playId,

  playSession

){

  return new Promise(
    resolve => {


      /*
      Neveljavna ali že
      predvajana zahteva.
      */

      if(
        !text
        ||
        playSession !==
          sessionId
        ||
        playId !==
          processingId
        ||
        lastPlayedId ===
          playId
      ){

        resolve(
          false
        );


        return;

      }


      /*
      Takoj označi kot predvajano.
      */

      lastPlayedId =
        playId;


      speechSynthesis.cancel();


      const utterance =
        new SpeechSynthesisUtterance(
          text
        );


      utterance.lang =
        LANGUAGES[
          languageCode
        ].tts;


      const voice =
        findVoice(
          languageCode
        );


      if(
        voice
      ){

        utterance.voice =
          voice;

      }


      utterance.rate =
        0.92;


      utterance.pitch =
        1;


      utterance.volume =
        1;


      let finished =
        false;


      const timeout =
        setTimeout(
          () => {

            finish(
              false
            );

          },

          Math.max(
            7000,
            text.length *
            170
          )

        );


      function finish(
        success
      ){

        if(
          finished
        ){

          return;

        }


        finished =
          true;


        clearTimeout(
          timeout
        );


        /*
        Staro predvajanje
        ne sme vplivati
        na novo sejo.
        */

        if(
          playSession !==
            sessionId
          ||
          playId !==
            processingId
        ){

          resolve(
            false
          );


          return;

        }


        resolve(
          success
        );

      }


      utterance.onend =
        () =>
          finish(
            true
          );


      utterance.onerror =
        () =>
          finish(
            false
          );


      speechSynthesis.speak(
        utterance
      );


      setTimeout(
        () =>
          speechSynthesis.resume(),
        100
      );


    }
  );

}


/* =========================
   NAPREJ
========================= */

async function nextTurn(

  requestedRecordingId =
    activeRecordingId,

  requestedSession =
    sessionId

){

  markActivity();


  /*
  Če že prevajamo,
  drugi klik ignoriramo.
  */

  if(
    busy
  ){

    return;

  }


  /*
  Star dogodek ne sme
  zaključiti novega snemanja.
  */

  if(
    requestedSession !==
      sessionId
    ||
    requestedRecordingId !==
      activeRecordingId
  ){

    return;

  }


  busy =
    true;


  $("next").disabled =
    true;


  const spokenTurn =
    turn;


  const sourceLanguage =
    personLanguage(
      spokenTurn
    );


  const targetLanguage =
    personLanguage(
      spokenTurn === 0
        ? 1
        : 0
    );


  /*
  Nova obdelava.
  */

  const myProcessingId =
    ++processingId;


  /*
  Zamrznemo trenutni buffer.
  */

  const frozenRecorder =
    recorder;


  try{


    /*
    Najprej ustavi recorder,
    da dobimo še zadnji
    audio chunk.
    */

    await stopRecording(
      requestedRecordingId,
      requestedSession
    );


    /*
    Daj brskalniku trenutek,
    da zaključi zadnji
    dataavailable dogodek.
    */

    await new Promise(
      resolve =>
        setTimeout(
          resolve,
          80
        )
    );


    /*
    Kopijo naredimo šele zdaj.
    */

    const frozenChunks =
      audioChunks.slice();


    /*
    Če je bila seja medtem
    končana, ne nadaljuj.
    */

    if(
      requestedSession !==
        sessionId
      ||
      myProcessingId !==
        processingId
    ){

      return;

    }


    $("notice").textContent =
      "Prepoznavam in prevajam ...";


    const data =
      await translateAudio(

        frozenChunks,

        frozenRecorder,

        sourceLanguage,

        targetLanguage

      );


    /*
    Pozni odgovor starega
    requesta ignoriramo.
    */

    if(
      requestedSession !==
        sessionId
      ||
      myProcessingId !==
        processingId
    ){

      return;

    }


    /*
    Zaščita pred tipičnimi
    Whisper halucinacijami.
    */

    if(
      isLikelyHallucination(
        data.text
      )
    ){

      throw new Error(
        "Nezanesljiv prepis. Poved ponovi bolj jasno."
      );

    }


    /*
    Prikaži samo rezultat
    te izmenjave.
    */

    $("original").textContent =
      data.text ||
      "";


    $("translated").textContent =
      data.translated ||
      "";


    $("result")
      .classList
      .remove(
        "hidden"
      );


    $("notice").textContent =
      "Predvajam prevod ...";


    /*
    Predvajaj prevod
    samo enkrat.
    */

    await speakOnce(

      data.translated,

      targetLanguage,

      myProcessingId,

      requestedSession

    );


    /*
    Še enkrat preveri,
    ali rezultat še velja.
    */

    if(
      requestedSession !==
        sessionId
      ||
      myProcessingId !==
        processingId
    ){

      return;

    }


    /*
    Zamenjaj govorca.
    */

    turn =
      spokenTurn === 0
        ? 1
        : 0;


    /*
    STARI POSNETEK
    dokončno odstrani.
    */

    audioChunks =
      [];


    recorder =
      null;


    mediaStream =
      null;


    busy =
      false;


    $("notice").textContent =
      "";


    /*
    Nova oseba dobi
    čisto nov recorder.
    */

    render();


  }
  catch(error){


    if(
      requestedSession ===
        sessionId
      &&
      myProcessingId ===
        processingId
    ){

      $("notice").textContent =
        "Napaka: " +
        error.message;


      /*
      Starega bufferja
      NIKOLI ne uporabi ponovno.
      */

      audioChunks =
        [];


      recorder =
        null;


      mediaStream =
        null;


      busy =
        false;


      /*
      Ista oseba
      ponovno posname poved.
      */

      await startRecording();

    }

  }
  finally{


    if(
      requestedSession ===
        sessionId
    ){

      busy =
        false;


      $("next").disabled =
        false;

    }

  }

}


/* =========================
   POPOLN RESET
========================= */

async function clearConversation(){

  /*
  Uniči veljavnost vseh
  async operacij.
  */

  sessionId++;


  processingId++;


  activeRecordingId =
    ++recordingId;


  lastPlayedId =
    0;


  if(
    inactivityTimer
  ){

    clearTimeout(
      inactivityTimer
    );

  }


  inactivityTimer =
    null;


  /*
  TTS takoj OFF.
  */

  speechSynthesis.cancel();


  /*
  Recorder OFF.
  */

  const oldRecorder =
    recorder;


  const oldStream =
    mediaStream;


  if(
    oldRecorder &&
    oldRecorder.state ===
      "recording"
  ){

    oldRecorder.onstop =
      null;


    try{

      oldRecorder.stop();

    }
    catch(error){

      console.log(
        error
      );

    }

  }


  oldStream
    ?.getTracks()
    .forEach(
      track =>
        track.stop()
    );


  /*
  Audio izbriši.
  */

  audioChunks =
    [];


  recorder =
    null;


  mediaStream =
    null;


  /*
  Besedilo izbriši.
  */

  $("original").textContent =
    "";


  $("translated").textContent =
    "";


  $("result")
    .classList
    .add(
      "hidden"
    );


  $("notice").textContent =
    "";


  /*
  State reset.
  */

  busy =
    false;


  turn =
    0;


  $("next").disabled =
    false;


  /*
  Nazaj na setup.
  */

  $("talk")
    .classList
    .add(
      "hidden"
    );


  $("setup")
    .classList
    .remove(
      "hidden"
    );

}


/* =========================
   EVENTS
========================= */

$("start").onclick =
  () => {


    localStorage.setItem(
      "phone4NameA",
      personName(0)
    );


    localStorage.setItem(
      "phone4NameB",
      personName(1)
    );


    localStorage.setItem(
      "phone4LangA",
      personLanguage(0)
    );


    localStorage.setItem(
      "phone4LangB",
      personLanguage(1)
    );


    startConversation();

  };


$("next").onclick =
  () => {

    nextTurn(
      activeRecordingId,
      sessionId
    );

  };


/*
Tudi klik mikrofona
štejemo kot ročni NAPREJ.
*/

$("mic").onclick =
  () => {

    nextTurn(
      activeRecordingId,
      sessionId
    );

  };


$("end").onclick =
  clearConversation;


$("settings").onclick =
  clearConversation;


/* =========================
   OBNOVI NASTAVITVE
========================= */

const savedNameA =
  localStorage.getItem(
    "phone4NameA"
  );


const savedNameB =
  localStorage.getItem(
    "phone4NameB"
  );


const savedLangA =
  localStorage.getItem(
    "phone4LangA"
  );


const savedLangB =
  localStorage.getItem(
    "phone4LangB"
  );


if(
  savedNameA
){

  $("nameA").value =
    savedNameA;

}


if(
  savedNameB
){

  $("nameB").value =
    savedNameB;

}


if(
  savedLangA &&
  LANGUAGES[
    savedLangA
  ]
){

  $("langA").value =
    savedLangA;

}


if(
  savedLangB &&
  LANGUAGES[
    savedLangB
  ]
){

  $("langB").value =
    savedLangB;

}


/* =========================
   CLEANUP
========================= */

window.addEventListener(
  "beforeunload",
  () => {


    sessionId++;


    processingId++;


    activeRecordingId =
      ++recordingId;


    if(
      inactivityTimer
    ){

      clearTimeout(
        inactivityTimer
      );

    }


    speechSynthesis.cancel();


    mediaStream
      ?.getTracks()
      .forEach(
        track =>
          track.stop()
      );

  }
);

</script>
